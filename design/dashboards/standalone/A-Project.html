<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project, Owner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* ==== WDC dashboard kit. One stylesheet for every board and page. See docs/dashboard-overhaul-preferences.md ==== */
body{margin:0}
.wdc{--ad-bg:#f6f7fb;--ad-panel:#fff;--ad-panel-2:#f2f3f9;--ad-ink:#0e0e2c;--ad-dim:#5c5c7a;--ad-line:#e4e6f0;--ad-line-2:#c9ccdc;--ad-hover:#eceefa;--ad-fill:#000065;--ad-on-fill:#fff;--ad-fill-hover:#23239b;--ad-dot:#ff6500;--ad-accent-ink:#b84a00;--ad-focus:#0e0e2c;--ad-tone-good:#15803d;--ad-tone-warn:#a16207;--ad-tone-bad:#c62828;--ad-bad-ink:#c62828;--ad-tone-live:#b84a00;--ad-tone-neutral:#5c5c7a;--ad-tone-flat:#e4e6f0;--ad-on-flat:#0e0e2c;--ad-tone-brand:#000065;--ad-hero:#000065;--ad-hero-line:#000065;--ad-hero-dim:#d6d8f5;--ad-series-1:#000065;--ad-series-2:#ff6500;--ad-ring:rgba(0,0,101,.12);--ad-nav-on:#000065;--ad-nav-on-ink:#fff;--ad-stage:#e4e6ef;--ad-sh-1:0 1px 2px rgb(14 14 44/.05),0 4px 12px rgb(14 14 44/.04);--ad-sh-2:0 6px 14px rgb(14 14 44/.08),0 18px 40px rgb(14 14 44/.10);--ad-sh-3:0 10px 20px rgb(14 14 44/.10),0 36px 72px rgb(14 14 44/.20);--ease:cubic-bezier(.16,1,.3,1);--spring:linear(0,.006,.025 2.8%,.101 6.1%,.539 18.9%,.721 25.3%,.849 31.5%,.937 38.1%,.968 41.8%,.991 45.7%,1.006 50.1%,1.015 55%,1.017 63.9%,1.001);--out:cubic-bezier(.4,0,1,1);--ad-act:#b84a00;--ad-act-hover:#15803d;background:var(--ad-stage);color:var(--ad-ink);font:400 14px/1.5 'Outfit',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;accent-color:var(--ad-fill);caret-color:var(--ad-ink)}
.wdc.dark{--ad-bg:#06061c;--ad-panel:#0e0e2e;--ad-panel-2:#121238;--ad-ink:#eef0fb;--ad-dim:#9b9dc4;--ad-line:#1e2046;--ad-line-2:#33366a;--ad-hover:#1b1b4a;--ad-fill:#b84a00;--ad-fill-hover:#a33c00;--ad-dot:#b84a00;--ad-accent-ink:#ff6500;--ad-focus:#eef0fb;--ad-bad-ink:#ff8a8a;--ad-tone-live:#b84a00;--ad-tone-neutral:#3a3c6e;--ad-tone-flat:#2a2c56;--ad-on-flat:#eef0fb;--ad-tone-brand:#23239b;--ad-hero:#121238;--ad-hero-line:#2e3070;--ad-series-1:#7377ff;--ad-series-2:#b84a00;--ad-ring:rgba(115,119,255,.26);--ad-nav-on:#ffffff;--ad-nav-on-ink:#000065;--ad-stage:#02020c;--ad-sh-1:0 1px 2px rgb(0 0 0/.35);--ad-sh-2:0 6px 14px rgb(0 0 0/.4),0 18px 40px rgb(0 0 0/.4);--ad-sh-3:0 10px 20px rgb(0 0 0/.45),0 36px 72px rgb(0 0 0/.55)}
.wdc *{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--ad-line-2) transparent}
.wdc ::selection{background:var(--ad-fill);color:var(--ad-on-fill)}
.wdc h1,.wdc h2,.wdc h3,.disp{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.wdc p{margin:0;text-wrap:wrap}
.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:where(.wdc) a{color:inherit;text-decoration:none}
:where(.wdc) button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
:where(.wdc) input,:where(.wdc) textarea{font:inherit;color:inherit}
/* Keyboard focus: ink, never orange. Text fields show focus on their container, never an outline on the input itself. */
.wdc :is(a,button,[tabindex]):focus-visible{outline:2px solid var(--ad-focus);outline-offset:2px}
.wdc :is(input,textarea,select),.wdc :is(input,textarea,select):focus,.wdc :is(input,textarea,select):focus-visible{outline:none !important}
.onDark :is(a,button):focus-visible{outline-color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .22s var(--ease)}
.logo{fill:currentColor;flex:none}

/* ---- buttons ---- */
.btn,.btn2,.hb,.hb2,.btnD,.btnG{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;white-space:nowrap;transition:background .18s,color .18s,border-color .18s,box-shadow .22s,transform .22s var(--spring)}
.btn{border:1px solid var(--ad-fill);background:var(--ad-fill);color:var(--ad-on-fill)}
.btn:hover{background:var(--ad-fill-hover);border-color:var(--ad-fill-hover);transform:translateY(-1px);box-shadow:0 8px 18px rgb(0 0 101/.22)}
.dark .btn:hover{box-shadow:0 8px 18px rgb(184 74 0/.28)}
.btn2{border:1px solid var(--ad-line);background:var(--ad-panel);color:var(--ad-ink);padding:0 16px}
.btn2:hover{border-color:var(--ad-ink);background:var(--ad-hover);transform:translateY(-1px)}
.btnD{border:1px solid #c62828;background:#c62828;color:#fff}
.btnD:hover{background:#a51f1f;border-color:#a51f1f;transform:translateY(-1px);box-shadow:0 8px 18px rgb(198 40 40/.3)}
.btnG{border:1px solid #15803d;background:#15803d;color:#fff}
.btnG:hover{background:#116a32;border-color:#116a32;transform:translateY(-1px);box-shadow:0 8px 18px rgb(21 128 61/.3)}
/* The deck card's main action: brand deep orange (white 5.2:1, 3.4:1 against the navy card). Doing it turns green. */
.hb{background:var(--ad-act);color:#fff;border:1px solid var(--ad-act);font-weight:700;position:relative;overflow:hidden}
.hb:hover{background:var(--ad-act-hover);border-color:var(--ad-act-hover);transform:translateY(-2px);box-shadow:0 10px 24px rgb(21 128 61/.42)}
.hb:active{background:#116a32;border-color:#116a32;transform:scale(.97)}
.hb2{background:transparent;color:#fff;border:1px solid rgb(255 255 255/.7);padding:0 16px}
.hb2:hover{background:#fff;color:#000065;border-color:#fff;transform:translateY(-1px)}
.btn:active,.btn2:active,.hb2:active,.btnD:active,.btnG:active,.ibtn:active{transform:scale(.96)}
.btn:hover .arr,.lnk:hover .arr,.btn2:hover .arr,.hb:hover .arr{transform:translateX(3px)}
.btn:disabled,.btnD:disabled,.btnG:disabled,.btn2:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.ibtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--ad-line);background:var(--ad-panel);position:relative;flex:none;transition:border-color .18s,background .18s,color .18s,transform .22s var(--spring)}
.ibtn:hover{border-color:var(--ad-ink);background:var(--ad-hover)}
.ibtn.ghostB{border-color:transparent;background:transparent}
.ibtn.ghostB:hover{background:var(--ad-hover)}
.xBtn:hover,.signOut:hover{background:#c62828 !important;border-color:#c62828 !important;color:#fff !important}
.xBtn:hover .ic{transform:rotate(90deg)}
.bell:hover .ic{animation:ring .5s var(--ease)}
@keyframes ring{20%{transform:rotate(14deg)}45%{transform:rotate(-10deg)}70%{transform:rotate(5deg)}}
.lnk{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--ad-accent-ink);font-weight:600;text-underline-offset:4px;white-space:nowrap}
.lnk:hover{text-decoration:underline}
.hotdog .bun,.hotdog .dog{transform-box:fill-box;transform-origin:center;transition:transform .3s var(--spring)}
.menuBtn:hover .bunT{transform:translateY(-2px) scaleX(1.08)}
.menuBtn:hover .bunB{transform:translateY(2px) scaleX(1.08)}
.menuBtn:active .dog{transform:scaleX(.86)}

/* ---- surfaces ---- */
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.card{background:var(--ad-panel);border:1px solid var(--ad-line);border-radius:20px;box-shadow:var(--ad-sh-1);min-width:0}
.cq{container-type:inline-size;container-name:card}
.lift{transition:transform .25s var(--ease),box-shadow .25s,border-color .2s}
.lift:hover{transform:translateY(-3px);box-shadow:var(--ad-sh-2);border-color:var(--ad-series-1)}
.lift:active{transform:translateY(-1px) scale(.985);transition-duration:.08s}
.rowh{transition:background .15s,transform .08s}
.rowh:hover{background:var(--ad-hover)}
.rowh:active{transform:scale(.99)}
.stat{position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--k);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.stat:hover::before,.stat:focus-visible::before{transform:scaleX(1)}
.secH{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.secH h2{font-size:17px;font-weight:700}

/* ---- segmented control, tabs, fields ---- */
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:12px;background:var(--ad-panel-2);border:1px solid var(--ad-line)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));transform:translateX(calc(100% * var(--i)));background:var(--ad-panel);border-radius:9px;box-shadow:var(--ad-sh-1);transition:transform .42s var(--spring)}
.seg button,.seg a{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 12px;border-radius:9px;font-weight:600;color:var(--ad-dim);white-space:nowrap;transition:color .2s,transform .2s var(--spring)}
.seg .on{color:var(--ad-ink)}
.seg button:not(.on):hover,.seg a:not(.on):hover{color:var(--ad-ink)}
.seg button:active{transform:scale(.95)}
/* Each tab draws its own underline, so the marker can never disagree with the selected tab. */
.tabs{position:relative;display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--ad-line);overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.tab{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;font-weight:600;color:var(--ad-dim);white-space:nowrap;border-radius:10px 10px 0 0;transition:color .2s,background .2s,transform .2s var(--spring)}
.tab::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ad-dot);transform:scaleX(0);transition:transform .38s var(--spring)}
.tab:hover{color:var(--ad-ink);background:var(--ad-panel-2)}
.tab.on,.tab[aria-selected="true"]{color:var(--ad-ink)}
.tab.on::after,.tab[aria-selected="true"]::after{transform:scaleX(1)}
.tab:active{transform:scale(.96)}
.field{display:flex;flex-direction:column;gap:6px}
.field > span:first-child{font-weight:600;font-size:13px}
.sfield,.input{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--ad-line);background:var(--ad-panel);min-width:0;transition:flex-basis .35s var(--ease),border-color .2s,box-shadow .25s}
.sfield{flex:0 1 220px}
.sfield:focus-within,.input:focus-within{border-color:var(--ad-series-1);box-shadow:0 0 0 4px var(--ad-ring)}
.sfield:focus-within{flex-basis:320px}
.sfield input,.input input{flex:1;min-width:0;border:0;background:transparent;min-height:40px}
.sfield .clr{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ad-dim)}
.sfield .clr:hover{background:var(--ad-panel-2);color:var(--ad-ink)}
.area{width:100%;min-height:96px;resize:vertical;padding:12px 14px;border-radius:14px;border:1px solid var(--ad-line);background:var(--ad-panel-2);line-height:1.5;transition:border-color .2s,box-shadow .2s}
.area:focus{border-color:var(--ad-series-1);box-shadow:0 0 0 4px var(--ad-ring)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--ad-line);cursor:pointer;transition:border-color .2s,background .2s}
.chk:hover{border-color:var(--ad-ink)}
.chk.on{border-color:var(--ad-series-1);background:var(--ad-hover)}
.box{width:20px;height:20px;border-radius:6px;border:2px solid var(--ad-line-2);flex:none;display:flex;align-items:center;justify-content:center;transition:background .18s,border-color .18s;margin-top:1px}
.chk.on .box,.box.on{background:var(--ad-fill);border-color:var(--ad-fill);color:var(--ad-on-fill)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--ad-line-2);flex:none;display:flex;align-items:center;justify-content:center;transition:border-color .18s}
.radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--ad-fill);transform:scale(0);transition:transform .25s var(--spring)}
.on > .radio,.radio.on{border-color:var(--ad-fill)}
.on > .radio::after,.radio.on::after{transform:scale(1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--ad-line);background:var(--ad-panel);font-weight:600;font-size:13px;transition:background .18s,color .18s,border-color .18s,transform .2s var(--spring)}
.chip:hover{border-color:var(--ad-ink)}
.chip.on{background:var(--ad-fill);border-color:var(--ad-fill);color:var(--ad-on-fill)}
.chip:active{transform:scale(.95)}

/* ---- navigation: the active page is a solid fill (navy on light, white on dark), never an orange line ---- */
.nav a,.nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--ad-dim);font-weight:500;width:100%;white-space:nowrap;transition:background .15s,color .15s}
.nav a:hover,.nav button:hover{background:var(--ad-hover);color:var(--ad-ink)}
.nav a:hover .ic{transform:translateX(2px)}
.nav .on,.nav .on:hover{background:var(--ad-nav-on);color:var(--ad-nav-on-ink);font-weight:600}
.nav .ic path{stroke-dasharray:1;animation:draw 1.1s var(--ease) backwards}
.nav > :nth-child(2) .ic path{animation-delay:.06s}.nav > :nth-child(3) .ic path{animation-delay:.12s}.nav > :nth-child(4) .ic path{animation-delay:.18s}.nav > :nth-child(5) .ic path{animation-delay:.24s}.nav > :nth-child(6) .ic path{animation-delay:.3s}.nav > :nth-child(7) .ic path{animation-delay:.36s}.nav > :nth-child(8) .ic path{animation-delay:.42s}
.navCount{position:absolute;top:-9px;right:-12px;height:18px;min-width:18px;padding:0 5px;justify-content:center;font-size:11px;color:#fff;border:2px solid var(--ad-panel)}
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translate(-4px,-50%);opacity:0;pointer-events:none;background:var(--ad-ink);color:var(--ad-bg);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;transition:opacity .15s,transform .15s var(--ease);z-index:40}
.side.mini .tip:hover::after,.side.mini .tip:focus-visible::after{opacity:1;transform:translate(0,-50%)}
.tipU{position:relative}
.tipU::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);opacity:0;pointer-events:none;background:var(--ad-ink);color:var(--ad-bg);font:600 12px 'Outfit',system-ui,sans-serif;padding:6px 10px;border-radius:8px;white-space:nowrap;transition:opacity .15s,transform .15s var(--ease);z-index:40}
.tipU:hover::after,.tipU:focus-visible::after{opacity:1;transform:translate(-50%,0)}

/* ---- preview chrome ---- */
.pvbar{display:flex;align-items:center;justify-content:center;gap:10px 16px;padding:10px 16px;flex-wrap:wrap;color:var(--ad-dim);font-size:13px}
.device{margin:0 auto;position:relative;background:var(--ad-bg);transition:width .45s var(--ease)}
.device.framed{transform:translateZ(0);overflow:hidden;border-radius:34px;border:10px solid #0e0e2c;box-shadow:var(--ad-sh-3);margin:6px auto 48px}
.dark .device.framed{border-color:#2a2c56}
.scroller{container-type:inline-size;container-name:app;background:var(--ad-bg);min-height:calc(100vh - 60px)}
.device.framed .scroller{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.device.framed .scroller::-webkit-scrollbar{display:none}
.wdc.locked .device.framed .scroller{overflow:hidden}

/* ---- shell ---- */
.shell{display:flex;align-items:stretch;min-height:100%}
.side{width:244px;flex:none;background:var(--ad-panel);border-right:1px solid var(--ad-line);transition:width .3s var(--ease)}
.sideIn{position:sticky;top:0;display:flex;flex-direction:column;gap:14px;padding:18px 14px;height:100vh}
.device.framed .sideIn{height:calc(var(--devH) - 20px)}
.sideScroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:18px;margin:0 -6px;padding:2px 6px;overscroll-behavior:contain}
.sideFoot{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--ad-line)}
.side.mini{width:78px}
.side.mini .lbl{display:none !important}
.railOnly{display:none !important}
.side.mini .railOnly{display:inline-flex !important}
.side.mini .sideScroll{overflow:visible}
.footRow{display:flex;gap:6px}
.footBtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--ad-line);background:var(--ad-panel);color:var(--ad-dim);font-weight:600;font-size:13px;white-space:nowrap;transition:background .18s,color .18s,border-color .18s,transform .2s var(--spring)}
.footBtn:hover{border-color:var(--ad-ink);color:var(--ad-ink);background:var(--ad-hover)}
.footBtn:hover .ic{transform:rotate(-12deg)}
.footBtn:active{transform:scale(.95)}
.collapseB{flex:none;width:44px;padding:0}
.side .collapseB:hover::after{opacity:1;transform:translate(0,-50%)}
.side.mini .footRow{flex-direction:column;align-items:center}
.side.mini .footBtn{flex:none;width:44px;padding:0}
.profile{display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;border:1px solid var(--ad-line);background:var(--ad-panel-2)}
.side.mini .profile{flex-direction:column;padding:8px 4px;gap:6px}
.av0{width:38px;height:38px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font:700 13px 'Space Grotesk',system-ui,sans-serif;flex:none}
.installC{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;border:1px solid var(--ad-line);background:var(--ad-panel)}
.installC .xmini{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ad-dim);transition:background .15s,color .15s}
.installC .xmini::before{content:'';position:absolute;inset:-6px}
.installC .xmini:hover{background:#c62828;color:#fff}
.instBar{height:6px;border-radius:99px;background:var(--ad-line);overflow:hidden}
.instBar span{display:block;height:100%;background:var(--ad-series-1);border-radius:99px;transform-origin:left;animation:instGrow 1.6s var(--ease) forwards}
@keyframes instGrow{from{transform:scaleX(.04)}to{transform:scaleX(1)}}
.menuBtn,.showS{display:none !important}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 28px;background:var(--ad-bg);border-bottom:1px solid var(--ad-line)}
.pgTitle{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.searchBtn{flex:1;max-width:480px;justify-content:flex-start;color:var(--ad-dim);font-weight:500}
.mainPad{padding:26px 28px 56px;display:flex;flex-direction:column;gap:22px;max-width:1360px;width:100%}
.h1{font-size:clamp(22px,2.4vw,30px);font-weight:700;line-height:1.15}
.lede{font-size:15px;color:var(--ad-dim)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 356px;gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.railCards{display:flex;flex-direction:column;gap:16px}

/* ---- the deck ---- */
.deck{position:relative;padding-bottom:18px;overflow-x:clip;overflow-clip-margin:28px;perspective:1400px}
.ghost{position:absolute;left:18px;right:18px;height:60px;bottom:6px;border-radius:24px;background:var(--ad-hero);opacity:.45;border:1px solid var(--ad-hero-line);transition:transform .55s var(--spring),opacity .45s ease}
.ghost.g2{left:36px;right:36px;bottom:-4px;opacity:.22}
.deck.shift .ghost{transform:translateY(-14px) scaleX(1.03);opacity:.8}
.deck.shift .ghost.g2{transform:translateY(-10px) scaleX(1.03);opacity:.45}
.topCard{position:relative;z-index:2;background:var(--ad-hero);border:1px solid var(--ad-hero-line);color:#fff;border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--ad-sh-2);container-type:inline-size;container-name:deck;transform-origin:50% 100%}
.topCard:focus-visible{outline:2px solid #fff;outline-offset:4px}

.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;padding:4px 20px 18px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory}
.bCol{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:var(--ad-panel-2);border:1px solid var(--ad-line);min-width:0;scroll-snap-align:start;align-self:start}
.bHead{display:flex;align-items:center;gap:8px;padding:4px 4px 6px;font-size:14px}
.bHead strong{flex:1}
.bDot{width:8px;height:8px;border-radius:50%;flex:none}
.bCard{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;background:var(--ad-panel);border:1px solid var(--ad-line);text-align:left;width:100%}
.bCard:hover{border-color:var(--ad-line-2)}
.bEmpty{font-size:13px;color:var(--ad-dim);padding:10px 4px}
@container card (max-width:700px){.board{grid-template-columns:repeat(4,minmax(240px,82%))}}
/* ---- project page ---- */
.blocker{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;border:1px solid var(--ad-line);background:var(--ad-panel)}
.blockActs{display:flex;gap:8px;flex-wrap:wrap}
@container card (max-width:520px){.blockActs{flex:1 1 100%}.blockActs > *{flex:1 1 0}}
.projSwitch{align-self:flex-start;max-width:100%}
.monthGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgHead{font-size:12px;font-weight:600;color:var(--ad-dim);text-align:center;padding:4px 0}
.mgCell{min-height:68px;border-radius:12px;border:1px solid var(--ad-line);background:var(--ad-panel);display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:6px 8px;text-align:left;transition:border-color .15s,background .15s}
.mgCell:hover:not([disabled]){border-color:var(--ad-line-2);background:var(--ad-hover)}
.mgCell[disabled]{background:transparent;border-color:transparent;cursor:default}
.mgCell.today{border-color:var(--ad-ink)}
.mgN{font-size:13px;font-weight:600}
.mgCell.out .mgN{color:var(--ad-dim);opacity:.6}
.mgDots{display:flex;gap:3px;flex-wrap:wrap}
.mgDot{width:8px;height:8px;border-radius:50%}
.mgMore{font-size:11px;color:var(--ad-dim)}
@container card (max-width:520px){.mgCell{min-height:48px;padding:4px 5px}.mgMore{display:none}}
@container app (max-width:640px){.pgTitle.showS{display:block !important;flex:0 1 auto}}

/* Figure cards: a solid icon tile with a white icon beside the label (no dots). Phones show at most two cards a row. */
.statHd{display:flex;align-items:center;gap:10px;color:var(--ad-dim);font-size:13px;min-width:0}
.statIc{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.statLbl{min-width:0;line-height:1.25}
.stat{gap:10px !important}
@container app (max-width:640px){.bento{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px}.bento .stat:last-child:nth-child(odd){grid-column:1 / -1}.stat .statIc{width:30px;height:30px;border-radius:9px}}
/* Owner · Clients rail: pipeline rows and the service filter list */
.pipeRow{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:7px 10px;border-radius:12px;width:100%;text-align:left;min-height:44px}
.svcRow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;width:100%;text-align:left;min-height:44px}
.svcIc{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.svcRow.on{background:var(--ad-nav-on);color:var(--ad-nav-on-ink)}
.svcRow.on .num{color:inherit !important;opacity:.8}
.svcRow.on .miniBar{background:transparent;box-shadow:inset 0 0 0 1px var(--ad-nav-on-ink)}
.svcRow.on .miniBar span{background:var(--ad-nav-on-ink)}
.svcRow.on .svcIc{background:var(--ad-nav-on-ink) !important;color:var(--ad-nav-on)}
.liveDot{width:8px;height:8px;border-radius:50%;background:var(--ad-tone-good);box-shadow:0 0 0 0 rgb(21 128 61/.5);animation:pulseDot 2s ease-out infinite}
@media (prefers-reduced-motion:reduce){.liveDot{animation:none}}

/* Messages: a list and a thread side by side, one pane at a time on narrow screens */
.msgWrap{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:16px;align-items:stretch;min-height:560px}
.msgList{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.msgRows{flex:1;overflow:auto}
.msgRow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px;border-radius:14px;min-height:64px;transition:background .15s}
@media (hover:hover){.msgRow:hover{background:var(--ad-hover)}}
.msgRow:active{background:var(--ad-panel-2)}
.msgRow.on,.msgRow.on:hover{background:var(--ad-nav-on);color:var(--ad-nav-on-ink)}
.msgRow.on span,.msgRow.on strong{color:var(--ad-nav-on-ink) !important}
.msgRow.on .tag{background:var(--ad-nav-on-ink) !important;color:var(--ad-nav-on) !important}
.msgThread{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.thHead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ad-line)}
.backBtn{display:none}
.ctxStrip{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--ad-line);overflow-x:auto;scrollbar-width:none}
.ctxStrip::-webkit-scrollbar{display:none}
.ctxChip{display:inline-flex;align-items:center;gap:8px;flex:none;min-height:44px;padding:0 14px;border-radius:99px;background:var(--ad-panel-2);border:1px solid var(--ad-line);font-size:13px;font-weight:500;max-width:340px;transition:background .15s,border-color .15s}
@media (hover:hover){.ctxChip:hover{background:var(--ad-hover);border-color:var(--ad-line-2)}}
.thBody{flex:1;min-height:260px;max-height:520px;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column-reverse;gap:14px;padding:16px 14px}
.msgItem{display:flex;gap:10px;align-items:flex-end}
.msgItem.mine{flex-direction:row-reverse}
.msgItem.ev{justify-content:center}
.evChip{display:inline-flex;align-items:center;gap:6px;background:var(--ad-tone-flat);color:var(--ad-on-flat);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:500}
.bubbleCol{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:min(560px,82%)}
.mine .bubbleCol{align-items:flex-end}
.bMeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ad-dim)}
.bMeta strong{color:var(--ad-ink);font-weight:600}
.bubble{display:block;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--ad-panel-2);border:1px solid var(--ad-line);white-space:pre-wrap;overflow-wrap:anywhere}
.mine .bubble{border-radius:18px 18px 6px 18px;background:var(--ad-fill);border-color:var(--ad-fill);color:var(--ad-on-fill)}
.bubble.note{background:var(--ad-panel);border:1px dashed var(--ad-line-2);color:var(--ad-ink)}
.fileCard{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--ad-panel);border:1px solid var(--ad-line);min-height:52px;max-width:100%;transition:background .15s}
@media (hover:hover){.fileCard:hover{background:var(--ad-hover)}}
.bStatus{font-size:12px;color:var(--ad-dim)}
.composer{border-top:1px solid var(--ad-line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.qrRow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.qrRow::-webkit-scrollbar{display:none}
.qrRow .chip{flex:none}
.compBox{border:1px solid var(--ad-line-2);border-radius:16px;background:var(--ad-panel);transition:border-color .15s,box-shadow .15s}
.compBox:focus-within{border-color:var(--ad-ink);box-shadow:0 0 0 4px var(--ad-ring)}
.compBox textarea{width:100%;border:0;outline:0;background:transparent;resize:none;padding:12px 14px 4px;font:inherit;color:var(--ad-ink);min-height:56px}
.compBar{display:flex;align-items:center;gap:8px;padding:6px 8px 8px 8px}
@container app (max-width:760px){
  .msgWrap{grid-template-columns:minmax(0,1fr);min-height:0}
  .msgWrap.isThread .msgList{display:none}
  .msgWrap:not(.isThread) .msgThread{display:none}
  .backBtn{display:inline-flex}
  .thBody{max-height:none;min-height:340px}
  .bubbleCol{max-width:88%}
}
.msgList .sfield{flex:none;height:44px;width:100%}
.composer .seg button{min-height:44px}

/* Support: the help hero and the article grid */
.helpHero{background:var(--ad-hero);border:1px solid var(--ad-hero-line);color:#fff;border-radius:24px;padding:clamp(20px,3cqi,28px);display:flex;flex-direction:column;gap:16px;box-shadow:var(--ad-sh-2);container-type:inline-size}
.heroSearch{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:14px;background:#fff;color:#0e0e2c;transition:box-shadow .2s}
.heroSearch:focus-within{box-shadow:0 0 0 4px rgb(255 255 255/.28)}
.heroSearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:#0e0e2c;min-height:48px}
.heroSearch input::placeholder{color:#5c5c7a}
.heroSearch .clr{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#5c5c7a}
.heroChips{display:flex;flex-wrap:wrap;gap:8px}
.heroChip{min-height:44px;padding:0 16px;border-radius:99px;background:rgb(255 255 255/.12);border:1px solid rgb(255 255 255/.28);color:#fff;font-size:13px;font-weight:500;transition:background .15s,color .15s}
@media (hover:hover){.heroChip:hover{background:#fff;color:#000065}}
.heroChip:active{background:#fff;color:#000065}
.kbGrid{list-style:none;margin:0;padding:4px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,20rem),1fr));gap:12px}
.kbCard{display:flex;gap:12px;align-items:flex-start;width:100%;height:100%;padding:14px;border-radius:16px;border:1px solid var(--ad-line);background:var(--ad-panel);transition:background .15s,border-color .15s,transform .15s var(--ease)}
@media (hover:hover){.kbCard:hover{background:var(--ad-hover);border-color:var(--ad-line-2);transform:translateY(-2px)}}
.kbCard:active{transform:scale(.99)}

/* Settings: select button, list rows, tick grid, disabled controls that read as disabled */
.selBtn{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--ad-line);background:var(--ad-panel);width:100%;max-width:360px;transition:border-color .15s,box-shadow .15s}
@media (hover:hover){.selBtn:hover{border-color:var(--ad-line-2)}}
.selBtn[aria-expanded="true"]{border-color:var(--ad-ink);box-shadow:0 0 0 4px var(--ad-ring)}
.selBtn:disabled,.input:has(:disabled),.switch:disabled,.btn2:disabled,.btn:disabled{background:var(--ad-tone-flat);color:var(--ad-dim);border-color:var(--ad-tone-flat);cursor:not-allowed;opacity:1}
.switch:disabled{background:var(--ad-line)}
.input.err{border-color:var(--ad-bad-ink)}
.listRow{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;min-height:64px;flex-wrap:wrap;border-top:1px solid var(--ad-line)}
.listRow:first-child{border-top:0}
.lrTile{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.lrTile.round{border-radius:50%}
.gridSw{margin:0 auto;display:block}
.setRow textarea::placeholder{color:var(--ad-dim)}

/* Project page: the service tab's rows and checklists */
.wRow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 8px;border-radius:14px;min-height:60px;text-align:left}
.ckBox{width:24px;height:24px;border-radius:8px;border:2px solid var(--ad-line-2);display:grid;place-items:center;flex:none;color:transparent;background:var(--ad-panel);transition:background .2s,border-color .2s,color .2s}
.ckBox.on{background:var(--ad-tone-good);border-color:var(--ad-tone-good);color:#fff}
.projSwitch button{min-height:44px}

/* Billing: the pay card and its provider strip */
.payOpts{display:flex;gap:10px;flex-wrap:wrap}
.payOpt{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:14px;background:#fff;color:#0e0e2c;font-size:13px}
.payRow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;min-height:56px}
.payLogo{width:84px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--ad-line);display:grid;place-items:center;flex:none;padding:0 8px}
.paidCard{padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}

/* Touch: segmented buttons and chart bars reach 44px on narrow screens and touch devices */
@container app (max-width:900px){.seg button,.seg a{min-height:44px}.plot{gap:0}}
@media (pointer:coarse){.seg button,.seg a{min-height:44px}}

/* ===== kit2: searchable lists, pickers, media, wrapping footers ===== */
.ssHead{display:flex;flex-direction:column;gap:8px}
.ssChosen{display:flex;flex-wrap:wrap;gap:6px}
.ssChip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 4px 4px 6px;border-radius:999px;background:var(--ad-fill);color:var(--ad-on-fill);font-weight:600;font-size:13px;max-width:100%}
.ssChip .av0{box-shadow:0 0 0 2px var(--ad-on-fill)}
.ssChipT{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ssX{position:relative;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:inherit;transition:background .15s}
.ssX::after{content:'';position:absolute;inset:-8px}
.ssChip .ssX:hover{background:rgba(255,255,255,.22)}
.ssIn .ssX{color:var(--ad-dim)}.ssIn .ssX:hover{background:var(--ad-hover);color:var(--ad-ink)}
.ssIn svg{color:var(--ad-dim);flex:none}
.ssFoot{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
.ssRange{font-size:12px;color:var(--ad-dim)}
.ssPg{display:inline-flex;gap:6px}
.ssNone{padding:14px;border-radius:12px;background:var(--ad-panel-2);color:var(--ad-dim);font-size:14px;text-align:center}
.ssCreate{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:12px;border:1px dashed var(--ad-line-2);font-weight:600;width:100%;text-align:left;transition:border-color .2s,background .2s}
.ssCreate:hover{border-color:var(--ad-ink);background:var(--ad-hover)}
.ssForm{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--ad-line);background:var(--ad-panel-2);animation:rise .3s var(--ease) backwards}
.ssFormActs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.sqbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--ad-line-2);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;transition:background .18s,border-color .18s,color .18s}
.on > .sqbox{background:var(--ad-fill);border-color:var(--ad-fill);color:var(--ad-on-fill)}
.sqbox .ic{stroke-width:3}
.pickBtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--ad-line);background:var(--ad-panel);text-align:left;transition:border-color .15s,box-shadow .15s}
.pickBtn:hover{border-color:var(--ad-line-2)}
.pickBtn[aria-expanded="true"]{border-color:var(--ad-ink);box-shadow:0 0 0 4px var(--ad-ring)}
.pickBtn .pv{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickBtn .phTxt{color:var(--ad-dim)}
.pickBtn svg{color:var(--ad-dim);flex:none}
.adCal{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;border:1px solid var(--ad-line);background:var(--ad-panel);animation:rise .28s var(--ease) backwards;min-width:0}
.calHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calNav{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--ad-ink);transition:background .15s}
.calNav:hover{background:var(--ad-panel-2)}
.calTitle{min-height:44px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;font:700 16px 'Space Grotesk',system-ui,sans-serif}
.calTitle:hover{background:var(--ad-panel-2)}.calTitle svg{color:var(--ad-dim)}
.calRange{font:700 16px 'Space Grotesk',system-ui,sans-serif}
.calGrid{width:100%;border-collapse:collapse;table-layout:fixed}
.calGrid th{padding:2px 0 6px;font-size:12px;font-weight:600;color:var(--ad-dim);text-align:center}
.calGrid td{padding:1px;text-align:center}
.calDay{width:100%;max-width:44px;aspect-ratio:1;min-height:40px;display:inline-grid;place-items:center;border-radius:10px;font-variant-numeric:tabular-nums;transition:background .12s,color .12s}
.calDay:hover{background:var(--ad-panel-2)}
.calDay.is-today{box-shadow:inset 0 0 0 1.5px var(--ad-dim);font-weight:700}
.calDay.is-on,.calDay.is-on:hover{background:var(--ad-fill);color:var(--ad-on-fill);font-weight:700;box-shadow:none}
.calDay[aria-disabled="true"]{color:var(--ad-dim);text-decoration:line-through;cursor:not-allowed;background:transparent;opacity:.6}
.calPicks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.calPick{min-height:48px;border-radius:10px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .12s}
.calPick:hover{background:var(--ad-panel-2)}
.calPick.is-here{box-shadow:inset 0 0 0 1.5px var(--ad-dim)}
.calPick.is-on,.calPick.is-on:hover{background:var(--ad-fill);color:var(--ad-on-fill);box-shadow:none}
.calFoot{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--ad-line)}
.timeList{display:flex;flex-direction:column;gap:2px;max-height:calc(5 * 44px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;border-radius:10px}
.timeRow{min-height:44px;flex:none;padding:0 12px;border-radius:10px;text-align:left;font-variant-numeric:tabular-nums;font-weight:500}
.timeRow:hover{background:var(--ad-panel-2)}
.timeRow.is-on,.timeRow.is-on:hover{background:var(--ad-fill);color:var(--ad-on-fill);font-weight:700}
.dropZone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;border-radius:14px;border:1px dashed var(--ad-line-2);background:var(--ad-panel-2);text-align:center;color:var(--ad-dim);font-size:14px}
.dzActs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fileBtn{position:relative;cursor:pointer;overflow:hidden}
.fileBtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.mediaGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.mediaTile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--ad-panel-2);border:1px solid var(--ad-line)}
.mediaTile img,.mediaTile video{width:100%;height:100%;object-fit:cover;display:block}
.mediaX{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;background:#0e0e2c;color:#fff;display:grid;place-items:center;transition:background .15s}
.mediaX::after{content:'';position:absolute;inset:-6px}
.mediaX:hover{background:#c62828}
.mediaName{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;background:#0e0e2c;background:linear-gradient(transparent,#0e0e2c);color:#fff;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vidTag{position:absolute;left:6px;top:6px;padding:2px 8px;border-radius:99px;background:#0e0e2c;color:#fff;font-size:11px;font-weight:600}
/* long labels wrap instead of overflowing the footer */
.shFoot .btn,.shFoot .btn2,.shFoot .btnD,.shFoot .btnG{white-space:normal;text-align:center;line-height:1.25;padding-top:8px;padding-bottom:8px;height:auto;min-width:0}
.btn,.btn2,.btnD,.btnG{max-width:100%}
/* a side sheet can be pulled wider or narrower from its left edge */
.sheetEdge{position:absolute;left:-6px;top:0;bottom:0;width:14px;cursor:ew-resize;touch-action:none;z-index:3;display:none}
.sheetEdge::after{content:'';position:absolute;left:5px;top:50%;width:4px;height:44px;margin-top:-22px;border-radius:9px;background:var(--ad-line-2);opacity:0;transition:opacity .2s,background .2s}
.sheetP:hover .sheetEdge::after,.sheetEdge.dragging::after{opacity:1}
.sheetEdge:hover::after,.sheetEdge.dragging::after{background:var(--ad-dim)}
@media (min-width:601px){.wdc:not(.isPhone) .sheetEdge{display:block}}
.sheetP{width:min(var(--shW,480px),100%)}
.sheetP.wide{width:min(var(--shW,720px),100%)}
.shBody > .fieldsLate{order:2}.shBody > .chipsMid,.shBody > sc-for > .chipsMid{order:1}

/* ===== table tools: toolbar, filter chips, bulk bar, row checkboxes ===== */
.tbTools{padding:10px 16px;border-bottom:1px solid var(--ad-line);background:var(--ad-panel)}
.tbRow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-height:44px}
.tbGrow{flex:1 1 0;min-width:0}
.tbBtn{min-height:44px;padding:0 14px}
.fChip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 8px 0 12px;border-radius:999px;background:var(--ad-fill);color:var(--ad-on-fill);font-weight:600;font-size:13px;max-width:100%;transition:transform .2s var(--spring),background .15s}
.fChip:hover{background:var(--ad-fill-hover)}.fChip:active{transform:scale(.96)}

/* ===== Money reports ===== */

.rbT{display:flex;justify-content:space-between;gap:10px;font-size:14px;min-width:0}

.bnkLogo{display:inline-grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;color:#fff;font:700 12px/1 'Space Grotesk',sans-serif;letter-spacing:.02em}

/* Phones: the pinned first column leaves room to see the next one. Titles wrap to two lines. */
@container app (max-width:640px){
  .tbl th:first-child,.tbl td:first-child{min-width:124px;max-width:min(176px,46cqw)}
  .tbl.hasCk th:first-child,.tbl.hasCk td:first-child{min-width:44px;width:44px;max-width:44px;padding-left:10px;padding-right:0}
  .tbl.hasCk th:nth-child(2),.tbl.hasCk td:nth-child(2){left:44px;min-width:124px;max-width:min(176px,46cqw)}
  .tbl td:first-child strong,.tbl.hasCk td:nth-child(2) strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;overflow-wrap:anywhere;font-size:14px;line-height:1.25}
  .tbl td:first-child strong+span,.tbl.hasCk td:nth-child(2) strong+span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbl td,.tbl th{padding-left:12px;padding-right:12px}
}

            <template data-if value="{{hasSwitch}}" hint-placeholder-val="{{ false }}"><div class="seg projSwitch rise" role="group" aria-label="Your projects" style="--n: {{switchN}}; --i: {{switchI}}"><span class="pill" aria-hidden="true"></span><template data-for list="{{switches}}" as="sw" hint-placeholder-count="2"><button class="{{sw.cls}}" aria-pressed="{{sw.pressed}}" onClick="{{sw.pick}}">{{sw.t}}</button></template></div></template>

              </div>
            </div>
            <div class="card cq rise d1" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px" data-tour="stage">

              <span style="font-size: 13px; color: var(--ad-dim)">{{stageNote}}</span>
            </div>
            <div role="tablist" aria-label="Project sections" class="tabs pageTabs rise d1" data-tour="tabs">
              <template data-for list="{{ptabs}}" as="tb" hint-placeholder-count="5"><button role="tab" class="tab {{tb.cls}}" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}">{{tb.label}}<template data-if value="{{tb.hasN}}" hint-placeholder-val="{{ false }}"><span class="tag num" style="background: {{tb.chip}}; color: {{tb.chipInk}}; height: 20px; padding: 0 7px">{{tb.n}}</span></template></button></template>
            </div>

            <template data-if value="{{loading}}" hint-placeholder-val="{{ false }}">
              <div class="layout skWrap" role="status" aria-label="Loading"><div class="col"><div class="skCard" style="gap: 12px"><span class="skel" style="height: 18px; width: 140px"></span><span class="skel" style="height: 60px"></span><span class="skel" style="height: 60px"></span></div><div class="skCard" style="gap: 12px"><span class="skel" style="height: 18px; width: 120px"></span><span class="skel" style="height: 48px"></span><span class="skel" style="height: 48px"></span><span class="skel" style="height: 48px"></span></div></div><div class="railCards"><div class="skCard" style="height: 180px"><span class="skel" style="height: 16px; width: 100px"></span><span class="skel" style="flex: 1"></span></div><div class="skCard" style="height: 200px"><span class="skel" style="height: 16px; width: 80px"></span><span class="skel" style="flex: 1"></span></div></div></div>
            </template>

            <template data-if value="{{ready}}" hint-placeholder-val="{{ true }}">
            <template data-if value="{{isOverview}}" hint-placeholder-val="{{ true }}">
            <div class="layout tabIn" style="animation-name: {{tabAnim}}">

                <template data-if value="{{hasBlockers}}" hint-placeholder-val="{{ true }}">

                    <div class="blocker rowIn" style="animation-name: {{b.anim}}"><span class="noticeIc" style="--nt: {{b.tone}}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="{{b.d}}"></path></svg></span><span style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px"><strong>{{b.t}}</strong><span style="color: var(--ad-dim); font-size: 13px">{{b.s}}</span></span><span class="blockActs"><template data-if value="{{b.hasAlt}}" hint-placeholder-val="{{ false }}"><button class="btn2" style="min-height: 40px" onClick="{{b.alt}}">{{b.altLabel}}</button></template><button class="btn" style="min-height: 40px" onClick="{{b.act}}">{{b.actLabel}}</button></span></div>
                  </template>
                </section>
                </template>
                <template data-if value="{{noBlockers}}" hint-placeholder-val="{{ false }}"><div class="noticeB" style="--nt: var(--ad-tone-good)"><span class="noticeIc"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong>Nothing is blocking this project.</strong><span>{{clearNote}}</span></span></div></template>

                <section class="card cq" aria-label="What happens next" style="overflow: hidden">
                  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 20px 6px"><h2 style="font-size: 17px; font-weight: 700; flex: 1">What happens next</h2><span class="tag num" style="background: var(--ad-tone-flat); color: var(--ad-on-flat)">{{nextN}}</span></div>
                  <ol style="list-style: none; margin: 0; padding: 4px 20px 12px">
                    <template data-for list="{{nextItems}}" as="l" hint-placeholder-count="4"><li class="tlRow"><span class="tlRail" aria-hidden="true"><span class="tlDot {{l.dotCls}}"></span></span><button class="tlBtn" onClick="{{l.open}}"><span style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column"><strong>{{l.t}}</strong><span style="color: var(--ad-dim); font-size: 13px">{{l.s}}</span></span><template data-if value="{{l.hasWho}}" hint-placeholder-val="{{ true }}"><span class="av0" style="width: 28px; height: 28px; font-size: 10px; background: {{l.whoTone}}" title="{{l.whoName}}">{{l.who}}</span></template><span class="num tlTime noAv" style="font-weight: 600; color: {{l.whenCol}}">{{l.when}}</span></button></li></template>
                  </ol>
                </section>
              </div>
              <aside class="railCards" aria-label="Progress and team" data-tour="rail">

                </section>
                <section class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 6px" aria-label="Team">
                  <h2 style="font-size: 16px; font-weight: 700">{{teamTitle}}</h2>
                  <template data-for list="{{team}}" as="m" hint-placeholder-count="2"><button class="rowh" onClick="{{m.open}}" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; width: 100%; text-align: left"><span class="av0" style="width: 34px; height: 34px; font-size: 11px; background: {{m.tone}}">{{m.i}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 13px"><strong>{{m.name}}</strong><span style="color: var(--ad-dim)">{{m.role}}</span></span><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="color: var(--ad-dim)"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg></button></template>
                </section>
                <section class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 4px" aria-label="Key facts">
                  <h2 style="font-size: 16px; font-weight: 700; margin-bottom: 6px">Key facts</h2>

                </section>
              </aside>
            </div>
            </template>

            <template data-if value="{{isTasks}}" hint-placeholder-val="{{ false }}">
              <section class="card cq tabIn" aria-label="Tasks" style="overflow: hidden; animation-name: {{tabAnim}}">
                <div style="display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; flex-wrap: wrap"><h2 style="font-size: 17px; font-weight: 700; flex: 1">Tasks</h2><button class="btn2" onClick="{{addTask}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a task</button></div>

                <div class="tbTools" role="group" aria-label="Tasks tools">
                    <template data-if value="{{TPT.bulk}}" hint-placeholder-val="{{ false }}">
                      <div class="bulkBar" role="region" aria-label="Bulk actions" aria-live="polite">
                        <span class="bkCount num">{{TPT.count}}</span>
                        <span class="bkActs"><template data-for list="{{TPT.acts}}" as="ba" hint-placeholder-count="2"><button class="btn2 bkBtn {{ba.cls}}" onClick="{{ba.fn}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="{{ba.d}}"></path></svg>{{ba.label}}</button></template><button class="btn2 bkBtn" onClick="{{TPT.exportSel}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>Export</button></span>
                        <template data-if value="{{TPT.allMore}}" hint-placeholder-val="{{ false }}"><button class="lnk" onClick="{{TPT.selectAll}}">{{TPT.allLabel}}</button></template>
                        <button class="lnk" onClick="{{TPT.clear}}">Clear</button>
                      </div>
                    </template>
                    <template data-if value="{{TPT.idle}}" hint-placeholder-val="{{ true }}">
                      <div class="tbRow">
                        <template data-if value="{{TPT.hasFilters}}" hint-placeholder-val="{{ true }}"><button class="btn2 tbBtn" onClick="{{TPT.openFilters}}" aria-haspopup="dialog"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"></path></svg>Filters<template data-if value="{{TPT.hasFn}}" hint-placeholder-val="{{ false }}"><span class="tag num" style="background: var(--ad-fill); color: var(--ad-on-fill); height: 20px; padding: 0 7px">{{TPT.fn}}</span></template></button></template>
                        <template data-for list="{{TPT.chips}}" as="fc" hint-placeholder-count="0"><button class="fChip" aria-label="{{fc.aria}}" onClick="{{fc.remove}}">{{fc.t}}<svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></template>
                        <template data-if value="{{TPT.hasChips}}" hint-placeholder-val="{{ false }}"><button class="lnk" onClick="{{TPT.clearFilters}}">Clear all</button></template>
                        <span class="tbGrow"></span>
                        <template data-if value="{{TPT.canImport}}" hint-placeholder-val="{{ false }}"><button class="btn2 tbBtn" onClick="{{TPT.importFn}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>Import</button></template>
                        <template data-if value="{{TPT.canExport}}" hint-placeholder-val="{{ true }}"><button class="btn2 tbBtn" onClick="{{TPT.exportFn}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>Export</button></template>
                      </div>
                    </template>
                  </div>
                  <div class="tblWrap" tabindex="0" aria-label="Tasks table, scrolls sideways">
                  <table class="tbl hasCk"><thead><tr><th scope="col" class="ckc"><button class="ckb {{TPT.headCls}}" role="checkbox" aria-checked="{{TPT.headState}}" aria-label="{{TPT.headAria}}" onClick="{{TPT.togAll}}"><span class="ckbox"><svg class="ic" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span class="dash"></span></span></button></th><th scope="col">Task</th><th scope="col">Who</th><th scope="col">Due</th><th scope="col">Status</th><th scope="col"><span class="sr">Actions</span></th></tr></thead>
                    <tbody><template data-for list="{{trows}}" as="r" hint-placeholder-count="4"><tr class="rowIn {{r.selRow}}" tabindex="0" aria-label="{{r.aria}}" onClick="{{r.open}}" onKeyDown="{{r.key}}" style="animation-name: {{r.anim}}; animation-delay: {{r.delay}}"><td class="ckc"><button class="ckb {{r.selCls}}" role="checkbox" aria-checked="{{r.sel}}" aria-label="{{r.selAria}}" onClick="{{r.togSel}}"><span class="ckbox"><svg class="ic" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span class="dash"></span></span></button></td><td style="white-space: normal; min-width: 240px"><span style="display: flex; flex-direction: column; min-height: 40px; justify-content: center"><strong style="font-weight: 600">{{r.t}}</strong><span style="color: var(--ad-dim); font-size: 12px">{{r.s}}</span></span></td><td><span style="display: inline-flex; align-items: center; gap: 8px"><span class="av0" style="width: 28px; height: 28px; font-size: 10px; background: {{r.tone}}">{{r.i}}</span>{{r.who}}</span></td><td class="num" style="color: {{r.dueCol}}; font-weight: {{r.dueW}}">{{r.due}}</td><td><span class="tag" style="background: {{r.stTone}}; color: {{r.stInk}}">{{r.status}}</span></td><td style="text-align: right"><button class="ibtn ghostB" data-menu="row" aria-expanded="{{r.menuX}}" aria-label="{{r.menuAria}}" aria-haspopup="menu" onClick="{{r.menu}}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path></svg></button></td></tr></template></tbody>
                  </table>
                  <template data-if value="{{tEmpty}}" hint-placeholder-val="{{ false }}"><div class="emptyRow rowIn" style="animation-name: rinA"><strong>{{tEmptyTitle}}</strong><span style="color: var(--ad-dim)">{{tEmptyBody}}</span></div></template>
                </div>

                    <button class="lnk viewAll" onClick="{{TP.all}}">View all<svg class="ic arr" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></button></span>
                  </div>

              </section>
            </template>

            <template data-if value="{{isCal}}" hint-placeholder-val="{{ false }}">
              <section class="card cq tabIn" aria-label="Content calendar" style="overflow: hidden; animation-name: {{tabAnim}}">
                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 16px 20px 14px">
                  <span style="flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column"><h2 style="font-size: 17px; font-weight: 700">Content calendar</h2><span style="font-size: 13px; color: var(--ad-dim)">{{calSummary}}</span></span>
                </div>
                <div class="cal2 rowIn" style="animation-name: {{CALC.anim}}" data-tour="cal">
  <aside class="cal2Side" aria-label="Calendar tools">
    <template data-if value="{{CALC.sideAdd}}" hint-placeholder-val="{{ true }}"><button class="btn cal2Add" onClick="{{CALC.add}}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{CALC.addLabel}}</button></template>
    <div class="miniCal">
      <div class="miniHead"><strong class="miniTitle num">{{CALC.mini.title}}</strong><span class="miniNav"><button class="miniBtn" aria-label="Previous month" onClick="{{CALC.mini.prev}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button><button class="miniBtn" aria-label="Next month" onClick="{{CALC.mini.next}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button></span></div>
      <div class="miniGrid" role="grid" aria-label="{{CALC.mini.title}}">
        <template data-for list="{{CALC.mini.heads}}" as="h" hint-placeholder-count="7"><span class="miniH" role="columnheader">{{h}}</span></template>
        <template data-for list="{{CALC.mini.cells}}" as="c" hint-placeholder-count="35"><button class="miniD {{c.cls}}" role="gridcell" aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}"><span class="num">{{c.n}}</span><span class="miniDot" style="background: {{c.dot}}"></span></button></template>
      </div>
    </div>
    <section class="calList" aria-label="{{CALC.listTitle}}">
      <div class="calListHead"><strong>{{CALC.listTitle}}</strong><button class="calEdit" onClick="{{CALC.editCals}}">Edit</button></div>
      <template data-for list="{{CALC.cals}}" as="c" hint-placeholder-count="4"><button class="calRow" role="checkbox" aria-checked="{{c.on}}" onClick="{{c.tog}}" style="--c: {{c.color}}"><span class="calBox"><svg class="ic" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="calName">{{c.label}}</span><span class="num calN">{{c.n}}</span></button></template>
    </section>
  </aside>

  <div class="cal2Main">
    <header class="cal2Head">
      <div class="cal2Ttl"><h3>{{CALC.title}}</h3><span class="num">{{CALC.range}}</span></div>
      <span class="cal2Nav"><button class="ibtn" aria-label="Previous" onClick="{{CALC.prev}}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button><button class="ibtn" aria-label="Next" onClick="{{CALC.next}}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button></span>
      <button class="btn2" style="min-height: 44px" onClick="{{CALC.today}}">Today</button>
      <span style="flex: 1"></span>
      <div class="seg" role="group" aria-label="Calendar view" style="--n: 3; --i: {{CALC.viewI}}"><span class="pill" aria-hidden="true"></span><button class="{{CALC.cDay}}" aria-pressed="{{CALC.pDay}}" onClick="{{CALC.setDay}}">Day</button><button class="{{CALC.cWeek}}" aria-pressed="{{CALC.pWeek}}" onClick="{{CALC.setWeek}}">Week</button><button class="{{CALC.cMonth}}" aria-pressed="{{CALC.pMonth}}" onClick="{{CALC.setMonth}}">Month</button></div>
      <button class="btn2 cal2Exp" style="min-height: 44px" onClick="{{CALC.export}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>Export</button>
    </header>

    <div class="cal2Strip" role="group" aria-label="Days this week"><template data-for list="{{CALC.strip}}" as="d" hint-placeholder-count="7"><button class="stripD {{d.cls}}" aria-pressed="{{d.pressed}}" aria-label="{{d.aria}}" onClick="{{d.pick}}"><span>{{d.d}}</span><span class="num stripN">{{d.n}}</span></button></template></div>

    <template data-if value="{{CALC.isGrid}}" hint-placeholder-val="{{ true }}">
      <div class="tgWrap" tabindex="0" aria-label="Schedule, scrolls sideways and down" data-lenis-prevent>
