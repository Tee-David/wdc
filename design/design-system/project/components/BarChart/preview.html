<!doctype html>
<html>
<head><meta charset="utf-8"><title>BarChart</title></head>
<body style="margin:0">
<div class="wdc pv">
<div class="card" style="padding:16px 18px;max-width:380px"><div class="chartBox"><div style="position:relative"><span class="ylab num" style="bottom:0%">0</span><span class="ylab num" style="bottom:37%">2m</span><span class="ylab num" style="bottom:74%">4m</span></div><div class="plot"><span class="gridl" style="bottom:37%"></span><span class="gridl" style="bottom:74%"></span><button class="barG" aria-label="May"><span class="bar" style="height:59%;background:var(--ad-series-1)"></span><span class="bar" style="height:54%;background:var(--ad-series-2)"></span></button><button class="barG" aria-label="Jun"><span class="bar" style="height:70%;background:var(--ad-series-1)"></span><span class="bar" style="height:57%;background:var(--ad-series-2)"></span></button><button class="barG" aria-label="Jul"><span class="bar" style="height:54%;background:var(--ad-series-1)"></span><span class="bar" style="height:61%;background:var(--ad-series-2)"></span></button><button class="barG" aria-label="Aug"><span class="bar" style="height:81%;background:var(--ad-series-1)"></span><span class="bar" style="height:69%;background:var(--ad-series-2)"></span></button><button class="barG" aria-label="Sep"><span class="bar" style="height:85%;background:var(--ad-series-1)"></span><span class="bar" style="height:76%;background:var(--ad-series-2)"></span></button><button class="barG" aria-label="Oct"><span class="bar" style="height:94%;background:var(--ad-series-1)"></span><span class="bar" style="height:90%;background:var(--ad-series-2)"></span></button></div></div><div style="display:grid;grid-template-columns:38px minmax(0,1fr)"><span></span><div style="display:flex;gap:6px"><span class="mlab">May</span><span class="mlab">Jun</span><span class="mlab">Jul</span><span class="mlab">Aug</span><span class="mlab">Sep</span><span class="mlab">Oct</span></div></div></div>
</div>
<script>/* static */</script>
</body>
</html>
