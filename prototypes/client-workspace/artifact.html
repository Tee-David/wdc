/* ----------------------------------------------- tabs, avatars, tile rows */

/* Four KPI cards across on a wide screen, two on a tablet, one on a phone. */
.ad__tiles--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
@media (max-width: 1180px) { .ad__tiles--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .ad__tiles--4 { grid-template-columns: minmax(0, 1fr); } }

/* UNDERLINE TABS (the mockups' .tabs): views of one list, as links, with
   the current one marked by an orange rule and `aria-current`. */
.ad__tabsNav {
  display: flex; gap: 1.5rem; margin: 0 0 1.25rem; overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--ad-line);
}
.ad__tabsNav::-webkit-scrollbar { display: none; }
.ad .ad__tabsNav > :is(a, button) {
  position: relative; min-height: 2.75rem; padding: .6rem 0; display: inline-flex; align-items: center; gap: .5rem;
  color: var(--ad-dim); font-weight: 600; font-size: .92rem; white-space: nowrap;
}
/* The same tabs as buttons (role="tab"), for a panel switch that is not a page. */
.ad .ad__tabsNav > button { flex: none; border: 0; background: none; font-family: inherit; cursor: pointer; }
.ad .ad__tabsNav > :is(a, button):hover { color: var(--ad-ink); }
.ad .ad__tabsNav > :is(a[aria-current="page"], button[aria-selected="true"]) { color: var(--ad-ink); }
.ad__tabsNav > :is(a[aria-current="page"], button[aria-selected="true"])::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--ad-accent-fill);
}
.ad .ad__tabsNav > button:focus-visible { outline: 2px solid var(--ad-fill); outline-offset: 2px; border-radius: 4px; }
.ad__tabN { min-width: 1.35rem; padding: .05rem .4rem; border-radius: 999px; background: var(--ad-tone-neutral); color: var(--ad-on-neutral); font-size: .72rem; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }

/* A person or company in a table: a solid initials disc, then the name. */
.ad__who { display: flex; align-items: center; gap: .75rem; min-width: 0; }
.ad__who > span:last-child { min-width: 0; display: grid; }
.ad__av {
  width: 2.25rem; height: 2.25rem; flex: none; display: grid; place-items: center; border-radius: 50%;
  background: var(--ad-tone-brand); color: var(--ad-on-brand); font: 600 .74rem var(--font-space-grotesk), system-ui, sans-serif;
}
.ad__av--live { background: var(--ad-tone-live); color: var(--ad-on-live); }
.ad__av--good { background: var(--ad-tone-good); color: var(--ad-on-good); }
.ad__av--warn { background: var(--ad-tone-warn); color: var(--ad-on-warn); }
.ad__av--neutral { background: var(--ad-tone-neutral); color: var(--ad-on-neutral); }

/* ------------------------------------------------------- the record card */

/* components/admin/profile-card.tsx: the top of a client, project or
   invoice page. */
.ad__crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; margin: 0 0 1rem; color: var(--ad-dim); font-size: .9rem; }
.ad__crumbs > span { display: inline-flex; align-items: center; gap: .35rem; }
.ad__crumbs a:hover { color: var(--ad-ink); text-decoration: underline; text-underline-offset: 2px; }
.ad__crumbs svg { width: .9rem; height: .9rem; }
.ad__crumbs b { color: var(--ad-ink); font-weight: 600; }
.ad__profile { margin-bottom: 1.25rem; padding: 1.5rem; border: 1px solid var(--ad-line); border-radius: var(--ad-r); background: var(--ad-panel); box-shadow: var(--ad-sh-1); }
.ad__profileTop { display: flex; align-items: flex-start; gap: 1.25rem; }
.ad__profileAv { width: 4.5rem; height: 4.5rem; flex: none; display: grid; place-items: center; border-radius: 22px; background: var(--ad-tone-live); color: var(--ad-on-live); font: 600 1.5rem var(--font-space-grotesk), system-ui, sans-serif; }
.ad__profileAv svg { width: 45%; height: 45%; }
.ad__profileMain { min-width: 0; flex: 1; display: grid; gap: .55rem; }
.ad__profileTitle { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
.ad__profileTitle h1 { font-size: clamp(1.45rem, 1.1rem + 1vw, 1.9rem); font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
.ad__profileLines { display: flex; flex-wrap: wrap; gap: .35rem 1.1rem; color: var(--ad-dim); font-size: .9rem; }
.ad__profileLines > * { display: inline-flex; align-items: center; gap: .4rem; min-width: 0; overflow-wrap: anywhere; }
.ad__profileLines svg { width: 1rem; height: 1rem; flex: none; }
.ad__profileLines a:hover { color: var(--ad-ink); text-decoration: underline; text-underline-offset: 2px; }
.ad__profileTags { display: flex; flex-wrap: wrap; gap: .4rem; }
.ad__profileActions { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .5rem; max-width: 55%; }
.ad__profileStats { margin: 1.25rem 0 0; padding-top: 1.25rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: 1rem 0; border-top: 1px solid var(--ad-line); }
.ad__profileStats > div { min-width: 0; padding: 0 1.25rem; border-left: 1px solid var(--ad-line); }
.ad__profileStats > div:first-child { padding-left: 0; border-left: 0; }
.ad__profileStats dt { color: var(--ad-dim); font-size: .84rem; }
.ad__profileStats dd { margin: .3rem 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; font: 600 clamp(1.2rem, 1rem + .6vw, 1.5rem) var(--font-space-grotesk), system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.ad__profileStats dd .ad__pill { font-family: var(--font-body); }
@media (max-width: 900px) {
  .ad__profileTop { flex-wrap: wrap; }
  .ad__profileActions { max-width: none; flex: 1 1 100%; justify-content: flex-start; }
}
@media (max-width: 560px) {
  .ad__profile { padding: 1.1rem; }
  .ad__profileAv { width: 3.5rem; height: 3.5rem; border-radius: 16px; font-size: 1.15rem; }
  .ad__profileStats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ad__profileStats > div { padding: 0 .75rem; }
  .ad__profileStats > div:nth-child(odd) { padding-left: 0; border-left: 0; }
}


/* ----------------------------------------------------------- the board */

/* Six stage columns, each wide enough that a card reads as a card rather
   than a column of wrapped words (the owner's call: 10.75rem felt cramped).
   Six of them do not fit most screens at that width, so the board scrolls
   sideways inside itself; the page never does. A phone shows one column
   and a sliver of the next, so there is visibly more to the right. */
.ad__board {
  margin: 1.25rem 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(min(80vw, 15.5rem), 1fr); gap: .75rem;
  align-items: start; overflow-x: auto; overscroll-behavior-inline: contain; padding-bottom: .25rem;
}
.ad__kcol { min-width: 0; padding: .75rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: .6rem; border: 1px solid var(--ad-line); border-radius: var(--ad-r); background: var(--ad-panel-2); }
.ad__kcolH { display: flex; align-items: center; gap: .5rem; padding: .15rem .25rem .25rem; }
.ad__kcolH h2 { flex: 1; min-width: 0; font-size: .92rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ad__kdot { width: .55rem; height: .55rem; flex: none; border-radius: 50%; background: var(--ad-tone-neutral); }
.ad__kdot--1 { background: var(--ad-tone-neutral); }
.ad__kdot--2 { background: #3d52e0; }
.ad__kdot--3 { background: var(--ad-tone-live); }
.ad__kdot--4 { background: var(--ad-tone-warn); }
.ad__kdot--5 { background: var(--ad-tone-good); }
.ad__kcard { position: relative; min-width: 0; padding: .8rem .85rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: .55rem; border: 1px solid var(--ad-line); border-radius: 14px; background: var(--ad-panel); box-shadow: var(--ad-sh-1); }
.ad__kcardTags { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; padding-right: 2.5rem; }
.ad__kcardMenu { position: absolute; top: .35rem; right: .35rem; }
.ad__kcardTitle { min-width: 0; font-size: .92rem; overflow-wrap: anywhere; }
.ad__kcardTitle:hover b { text-decoration: underline; text-underline-offset: 2px; }
.ad__kcardWho small { min-width: 0; overflow: hidden; color: var(--ad-dim); font-size: .8rem; text-overflow: ellipsis; white-space: nowrap; }
.ad__kcardFoot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-size: .8rem; }
.ad__kcardFoot > span:first-child { min-width: 0; display: inline-flex; align-items: center; gap: .35rem; }
.ad__kcardFoot > .ad__av { flex: none; }
.ad__kcardFoot svg { width: .95rem; height: .95rem; }
/* DRAGGING (components/admin/project-board.tsx). A card is grabbed with a
   mouse, a long press or its grip; the gap it leaves is dashed, the copy in
   the hand floats, and the column under it is outlined. Transform only. */
.ad__board[data-lenis-prevent] .ad__kcard[data-card] { cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.ad__kcard.is-placeholder { border-style: dashed; border-color: var(--ad-dim); background: transparent; box-shadow: none; }
.ad__kcard.is-placeholder > * { visibility: hidden; }
.ad__kcard.is-lifted { outline: 2px solid var(--ad-accent); outline-offset: 2px; box-shadow: var(--ad-sh-3); }
.ad__kghost { position: fixed; z-index: 90; margin: 0; pointer-events: none; box-shadow: var(--ad-sh-3); cursor: grabbing; will-change: transform; }
.ad__kcol.is-over { border-color: var(--ad-accent); }
html.is-dragging, html.is-dragging * { cursor: grabbing !important; }
.ad__kgrip {
  position: relative; display: inline-grid; place-items: center; width: 1.75rem; height: 1.75rem; margin: -.15rem .05rem -.15rem -.35rem; padding: 0;
  border: 0; border-radius: 8px; background: none; color: var(--ad-dim); cursor: grab;
}
.ad__kgrip::after { content: ""; position: absolute; inset: -.5rem; }
.ad__kgrip svg { width: 1rem; height: 1rem; }
.ad__kgrip:hover, .ad__kgrip[aria-pressed="true"] { color: var(--ad-ink); background: var(--ad-panel-2); }
.ad__kgrip:focus-visible { outline: 2px solid var(--ad-accent); outline-offset: 1px; }
.ad__kempty { margin: 0; padding: .6rem .25rem; color: var(--ad-dim); font-size: .84rem; }
.ad__av--sm { width: 1.75rem; height: 1.75rem; font-size: .62rem; }

/* ------------------------------------------------ a record's working page */

/* The stage track inside a project's card: every step behind the current
   one filled navy, the current one orange, the rest the line colour. */
.ad__stageTrack { margin-top: 1.25rem; padding-top: 1.25rem; display: grid; gap: 1rem; border-top: 1px solid var(--ad-line); }
/* CHEVRON STEPS. Done steps navy, the current one orange (white type on
   --ad-accent-fill), the rest wait. The row scrolls sideways on a narrow
   screen rather than wrapping, and each step arrives a beat after the last
   (transform and opacity only; nothing under reduced motion). */
.ad__stageTrack ol { list-style: none; margin: 0; padding: 0 0 .25rem; display: flex; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; counter-reset: stg; }
.ad__stageTrack ol::-webkit-scrollbar { display: none; }
.ad__stageTrack li {
  counter-increment: stg; flex: 1 0 7.5rem; min-width: 0; min-height: 3rem; margin-right: -.5rem;
  display: flex; align-items: center; gap: .5rem; padding: 0 1.4rem 0 1.9rem; scroll-snap-align: center;
  background: var(--ad-bg); color: var(--ad-dim);
  clip-path: polygon(0 0, calc(100% - .9rem) 0, 100% 50%, calc(100% - .9rem) 100%, 0 100%, .9rem 50%);
  animation: stgIn .45s cubic-bezier(.2, .8, .2, 1) backwards;
}
.ad__stageTrack li:nth-child(2) { animation-delay: .06s; } .ad__stageTrack li:nth-child(3) { animation-delay: .12s; }
.ad__stageTrack li:nth-child(4) { animation-delay: .18s; } .ad__stageTrack li:nth-child(5) { animation-delay: .24s; }
.ad__stageTrack li:nth-child(6) { animation-delay: .3s; }
.ad__stageTrack li:first-child { padding-left: 1.1rem; clip-path: polygon(0 0, calc(100% - .9rem) 0, 100% 50%, calc(100% - .9rem) 100%, 0 100%); border-radius: 12px 0 0 12px; }
.ad__stageTrack li:last-child { margin-right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, .9rem 50%); border-radius: 0 12px 12px 0; }
.ad__stageTrack li > span { display: none; }
.ad__stageTrack li::before {
  content: counter(stg); flex: none; display: grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 50%;
  background: var(--ad-line); color: var(--ad-ink); font-size: .72rem; font-weight: 700;
}
.ad__stageTrack li.is-done { background: var(--ad-navy); color: #fff; }
.ad__stageTrack li.is-done::before { content: "✓"; background: rgb(255 255 255 / .9); color: var(--ad-navy); }
.ad__stageTrack li.is-now { background: var(--ad-accent-fill); color: #fff; }
.ad__stageTrack li.is-now::before { background: #fff; color: var(--ad-accent-fill); }
.dark .ad__stageTrack li.is-done { background: #23239b; }
.dark .ad__stageTrack li.is-done::before { color: #23239b; }
.ad__stageTrack small { color: inherit; font-size: .85rem; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.ad__stageTrack li.is-now small { font-weight: 700; }
/* The current step shimmers: a pale band sweeping across (transform only). */
.ad__stageTrack li.is-now { position: relative; overflow: hidden; }
.ad__stageTrack li.is-now::after, .ad__stageTrack.is-complete li:last-child::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 30%, rgb(255 255 255 / .3) 50%, transparent 70%);
  transform: translateX(-100%); animation: stgShim 2.4s ease-in-out infinite;
}
.ad__stageTrack.is-complete li:last-child { position: relative; overflow: hidden; }
@keyframes stgShim { to { transform: translateX(100%); } }
/* Delivered: the whole row goes green. Moving the project back to an earlier stage takes it away. */
.ad__stageTrack.is-complete li, .dark .ad__stageTrack.is-complete li { background: var(--ad-tone-good, #1b7a43); color: #fff; }
.ad__stageTrack.is-complete li::before { background: rgb(255 255 255 / .9); color: #1b7a43; }
@media (prefers-reduced-motion: reduce) { .ad__stageTrack li.is-now::after, .ad__stageTrack.is-complete li:last-child::after { animation: none; display: none; } }
@keyframes stgIn { from { opacity: 0; transform: translateX(-.6rem); } }
@media (prefers-reduced-motion: reduce) { .ad__stageTrack li { animation: none; } }

/* The move controls under it: the same stages as a row of small buttons. */
.ad__stages { gap: .4rem; }
.ad__stageBtn { min-height: 2.75rem; padding: 0 1rem; display: inline-flex; align-items: center; }

.ad__tiles--5 { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
@media (max-width: 1280px) { .ad__tiles--5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .ad__tiles--5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .ad__tiles--5 { grid-template-columns: minmax(0, 1fr); } }

/* The work on the left, the facts about it on the right. */
.ad__split { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(18rem, 1fr); gap: 1.25rem; align-items: start; }
.ad__split > .ad__stack { gap: 1.25rem; }
@media (max-width: 1100px) { .ad__split { grid-template-columns: minmax(0, 1fr); } }
.ad__facts--stack { grid-template-columns: minmax(0, 1fr) !important; }
.ad__panelBody { padding: 1rem 1.25rem 1.25rem; }
.ad__panelNote { margin: 0; padding: 1rem 1.25rem 1.25rem; }
/* Five figures across is narrower than four: kobo-precise naira at the
   four-up size ran past the card. A figure may break before it overflows. */
.ad__tile dd { min-width: 0; overflow-wrap: anywhere; }
.ad__tiles--5 .ad__tile dd { font-size: clamp(1.15rem, .75rem + 1vw, 1.55rem); }
.ad__panelNote--top { padding: .85rem 1.25rem; border-bottom: 1px solid var(--ad-line); font-size: .88rem; }

/* WHO OWES WHAT (Money): one bar split by how late the money is, the bands
   with their sums, then the three biggest balances. Solid fills from calm
   to alarmed; the band is also written beside each colour. */
.ad__aging { padding: 1rem 1.25rem 1.25rem; display: grid; gap: 1rem; }
.ad__agingBar { height: .75rem; display: flex; gap: 3px; overflow: hidden; border-radius: 999px; background: var(--ad-line); }
.ad__agingBar > span { min-width: 6px; }
.ad__agingSeg--0 { background: var(--ad-tone-good); }
.ad__agingSeg--1 { background: var(--ad-tone-warn); }
.ad__agingSeg--2 { background: var(--ad-tone-live); }
.ad__agingSeg--3 { background: var(--ad-tone-bad); }
.ad__agingSeg--4 { background: #8e1b1b; }
.ad__agingList, .ad__agingWho { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
.ad__agingList li { display: grid; grid-template-columns: .7rem minmax(0, 1fr) auto; align-items: center; gap: .6rem; font-size: .88rem; }
.ad__agingList i { width: .7rem; height: .7rem; border-radius: 3px; }
.ad__agingWho { padding-top: 1rem; border-top: 1px solid var(--ad-line); gap: .75rem; }
.ad__agingWho li { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.ad__agingWho .ad__who { min-width: 0; }
.ad__agingWho small { color: var(--ad-dim); font-size: .78rem; }
.ad__agingWho a:hover b { text-decoration: underline; text-underline-offset: 2px; }

/* --------------------------------------------------- help behind a "?" */

/* The label and its question mark on one line (components/admin/form.tsx
   puts a hint longer than a few words behind the mark). The mark is the
   onboarding form's Tip, sized to a 44px target without growing the line. */
.ad__flRow { display: flex; align-items: center; gap: .35rem; min-width: 0; }
.ad .tip { position: relative; display: inline-flex; flex: none; }
.ad .tip__b {
  position: relative; display: grid; place-items: center; width: 1.2rem; height: 1.2rem; padding: 0;
  border: 0; border-radius: 50%; background: transparent; color: var(--ad-dim); cursor: pointer;
}
.ad .tip__b::before { content: ""; position: absolute; inset: -.8rem; }
.ad .tip__b:hover, .ad .tip__b.is-on { color: var(--ad-accent-ink); }
.dark .ad .tip__b:hover, .dark .ad .tip__b.is-on { color: var(--ad-accent); }
.ad .tip__b:focus-visible { outline: 2px solid var(--ad-accent); outline-offset: 2px; }
.ad .tip__b svg { width: 100%; height: 100%; }

/* NOTHING IN A DIALOG SCROLLS SIDEWAYS: a field never outgrows its column. */
.ad__f :is(input, select, textarea) { min-width: 0; max-width: 100%; }
.addlg__b { overflow-x: hidden; }
/* The note itself. Its onboarding styles live in form-kit.css, which the
   admin never loads, so it is styled here from the admin's own tokens (at
   :root, so a note portalled to <body> can still see them). */
.ad .tip__p, .tip__portal:not(.pv *) .tip__p {
  position: fixed; z-index: 1000;
  width: max-content; max-width: min(22rem, calc(100vw - 2.5rem));
  padding: .8rem 2.3rem .8rem 1rem;
  border: 1px solid var(--ad-line); border-radius: 12px;
  background: var(--ad-panel); color: var(--ad-ink); box-shadow: var(--ad-sh-3);
  font: 400 .88rem/1.55 var(--font-body); text-transform: none; letter-spacing: normal; white-space: normal;
}
.ad .tip__p > button {
  position: absolute; top: .35rem; right: .35rem; display: grid; place-items: center;
  width: 1.75rem; height: 1.75rem; border: 0; border-radius: 50%; background: transparent; color: var(--ad-dim); cursor: pointer;
}
.ad .tip__p > button:hover { background: var(--ad-panel-2); color: var(--ad-ink); }
.ad .tip__p > button svg { width: .95rem; height: .95rem; }

/* The tour card's "not now": a 44px target in the corner, white on the navy card. */
.ad__tourClose {
  position: absolute; top: .35rem; right: .35rem; z-index: 1; width: 44px; height: 44px; display: grid; place-items: center;
  border: 0; border-radius: 12px; background: transparent; color: #fff; opacity: .8; cursor: pointer;
}
.ad__tourClose:hover { opacity: 1; background: rgb(255 255 255 / .12); }
.ad__tourClose:focus-visible { outline: 2px solid #fff; outline-offset: -2px; opacity: 1; }
.ad__tourClose svg { width: 1.05rem; height: 1.05rem; }

/* FULL-WIDTH BUTTONS ON A PHONE (the owner's rule, 2026-09-25). A labelled
   button in a form, a dialog, a card's actions or a page header takes the
   whole row, so it is an easy target and a row of them reads as a stack
   rather than a ragged line. Two still share a row where there is room.
   Left alone: buttons in a table, the pager, tabs and menus, which are
   sized by what sits beside them. */
@media (max-width: 640px) {
  .ad :is(form, .ad__row, .adDash__attentionActions, .cpDeliv__acts, .ad__panelFoot, .ad__profileActions) .ad__btn:not(.ad__iconButton):not(:is(td, .ad__pager, .ad__switch, .ad__tabsNav, .ad__rmList, .ad__filterBar, .ad__range, .adBulk, .adEntryActs, .adCover__acts) .ad__btn) {
    flex: 1 1 12rem; width: 100%; justify-content: center;
  }
  .ad :is(form, .ad__panelFoot) > .ad__btn { width: 100%; }
  /* A button inside its own form (Close, Reopen, Approve) stretches only if
     the form does. */
  .ad :is(.ad__row, .ad__profileActions, .cpDeliv__acts, .adDash__attentionActions) > form { flex: 1 1 12rem; min-width: 0; }
}

/* TOASTS (components/admin/toast.tsx): solid, white type, bottom centre,
   clear of the safe area. */
.adToasts {
  position: fixed; z-index: 90; left: 50%; bottom: calc(1.5rem + env(safe-area-inset-bottom));
  transform: translateX(-50%); width: min(26rem, calc(100vw - 2rem));
  display: grid; gap: .5rem; pointer-events: none;
}
.adToast {
  pointer-events: auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .6rem;
  min-height: 3rem; padding: .55rem .5rem .55rem .9rem; border-radius: 14px;
  background: var(--ad-tone-good); color: var(--ad-on-good); font-size: .9rem; font-weight: 600; line-height: 1.35;
  box-shadow: 0 16px 36px -14px rgb(0 0 30 / .5);
  animation: ad-toast-in .22s cubic-bezier(.16, 1, .3, 1) backwards;
}
.adToast--bad { background: var(--ad-tone-bad); color: var(--ad-on-bad); }
.adToast > svg { width: 1.1rem; height: 1.1rem; }
.adToast span { overflow-wrap: anywhere; }
.adToast__x { display: grid; place-items: center; width: 2rem; height: 2rem; border: 0; border-radius: 8px; background: transparent; color: inherit; cursor: pointer; }
.adToast__x:hover { background: rgb(255 255 255 / .16); }
.adToast__x svg { width: 1rem; height: 1rem; }
@keyframes ad-toast-in { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { .adToast { animation: none; } }

/* The pickers (Pick, DateInput, DateTimeInput) are styled in pick.css, next to them. */

/* THE BULK BAR (ticked rows): one navy line, pinned under the top bar on a
   desktop and floating at the foot of the screen on a phone. */
.adBulk {
  position: sticky; top: 4.75rem; z-index: 6;
  display: flex; align-items: center; gap: .5rem; padding: .55rem .6rem .55rem 1rem;
  background: var(--ad-navy); color: #fff; border-radius: 14px; margin: .75rem 1rem;
  box-shadow: 0 14px 30px -16px rgb(0 0 60 / .6);
}
.dark .adBulk { background: #23237a; }
.adBulk__n { flex: 1 1 auto; min-width: 0; font-weight: 600; white-space: nowrap; }
.adBulk__btn { min-height: 2.5rem; padding-inline: .8rem; }
.adBulk__btn svg { width: .95rem; height: .95rem; }
/* The one irreversible action in a bulk bar: solid red, white label (5.6:1). */
.ad .adBulk__btn--danger, .ad .adBulk__btn--danger:hover { background: var(--ad-tone-bad); border-color: var(--ad-tone-bad); color: var(--ad-on-bad); }
.adBulk__more { position: relative; }
.adBulk__more > summary { list-style: none; }
.adBulk__more > summary::-webkit-details-marker { display: none; }
.adBulk__menu {
  position: absolute; right: 0; top: calc(100% + .4rem); z-index: 7; min-width: 12rem; padding: .35rem;
  display: grid; border: 1px solid var(--ad-line); border-radius: 12px; background: var(--ad-panel); color: var(--ad-ink);
  box-shadow: 0 18px 40px -18px rgb(0 0 40 / .45);
}
.adBulk__menu :is(button, a) {
  min-height: 2.75rem; padding: 0 .75rem; display: flex; align-items: center; border: 0; border-radius: 8px;
  background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.adBulk__menu :is(button, a):hover { background: var(--ad-panel-2); }
.adBulk__menu .is-danger { color: var(--ad-bad-ink); }
.adBulk__x { color: #fff; }
.adBulk__x:hover { background: rgb(255 255 255 / .12); }
.ad__t tr.is-picked > td { background: var(--ad-panel-2); }
/* On a phone the quick actions are icons (they keep their names for a screen
   reader), so the count, the actions and Clear fit one line at 320px. */
@media (max-width: 480px) {
  .adBulk { gap: .35rem; padding-left: .85rem; }
  .adBulk__btn:not(summary) .adBulk__t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .adBulk__btn:not(summary) { width: 2.5rem; padding: 0; justify-content: center; }
}
@media (max-width: 900px) {
  body:has(.adBulk) .st { bottom: calc(11rem + env(safe-area-inset-bottom)); }
  .adBulk { position: fixed; left: 1rem; right: 1rem; top: auto; bottom: calc(1rem + env(safe-area-inset-bottom)); margin: 0; }
  .adBulk__menu { top: auto; bottom: calc(100% + .4rem); }
}

/* An entry's own actions on a phone: a two-column grid of icon-and-word
   buttons, not five full-width bars before the answers. */
@media (max-width: 640px) {
  .adEntryActs { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .adEntryActs .ad__btn { width: 100%; justify-content: center; padding-inline: .6rem; }
}

/* A FOLDING FORM SECTION (Fold in form.tsx): the title and a one-line summary
   as a 44px+ row with a chevron; the fields under it when open. */
.adFold { padding: 0 !important; }
.adFold__sum {
  display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  min-height: 3.5rem; padding: .8rem 1rem; cursor: pointer; list-style: none;
}
.adFold__sum::-webkit-details-marker { display: none; }
.adFold__sum > span { display: grid; gap: .1rem; min-width: 0; }
.adFold__sum b { font: 600 1rem var(--font-space-grotesk), system-ui, sans-serif; }
.adFold__sum small { color: var(--ad-dim); font-size: .8rem; }
.adFold__sum::after {
  content: ""; flex: none; width: .55rem; height: .55rem; margin-right: .3rem;
  border-right: 2px solid var(--ad-dim); border-bottom: 2px solid var(--ad-dim); transform: rotate(45deg); transition: transform .15s ease;
}
.adFold[open] > .adFold__sum::after { transform: rotate(-135deg); }
.adFold__sum:focus-visible { outline: 2px solid var(--ad-accent); outline-offset: -2px; border-radius: var(--ad-r); }
.adFold__body { padding: 0 1rem 1rem; }
@media (prefers-reduced-motion: reduce) { .adFold__sum::after { transition: none; } }

/* THE PROJECT ICON PICKER (components/admin/icon-picker.tsx): real radios in
   a grid of solid-on-select tiles, with a shuffle. */
.adIcons { grid-column: 1 / -1; margin: 0; padding: 0; border: 0; min-width: 0; }
.adIcons__top { display: flex; align-items: center; gap: .75rem; margin-bottom: .6rem; }
.adIcons__now { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; flex: none; border-radius: 12px; background: var(--ad-tone-brand); color: var(--ad-on-brand); }
.adIcons__now svg { width: 1.25rem; height: 1.25rem; }
.adIcons__now.is-empty { background: var(--ad-tone-flat); color: var(--ad-on-flat); font-weight: 700; }
.adIcons__hint { flex: 1; min-width: 0; font-size: .84rem; }
.adIcons__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.75rem, 1fr)); gap: .35rem; max-height: 13rem; overflow-y: auto; overscroll-behavior: contain; padding: .15rem; }
.adIcons__search, .adIcons__search input { background-clip: padding-box; }
.adIcons__search { display: flex; align-items: center; gap: .5rem; min-height: 2.75rem; margin-bottom: .5rem; padding: 0 .75rem; border: 1px solid var(--ad-line); border-radius: 10px; background: var(--ad-bg); }
.adIcons__search svg { width: 1rem; height: 1rem; flex: none; color: var(--ad-dim); }
.adIcons .adIcons__search input:focus, .adIcons .adIcons__search input:focus-visible { outline: none; box-shadow: none; border: 0; }
.adIcons__count { margin: 0 0 .4rem; font-size: .78rem; }
/* Colour dots: 44px targets around a 28px solid swatch; pressed gets a ring, focus its own outline. */
.adIcons__dots { display: flex; flex-wrap: wrap; margin: 0 -.35rem .25rem; }
.adIcons__dot { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
.adIcons__dot::before { content: ""; width: 1.75rem; height: 1.75rem; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 1px var(--ad-line); }
.adIcons__dot:hover::before { box-shadow: 0 0 0 2px var(--ad-dim); }
.adIcons__dot[aria-pressed="true"]::before { box-shadow: 0 0 0 2px var(--ad-panel), 0 0 0 4px var(--ad-ink); }
.adIcons__dot:focus-visible { outline: 2px solid var(--ad-accent); outline-offset: -2px; }
.adIcons__search input { flex: 1; min-width: 0; min-height: 2.5rem; border: 0; background: transparent; color: var(--ad-ink); font: inherit; outline: none; }
.adIcons__search:focus-within { outline: 2px solid var(--ad-accent); outline-offset: 2px; border-radius: 10px; }
.adIcons__none { grid-column: 1 / -1; margin: .5rem 0; }
.adIcons__opt { position: relative; }
.adIcons__opt input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.adIcons__opt > span { display: grid; place-items: center; height: 2.75rem; border: 1px solid var(--ad-line); border-radius: 10px; background: var(--ad-panel); color: var(--ad-ink); }
.adIcons__opt > span svg { width: 1.1rem; height: 1.1rem; }
.adIcons__opt:hover > span { border-color: var(--ad-dim); }
.adIcons__opt input:checked + span { background: var(--ad-fill); border-color: var(--ad-fill); color: var(--ad-on-fill); }
.adIcons__opt input:focus-visible + span { outline: 2px solid var(--ad-accent); outline-offset: 2px; }
@media (max-width: 560px) {
  .adIcons__top { display: grid; grid-template-columns: 2.75rem minmax(0, 1fr); align-items: center; }
  .adIcons__now { grid-column: 1; grid-row: 1; }
  .adIcons__top > .ad__btn { grid-column: 2; grid-row: 1; width: 100%; justify-content: center; }
  .adIcons__hint { grid-column: 1 / -1; grid-row: 2; width: 100%; }
}

/* THE IN-PAGE LIST SEARCH (components/admin/list-search.tsx). */
.adLS { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem 1rem; padding: .85rem 1.25rem; border-bottom: 1px solid var(--ad-line); }
.adLS__box { position: relative; flex: 1 1 16rem; max-width: 28rem; display: block; }
.adLS__box > svg { position: absolute; left: .75rem; top: 50%; transform: translateY(-50%); width: 1rem; height: 1rem; color: var(--ad-dim); pointer-events: none; }
.adLS__box input {
  width: 100%; min-height: 2.75rem; padding: 0 2.6rem 0 2.3rem; border: 1px solid var(--ad-line); border-radius: 12px;
  background: var(--ad-panel); color: var(--ad-ink); font: inherit; font-size: .92rem;
}
.adLS__box input:focus-visible { outline: none; border-color: var(--ad-fill); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ad-fill) 18%, transparent); }
.adLS__box input::-webkit-search-cancel-button { display: none; }
.adLS__clear { position: absolute; right: .2rem; top: 50%; transform: translateY(-50%); display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border: 0; border-radius: 10px; background: none; color: var(--ad-dim); cursor: pointer; }
.adLS__clear:hover { color: var(--ad-ink); background: var(--ad-panel-2); }
.adLS__clear svg { width: 1rem; height: 1rem; }
.adLS__count { color: var(--ad-dim); font-size: .84rem; }
@media (max-width: 560px) { .adLS { padding-inline: 1rem; } .adLS__box { max-width: none; } }

/* Row tick boxes for the bulk bar (components/admin/bulk.tsx). */
.adRowPick, .adRowPickAll { width: 1.15rem; height: 1.15rem; margin: 0 .6rem 0 0; flex: none; vertical-align: middle; accent-color: var(--ad-fill); cursor: pointer; }
.ad__t tr.is-picked > td { background: var(--ad-nav-on); }
.adBulk__btn.is-danger { color: var(--ad-bad-ink); }
td:has(> .adRowPick) , .ad__pickCell { white-space: nowrap; }
.ad__pickRow { display: flex; align-items: center; min-width: 0; }

/* ------------------------------------------------------ money's layout --
   Spend beside the expense list it summarises (narrow, wide), then quotes
   beside payments (even), as Money.dc.html draws them. */
@media (min-width: 1000px) {
  .ad__grid2--side { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
  .ad__grid2--even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
.ad__switch--wrap { flex-wrap: wrap; max-width: 100%; }
.ad__lateDue { color: var(--ad-bad-ink); font-weight: 700; }
.ad__docNo { white-space: nowrap; }
.ad__subLine { display: block; margin-top: .15rem; font-size: .76rem; }
.ad__subPill { display: flex; width: fit-content; margin-top: .3rem; }
.ad__barTrack { display: block; height: 6px; margin-top: .35rem; border-radius: 3px; background: var(--ad-line); overflow: hidden; }
.ad__barTrack > span { display: block; height: 100%; border-radius: 3px; background: var(--ad-accent-fill); }
.ad__pickRow > span:last-child:not(:only-child) { display: grid; min-width: 0; }
/* A searched list with nothing left: the message in the list, no bare header. */
[data-ls-none="1"] > table, [data-ls-none="1"] > ul, [data-ls-none="1"] > .pBill__table, [data-ls-none="1"] > [data-ls-mirror] { display: none; }
.adLS__none { display: grid; justify-items: center; gap: .45rem; padding: 2rem 1rem; text-align: center; color: var(--ad-dim); }
.adLS__none b { color: var(--ad-ink); }
.adLS__none p { margin: 0; font-size: .86rem; }
.adLS__none .ad__btn { margin-top: .35rem; }
.ad__filterBar .adLS { padding: 0; border-bottom: 0; flex: 1 1 16rem; }
.adBlogTabs { margin: 0 0 1rem; }
/* Case studies list: the cover beside the client and title. */
.adCase__who { display: flex; align-items: center; gap: .75rem; min-width: 0; }
.adCase__who img, .adCase__noPic { width: 64px; height: 44px; flex: none; border-radius: 8px; object-fit: cover; background: var(--ad-panel-2); }
.adCase__noPic { display: grid; place-items: center; background: var(--ad-tone-neutral); color: var(--ad-on-neutral); }
.adCase__noPic svg { width: 1.1rem; height: 1.1rem; }
.adCase__who > span:last-child { min-width: 0; display: grid; }
.adCase__who small { color: var(--ad-dim); max-width: 32rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adCase__acts { flex-wrap: nowrap; }
.adCase__acts form { margin: 0; }

/* THE SHARED CONFIRM (components/admin/confirm.tsx): the explanation, the
   "I understand" tick for what cannot be undone, then Leave it beside the
   action. The destructive action is a SOLID red here (white 5.6:1), because
   in this dialog it is the one thing being decided. */
.adAsk { display: grid; gap: 1rem; }
.adAsk__body { margin: 0; color: var(--ad-dim); line-height: 1.55; }
/* TICK, WARNING ICON, WORDS. Every part is 1.5rem tall and the words take a
   1.5rem line height, so the first line of text, the tick and the icon share one
   centre line however many lines the words wrap to, from a 320px phone up. The
   words wrap inside their own column and never push the icon under the tick. */
.adAsk .adAsk__sure { display: grid; grid-template-columns: 1.5rem 1.5rem minmax(0, 1fr); align-items: start; column-gap: .65rem; min-height: 44px; padding: .8rem .9rem; border: 1px solid var(--ad-line); border-radius: 12px; cursor: pointer; font-weight: 600; font-size: .95rem; }
.adAsk .adAsk__sure > * { align-self: start; margin: 0; }
.adAsk .adAsk__sure input { width: 1.5rem; height: 1.5rem; min-height: 0; padding: 0; accent-color: #c62828; }
.adAsk .adAsk__sure svg { width: 1.5rem; height: 1.5rem; padding: .08rem; color: #c62828; }
.adAsk .adAsk__sure > span { min-width: 0; line-height: 1.5rem; overflow-wrap: anywhere; }
.adAsk .adAsk__sure:has(input:focus-visible) { outline: 2px solid var(--ad-accent); outline-offset: 2px; }
@media (max-width: 360px) { .adAsk .adAsk__sure { column-gap: .5rem; padding: .7rem; font-size: .9rem; } }
.adAsk__acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .6rem; }
.adAsk__acts .ad__btn { min-height: 44px; }
.adAsk .ad__btn--danger { background: #c62828; border-color: #c62828; color: #fff; }
.adAsk .ad__btn--danger:hover { background: #a61f1f; border-color: #a61f1f; }
@media (max-width: 480px) { .adAsk__acts { flex-direction: column-reverse; } .adAsk__acts > * { flex: none; width: 100%; } }

/* ------------------------------------------------------------- arrival --
   How a screen comes in (owner, 2026-09-26: "ease in, ease out, fluid").
   Admin and portal share it, because both shells render into .ad__main.

   - The head, then each block of the page, rise 10px and fade in, a beat
     apart, so the eye reads top to bottom instead of all at once.
   - Bars grow from their baseline, gauge ticks sweep in order, and figures
     count up (components/admin/count-up.tsx).
   - Transform and opacity only, 0.5s, and `backwards` fill: once it ends
     nothing is left behind. That matters: the row menu portals into `.ad`
     and positions itself `fixed`, which a leftover transform would break.
   - A re-render after a save does not remount, so it does not replay;
     arriving on a page does.
   - Reduced motion: none of it. */
@keyframes ad-in { from { opacity: 0; transform: translateY(10px); } }
@keyframes ad-fade { from { opacity: 0; } }
@keyframes ad-grow-y { from { transform: scaleY(0); } }
@keyframes ad-grow-x { from { transform: scaleX(0); } }
@keyframes ad-tick { from { stroke: var(--ad-line); } }
@media (prefers-reduced-motion: no-preference) {
  .ad__main :is(.ad__head, .adDash__head),
  .ad__main :is(.ad__stack, .adDash, .adSet__main, .adDash__kpis, .adDash__row, .ad__tiles) > :not(.ad__head, .adDash__head) {
    animation: ad-in .5s cubic-bezier(.22, 1, .36, 1) backwards;
  }
  .ad__main :is(.ad__stack, .adDash, .adSet__main, .adDash__kpis, .adDash__row, .ad__tiles) > :nth-child(2) { animation-delay: 60ms; }
  .ad__main :is(.ad__stack, .adDash, .adSet__main, .adDash__kpis, .adDash__row, .ad__tiles) > :nth-child(3) { animation-delay: 120ms; }
  .ad__main :is(.ad__stack, .adDash, .adSet__main, .adDash__kpis, .adDash__row, .ad__tiles) > :nth-child(4) { animation-delay: 180ms; }
  .ad__main :is(.ad__stack, .adDash, .adSet__main, .adDash__kpis, .adDash__row, .ad__tiles) > :nth-child(5) { animation-delay: 240ms; }
  .ad__main :is(.ad__stack, .adDash, .adSet__main, .adDash__kpis, .adDash__row, .ad__tiles) > :nth-child(n + 6) { animation-delay: 300ms; }

  /* The first rows of a list follow their panel in, one after another. */
  .ad__main .ad__t tbody tr { animation: ad-fade .4s ease-out backwards; animation-delay: 240ms; }
  .ad__main .ad__t tbody tr:nth-child(2) { animation-delay: 270ms; }
  .ad__main .ad__t tbody tr:nth-child(3) { animation-delay: 300ms; }
  .ad__main .ad__t tbody tr:nth-child(4) { animation-delay: 330ms; }
  .ad__main .ad__t tbody tr:nth-child(5) { animation-delay: 360ms; }
  .ad__main .ad__t tbody tr:nth-child(n + 6) { animation-delay: 390ms; }

  /* Money's category bars fill from the left. */
  .ad__barTrack > span { transform-origin: left; animation: ad-grow-x .9s cubic-bezier(.22, 1, .36, 1) .3s backwards; }
}
@media (prefers-reduced-motion: reduce) { .ad__t tbody tr { transition: none; } }
.ad__t tbody tr { transition: background-color .15s ease; }
.adCountUp { font-variant-numeric: tabular-nums; }

/* A toast that offers Undo (components/admin/toast.tsx): a solid white button
   on the green, and the plain toasts stack above it rather than over it. */
.adToast__acts { display: inline-flex; align-items: center; gap: .25rem; }
.adToast__act { min-height: 2.25rem; padding: 0 .8rem; border: 1px solid #fff; border-radius: 9px; background: #fff; color: #0e0e2c; font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer; }
.adToast__act:hover { background: transparent; color: #fff; }
.adToast__act:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.adToasts--acting + .adToasts { bottom: calc(5.25rem + env(safe-area-inset-bottom)); }

/* A LIST OF LABEL AND VALUE (sign-in methods, background work, an entry's
   answers). Here, not in forms.css, because the Settings pages use it
   without loading that file, which left My account's list unstyled: every
   label and value stacked flush left like plain text. */
.adForms__dl { margin: 0; padding: .4rem 1rem 1rem; }
.adForms__dl > div { display: grid; grid-template-columns: minmax(8rem, 12rem) minmax(0, 1fr); gap: .25rem 1rem; align-items: baseline; padding: .7rem 0; border-bottom: 1px solid var(--ad-line); }
.adForms__dl > div:last-child { border-bottom: 0; }
.adForms__dl dt { color: var(--ad-dim); font-size: .82rem; }
.adForms__dl dd { margin: 0; min-width: 0; font-weight: 600; white-space: pre-line; overflow-wrap: break-word; }
.adForms__client dd, .adForms__client dd > form { width: 100%; min-width: 0; }
.adForms__client .ad__btn { width: 100%; max-width: 100%; min-width: 0; height: auto; white-space: normal; text-align: center; }
@media (max-width: 560px) { .adForms__dl > div { grid-template-columns: minmax(0, 1fr); } }

/* Settings › System: the migrations waiting, then room before the button. */
.adSys__pending { margin: .6rem 0 0; padding-left: 1.1rem; display: grid; gap: .3rem; overflow-wrap: anywhere; }
.adSys__apply { margin-top: 1.1rem; }

/* A panel's padded body. Shared, so it lives here: it was declared only in the
   Settings stylesheet, and "New form" (which uses it too) had its fields
   running into the panel's edges. */
.adSetPad { padding: 1rem 1.25rem 1.25rem; display: grid; gap: 1rem; }

/* The drawer's panel takes the opening focus (nav-drawer.tsx) and shows none. */
.adDrawer__in:focus { outline: none; }

/* Settings > Website and SEO: the link preview, drawn at the shape a chat app shows it. */
.adOg { display: grid; gap: .75rem; }
.adOg__card { max-width: 30rem; border: 1px solid var(--ad-line); border-radius: 12px; overflow: hidden; background: var(--ad-panel-2); }
.adOg__card > img, .adOg__mark { display: block; width: 100%; aspect-ratio: 1200 / 630; object-fit: cover; }
.adOg__mark { display: grid; place-items: center; background: #fff; }
.adOg__mark img { width: 35%; height: auto; } /* the card draws it 421 wide on 1200 */
.adOg__card small { display: block; padding: .5rem .75rem; color: var(--ad-dim); font-size: .78rem; }

/* Settings > Email: a new reply-to waiting on its link, with its two actions beside it. */
.adSetPending { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; }
.adSetPending > span:first-child { flex: 1 1 18rem; min-width: 0; }

/* Earlier versions of a post or the FAQ: who and when, and Restore beside it. */
.adRevs { list-style: none; margin: 0; padding: 0; }
.adRevs > li { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .7rem 1rem; border-top: 1px solid var(--ad-line); }
.adRevs > li:first-child { border-top: 0; }
.adRevs__who { display: grid; gap: .1rem; min-width: 0; }
.adRevs__who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adRevs__who small { font-size: .78rem; }

/* ---- Who is answerable: chips, then a search that opens a short list ---- */
.ad__owner { position: relative; display: grid; gap: .5rem; min-width: 0; }
.ad__ownerChips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
.ad__ownerChips li { display: inline-flex; align-items: center; gap: .15rem; min-height: 2.25rem; padding: 0 .2rem 0 .75rem; border-radius: 999px; background: var(--ad-tone-brand); color: var(--ad-on-brand); font-size: .85rem; font-weight: 600; max-width: 100%; }
.ad__ownerChips li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ad__ownerChips button { width: 2.75rem; height: 2.75rem; margin: -.25rem 0; display: grid; place-items: center; border: 0; background: none; color: inherit; border-radius: 999px; cursor: pointer; }
.ad__ownerChips button svg { width: 1rem; height: 1rem; }
.ad__ownerChips button:focus-visible { outline: 2px solid currentColor; outline-offset: -4px; }
.ad__ownerList { list-style: none; margin: 0; padding: .3rem; position: absolute; z-index: 30; top: 100%; left: 0; right: 0; max-height: 14rem; overflow: auto; background: var(--ad-panel); border: 1px solid var(--ad-line); border-radius: var(--ad-r); box-shadow: var(--ad-sh-2, var(--ad-sh-1)); }
.ad__ownerList button { width: 100%; min-height: 2.75rem; display: flex; align-items: center; gap: .5rem; padding: 0 .7rem; border: 0; border-radius: 8px; background: none; color: var(--ad-ink); font: inherit; text-align: left; cursor: pointer; }
.ad__ownerList button:hover, .ad__ownerList button:focus-visible { background: var(--ad-line); outline: none; }
.ad__ownerList svg { width: 1rem; height: 1rem; }
.ad__ownerInvite { font-size: .82rem; }

/* THE SUPPORT BAR: the owner's read-only view as a staff member. A solid
   fill (navy/white in light, #b84a00/white in dark: --ad-fill/--ad-on-fill),
   the Exit button inverted so its edge survives the fill. It sticks WITH the
   top bar (.ad__stickTop owns the stickiness while it is present) so it
   never covers the header. */
.ad__stickTop { position: sticky; top: 0; z-index: 30; }
.ad__stickTop > .ad__topbar { position: static; }
.adSupport {
  display: grid; grid-template-columns: 1.25rem minmax(0, 1fr) auto; gap: .75rem; align-items: center;
  padding: .6rem max(clamp(1rem, 2.4vw, 2rem), env(safe-area-inset-right)) .6rem max(clamp(1rem, 2.4vw, 2rem), env(safe-area-inset-left));
  background: var(--ad-fill); color: var(--ad-on-fill);
}
.adSupport > svg { width: 1.25rem; height: 1.25rem; }
.adSupport__text { min-width: 0; display: grid; gap: .1rem; overflow-wrap: anywhere; }
.adSupport__text strong { font: 700 .92rem/1.3 var(--font-body); }
.adSupport__text span { font: 500 .8rem/1.35 var(--font-body); }
.adSupport form { margin: 0; }
.adSupport__exit {
  min-height: 44px; padding: 0 1.1rem; border: 2px solid var(--ad-on-fill); border-radius: 12px; cursor: pointer;
  background: var(--ad-on-fill); color: var(--ad-fill); font: 700 .88rem var(--font-body);
}
.adSupport__exit:hover { background: transparent; color: var(--ad-on-fill); }
.adSupport__exit:focus-visible { outline: 3px solid var(--ad-on-fill); outline-offset: 3px; }
@media (max-width: 640px) {
  .adSupport { grid-template-columns: 1.25rem minmax(0, 1fr); gap: .5rem .75rem; }
  .adSupport form { grid-column: 1 / -1; }
  .adSupport__exit { width: 100%; }
}

</script><script>/* Proposed dashboard interactions. All people, work and message states are sample data. */
(function () {
  'use strict';
  const state = { accepted: false, taskDone: false, assigned: false, noteAudience: 'internal', notes: [], query: '', flowStatus: 'all' };
  const notices = [
    { id: 'handover', title: 'Accept the website handover', category: 'Team', person: 'Maya · Branding', body: 'Brand direction is approved. Website needs the selected logo, colour guide and one open question about product photography.', due: 'Due 13 October', action: 'Open handover', view: 'team' },
    { id: 'review', title: 'Client feedback needs your answer', category: 'Review', person: 'Alex · Paper & Pine', body: 'The client asked for a shorter caption on the autumn launch post, version 2. Reply beside the post so the decision stays with the work.', due: 'Due 13 October', action: 'Open project', view: 'project', service: 'social', tab: 'review' },
    { id: 'access', title: 'Store access is still needed', category: 'Request', person: 'Sam · Website lead', body: 'The staging checkout test is waiting for a client-managed payment test account. The client contact owns this request.', due: 'Due 14 October', action: 'Open requests', view: 'project', service: 'web', tab: 'work' },
    { id: 'progress', title: 'Your weekly project summary', category: 'Summary', person: 'Project activity', body: 'Brand direction approved. One post awaits a decision. Website build can start after handover is accepted.', due: 'Sample summary', action: 'Open projects', view: 'overview' }
  ];
  const clientNotices = [
    { id: 'client-review', title: 'Your launch post is ready to review', category: 'Review', person: 'Maya · Your social team', body: 'Review the caption and visual for the launch post, version 2. Approve it or leave a revision note beside it.', due: 'Due 13 October', action: 'Review posts', view: 'project', service: 'social', tab: 'review' },
    { id: 'client-access', title: 'Please provide the product photographs', category: 'Request', person: 'Sam · Your website lead', body: 'Upload the approved product photographs to your project request. We need them for the website pages. For account access, use the agreed secure invitation method rather than posting passwords in a comment.', due: 'Due 14 October', action: 'Open your requests', view: 'project', service: 'web', tab: 'work' },
    { id: 'client-progress', title: 'Your weekly project summary', category: 'Summary', person: 'Your project team', body: 'Your brand direction is approved. Your website layout is the next milestone. One launch post is awaiting your decision.', due: 'Sample summary', action: 'Open your projects', view: 'overview' }
  ];
  const ui = () => window.WDC_UI;
  const isClient = () => ui().role && ui().role() === 'client';
  const makePerson = selected => ({ filter: 'action', selected, preferences: false, progressDigest: true, reminders: true, draftProgress: true, draftReminders: true, preferencesSaved: false, read: [] });
  const people = { studio: makePerson('handover'), client: makePerson('client-review') };
  const person = () => people[isClient() ? 'client' : 'studio'];
  const e = value => ui().escape(String(value));
  const b = (label, action, extra = '') => ui().button(label, action, extra);
  const p = (label, tone = 'neutral') => ui().pill(label, tone);
  const panel = (title, body) => ui().panel(title, body);
  const head = (title, text) => `<div class="view-head"><div><p class="eyebrow">Paper &amp; Pine · Sample workspace</p><h1>${title}</h1><p class="cx-meta">${text}</p></div></div>`;
  function inbox() {
    const visible = isClient() ? clientNotices.concat(state.notes.filter(n => n.audience === 'client').map((n,i) => ({id: `published-${i}`, title:'A new project update', category:'Update', person:'Sam · Your project team', body:n.text, due:'Sample update', action:'Open your project', view:'overview'}))) : notices;
    const items = visible.filter(n => person().filter === 'all' || person().filter === 'summary' ? (person().filter === 'all' || n.category === 'Summary') : n.category !== 'Summary' && !person().read.includes(n.id));
    const selected = visible.find(n => n.id === person().selected) || visible[0];
    person().selected = selected.id;
    return head('Your inbox', 'Decisions, replies and assignments come to the person responsible. Routine progress can be a summary.') +
      `<div class="cx-toolbar">${['action', 'all', 'summary'].map(x => `<button class="ad-btn ${person().filter === x ? 'is-active' : ''}" data-action="comm-filter" data-value="${x}" aria-pressed="${person().filter === x}">${x === 'action' ? 'Needs me' : x === 'all' ? 'All activity' : 'Summaries'}</button>`).join('')}${b('Email preferences', 'comm-preferences')}</div>` +
      (person().preferences ? panel('Your email preferences', `<p>In-app history remains available. These choices affect this sample person, not the whole studio.</p><div class="cx-stack"><label class="cx-row"><input type="checkbox" data-action="comm-pref-progress" ${person().draftProgress ? 'checked' : ''}> Weekly routine progress summary</label><label class="cx-row"><input type="checkbox" data-action="comm-pref-reminders" ${person().draftReminders ? 'checked' : ''}> Email reminders for my approaching deadlines</label><p class="cx-meta">Review requests, important replies and assignments appear in your inbox. Account security notices remain separate from optional updates.</p></div>${person().preferencesSaved ? '<p role="status">Preferences saved for this sample person.</p>' : ''}${person().draftProgress !== person().progressDigest || person().draftReminders !== person().reminders ? `<div class="save-bar"><span>Unsaved preference changes</span><div class="cx-toolbar">${b('Discard changes','comm-pref-discard')}${b('Save preferences','comm-pref-save')}</div></div>` : ''}`) : '') +
      `<div class="cx-grid">${panel('Messages', items.length ? `<div class="cx-stack">${items.map(n => `<button class="cx-notice ${person().selected === n.id ? 'is-active' : ''}" data-action="comm-select" data-value="${n.id}" aria-pressed="${person().selected === n.id}"><span class="cx-row">${p(n.category, n.category === 'Summary' ? 'neutral' : 'warn')}<span class="cx-meta">${n.due}</span></span><strong>${n.title}</strong><span class="cx-meta">${n.person}</span></button>`).join('')}</div>` : '<div class="empty-state"><h3>You are caught up</h3><p>There are no remaining sample actions in this filter. All activity keeps the history.</p></div>')}${panel(selected.title, `<p class="cx-meta">${selected.person} · ${selected.due}</p><p>${selected.body}</p><div class="cx-callout"><strong>Visibility: ${isClient() || selected.id === 'review' ? 'Client and assigned project team' : 'Internal team only'}</strong><p>Proposed access: project members with the appropriate role receive the detail. This preview does not enforce production permissions. An email points here; it is not the only record.</p></div><div class="cx-toolbar">${b(selected.action, 'navigate', `data-view="${selected.view}" ${selected.service ? `data-service="${selected.service}" data-tab="${selected.tab}"` : ''}`)}${b(person().read.includes(selected.id) ? 'Marked read' : 'Mark read', 'comm-read', person().read.includes(selected.id) ? 'disabled' : '')}</div><p class="cx-meta">Sample notification · No message is sent by this prototype.</p>`)}</div>`;
  }
  function team() {
    return head('Team & handovers', 'Pass the context with the work. Keep internal notes separate from anything shared with the client.') +
      `<div class="cx-grid">${panel('Branding → Website', `<div class="cx-row">${p(state.accepted ? 'Accepted' : 'Acceptance needed', state.accepted ? 'good' : 'warn')}<span class="cx-meta">Maya → Sam · Due 13 October</span></div><h3>Build from the approved brand direction</h3><p>The selected logo and colour guide are ready. Product photography is still needed from the client.</p><ul><li>Approved direction: Warm editorial · version 3</li><li>Files: logo exports, colour guide, type guidance</li><li>Decision kept: use the wordmark on the homepage</li><li>Open risk: product photos due 14 October</li><li>Next action: build the homepage layout</li></ul><p class="cx-meta">Internal handover. Client sees only the published project update.</p>${b(state.accepted ? 'Handover accepted' : 'Accept handover', 'comm-accept', state.accepted ? 'disabled' : '')}${state.accepted ? '<p role="status">Sam accepted the sample handover. Maya and the project lead are notified in the proposed flow. Homepage build is now unblocked.</p>' : ''}`)}${panel('Who owns the next step?', `<div class="cx-stack"><div><h3>Homepage layout</h3>${p(state.taskDone ? 'Completed' : state.accepted ? 'Ready to start' : 'Blocked by handover', state.taskDone ? 'good' : state.accepted ? 'live' : 'warn')}<p>Sam · Website · Due 16 October</p>${b(state.taskDone ? 'Task completed' : 'Complete sample task', 'comm-complete', !state.accepted || state.taskDone ? 'disabled' : '')}${!state.accepted ? '<p class="cx-meta">Accept the handover before starting.</p>' : ''}</div><div><h3>Check product images</h3>${p(state.assigned ? 'Assigned to Jo' : 'Needs an owner', state.assigned ? 'good' : 'warn')}<p>Website · Due 14 October</p>${b(state.assigned ? 'Assigned to Jo' : 'Assign to Jo', 'comm-assign', state.assigned ? 'disabled' : '')}</div></div>`)}
      </div>${panel('Discussion attached to this handover', `<p><strong>Maya · Internal note</strong><br>The export folder contains only approved files. Please keep the unused concept sketches private.</p>${state.notes.map(n => `<div class="cx-callout">${p(n.audience === 'internal' ? 'Internal only' : 'Shared with client', n.audience === 'internal' ? 'neutral' : 'brand')}<p>${e(n.text)}</p><span class="cx-meta">Sam · Sample comment · Saved in this preview</span></div>`).join('')}<div class="cx-toolbar"><button class="ad-btn ${state.noteAudience === 'internal' ? 'is-active' : ''}" data-action="comm-audience" data-value="internal" aria-pressed="${state.noteAudience === 'internal'}">Internal note</button><button class="ad-btn ${state.noteAudience === 'client' ? 'is-active' : ''}" data-action="comm-audience" data-value="client" aria-pressed="${state.noteAudience === 'client'}">Client update</button></div><label class="field-label" for="comm-note">${state.noteAudience === 'internal' ? 'Note for the project team' : 'Update the client will see'}</label><textarea id="comm-note" rows="3" placeholder="Write the decision, question or next step…"></textarea><p class="cx-meta">${state.noteAudience === 'internal' ? 'Visible only to the assigned team. Never included in client email.' : 'A deliberate sharing action. The client can see this update in their project.'}</p>${b(state.noteAudience === 'internal' ? 'Save internal note' : 'Publish sample update', 'comm-note')}`)}${panel('What gets communicated', `<div class="cx-table-wrap"><table class="cx-table"><thead><tr><th>Event</th><th>Recipient</th><th>Next action</th></tr></thead><tbody><tr><td>Handover requested</td><td>Receiving lead</td><td>Read context and accept</td></tr><tr><td>Handover accepted</td><td>Outgoing lead, project lead</td><td>Start dependent work</td></tr><tr><td>Task assigned / reassigned</td><td>Named staff account</td><td>Confirm ownership and due date</td></tr><tr><td>Task completed</td><td>Lead and dependent owner</td><td>Start next task</td></tr><tr><td>Internal review failed</td><td>Creator and reviewer</td><td>Correct work before client sharing</td></tr></tbody></table></div>`)}`;
  }
  function flows() {

  function overview(d) { return box('Your next step', '<p>'+d.next+'</p><div class="actions">'+b('Open current work','detail')+b('Review a request','request')+'</div>')+box('People and plan',row('Paper & Pine','Fictional client · Mira Cole is the approver; Casey Reed is the billing contact',p('Sample'))+row(names[state.service],'Ari leads this project · service team owns the work · reviews due 13 October',p('In progress','warning')))+box('Updates and decisions',row('New version ready','Studio shared v'+state.version+' with a summary of changes',p('Shared'))+row('Deadline and scope changes','A reason, cost/date effect and a recorded decision accompany each change',p(state.change || 'No decision'),b('View scope change','change')))+notice('Concept preview only. All people, dates, files, metrics and actions here are fictional. Nothing is sent or connected to a live account.'); }

  function handover() { return box('Handover package',table(['Item','Purpose','State'],[['Final files and version list','Know which files to use and where','Ready'],['Training recording and guide','Use and maintain the delivered work','Ready'],['Account ownership and access','Client ownership and responsible contacts','Review needed'],['Open items and support terms','Known issues, next steps and agreed support','Ready']]))+box('Acknowledge handover','<p>Confirm receipt after checking the files, guide and ownership list. This acknowledgement is separate from approval of any outstanding work.</p>'+p(state.handover?'Received in preview':'Awaiting acknowledgement','warning')+'<div class="actions">'+b('Inspect sample package','package')+b('Acknowledge receipt','handover')+'</div>')+box('Ongoing service and renewal',row('Next period / support end','Sample review date 1 November · term and cost visible before a decision',p(state.renewal?'Requested':'Not renewed'),b('Request continuation','renewal'))+notice('A reminder would go to the responsible contact according to their preferences. No automatic renewal or charge is demonstrated.')); }
  function render(service, tab) { if (data[service]) { if(!records[service]) records[service]=initial(); state=records[service];state.service=service; } const d=data[state.service]; return '<div class="stack service-workspace">'+(tab==='work'?d.work():tab==='review'?review(d):tab==='handover'?handover():overview(d))+(state.expanded?box(e(state.expanded.title),state.expanded.body):'')+'</div>'; }

  function detailBody() {
    const content={
      social:'<div class="sample-art"><strong>Paper &amp; Pine</strong><p>Thoughtfully made, every day.</p><small>Fictional autumn collection carousel · 4 slides</small></div><p><strong>Caption:</strong> A closer look at the pieces made for everyday moments. Explore the autumn collection.</p>'+table(['Publication field','Sample value'],[['Platform','Instagram · feed carousel'],['Visuals','Cover, collection, product detail, closing slide'],['Planned time',e(state.schedule)+' · Africa/Lagos'],['Reviewer','Mira Cole'],['Publication','Not scheduled until the exact version is approved']]),
      branding:'<div class="sample-art"><strong>Paper &amp; Pine</strong><p>Identity direction B · calm and precise.</p><small>Fictional logo and identity presentation</small></div>'+table(['Identity item','Review point'],[['Logo family','Wordmark, symbol, horizontal and stacked lockups'],['Colour palette','Paper cream, forest green and dark ink; print and screen values included'],['Typography','Display serif with a clear body sans serif'],['Application examples','Packaging label, stationery and profile image'],['Feedback context','Identify the page and lockup; direction choice is separate from final sign-off']]),
      web:'<div class="sample-art"><strong>Paper &amp; Pine shop</strong><p>Homepage · product · basket · checkout</p><small>Fictional staging-page preview; no live destination</small></div>'+table(['Staging check','What the client reviews'],[['Homepage','Navigation, message, images and layout'],['Product page','Product information, image gallery and stock wording'],['Checkout','Delivery choice, total, payment outcome and receipt'],['Contact form','Submission acknowledgement and message receipt'],['Review context','Page, browser, steps, expected result and screenshot']])+'<p>Design approval does not record functional acceptance. The studio maintains test evidence; the client grants launch permission after reviewing results.</p>',
      apps:'<div class="sample-art"><strong>App build 0.9.2 (42)</strong><p>Sign-in · browse · basket · notifications</p><small>Fictional device-screen and test-build preview</small></div>'+table(['Build field','Sample detail'],[['Platforms','Android 15 and iOS 18 test devices'],['Install instructions','Studio-issued test invitation; accept it on the intended device and install build 42'],['Changed in this build','Basket total correction and clearer notification wording'],['Test checklist','Sign in, add/remove a product, restore basket and check notifications'],['Bug report','Device, operating system, build number, steps and evidence'],['Release state',state.release+'; store approval is separate from public release']]),

      seo:'<div class="sample-art"><strong>How to care for everyday pieces</strong><p>Article outline · client review version '+state.version+'</p><small>Fictional editorial preview</small></div>'+table(['Article section','Review point'],[['Introduction','Answer the reader’s care question directly'],['Daily care','Confirm factual instructions against approved product guidance'],['Cleaning and storage','Avoid unsupported claims or guarantees'],['Frequently asked questions','Use real client questions and clear answers'],['Page plan','Care guide page; descriptive title, internal links and useful images'],['Checks before publishing','Client facts, editorial review and separate technical checks']])+'<p>This is a content decision. Period results retain their own source and date range; approving an article does not promise rankings or AI mentions.</p>',
      ads:'<div class="sample-art"><strong>Autumn collection</strong><p>Discover pieces for everyday moments.</p><small>Fictional campaign carousel and headline</small></div>'+table(['Campaign field','Sample detail'],[['Audience','People interested in home accessories; agreed region and exclusions recorded'],['Creative','Four-slide carousel, headline and primary text · exact version shown'],['Destination','Sample collection landing-page preview; no live URL'],['Platform checks','Creative policy review and conversion tracking'],['Spending decision','Separate maximum '+(state.budget?'approved':'awaiting approval')+' · ₦150,000 · 15–31 October']])+'<p>Approving this creative does not authorise spending, increase the limit or launch the campaign.</p><div class="actions">'+b('Review spending separately','budget')+'</div>'
    };

  }
  const requests = {
    social: ['Campaign assets and account invitation','Supply the approved autumn campaign assets and invite the studio through the platform’s business-access tools.'],

  function handle(action) {
    if(!action.startsWith('service-')) return null;
    const a=action.slice(8), d=data[state.service];
    if(!client() && clientDecisions.has(a)) { open('Decision belongs to the client','<p>Mira Cole records this decision. Switch to Client portal to try it. The studio can prepare the work and review evidence; it cannot approve as the client.</p>');return true; }
    if(client() && (studioActions.has(a)||a.startsWith('resolve-note-'))) { open('Managed by the studio','<p>The responsible studio team performs this action. You can review shared work, supply requested content, add feedback and grant launch permission.</p>');return true; }
    if(a==='detail'||a==='post') open(d.deliverable,'<p><strong>Version '+state.version+'</strong> · '+d.context+'</p>'+detailBody());
    else if(a==='approve'){state.decision='Approved';if(state.service==='social')state.post='Approved';open('Version '+state.version+' approved','<p>The sample decision records Mira Cole, this version and the time. The responsible team would be notified. A newer version needs a new decision.</p>');}
    else if(a==='notes'||a==='question') open('Add a review note','<label class="field">Your note<textarea id="service-note" rows="4" placeholder="Tell us what to change, and where."></textarea></label><p class="meta">Attached to version '+state.version+' · '+d.context+'</p>'+b('Save note in preview','save-note'));
    else if(a==='save-note'){const field=document.getElementById('service-note');if(!field||!field.value.trim()){if(field){field.setAttribute('aria-invalid','true');field.focus();}return true;}state.notes.push({text:field.value.trim(),done:false,author:client()?'Mira Cole ? client':'Ari ? studio'});state.decision='Changes requested';if(state.service==='social')state.post='Changes requested';if(ui().close)ui().close();}
    else if(a.startsWith('resolve-note-')){const n=state.notes[Number(a.slice(13))];if(n)n.done=true;}
    else if(a.startsWith('reopen-note-')){const n=state.notes[Number(a.slice(12))];if(n)n.done=false;}
    else if(a==='newversion'){state.history.push({version:state.version,decision:state.decision||'No decision'});state.version++;state.decision='';state.post='Awaiting approval';open('New version needs approval','<p>Your earlier decision is retained in history. Version '+state.version+' has a fresh review request; publishing stays paused.</p>');}
    else if(a==='request')open(requests[state.service][0],'<p>'+requests[state.service][1]+'</p><p>Mira Cole is responsible; Ari reviews the response. Access is granted by invitation through the provider, never by pasting a password or private key into a message.</p><label class="field">Response<textarea id="service-request" rows="3" placeholder="Describe what you have supplied or what you need help with."></textarea></label>'+b('Record supplied in preview','supply'));
    else if(a==='supply'){const f=document.getElementById('service-request');if(!f||!f.value.trim()){if(f){f.setAttribute('aria-invalid','true');f.focus();}return true;}state.requestDone=true;if(ui().close)ui().close();}
    else if(a==='change')open('Scope change · '+names[state.service],'<p><strong>Requested change:</strong> '+changes[state.service]+'.</p><p><strong>Fictional sample impact:</strong> ₦45,000 additional work; delivery moves from 23 to 27 October. Existing agreed work continues until a decision is recorded.</p><p>Client decision-maker: Mira Cole · studio lead: Ari · affected team and billing contact receive the outcome.</p>'+p(state.change||'Awaiting decision')+'<div class="actions">'+b('Accept change','accept-change')+b('Decline change','decline-change')+'</div>');
    else if(a==='accept-change'||a==='decline-change'){state.change=a==='accept-change'?'Accepted':'Declined';if(ui().close)ui().close();}
    else if(a==='direction-a'||a==='direction-b')state.selected=a==='direction-a'?'Direction A':'Direction B';
    else if(a==='budget')open('Approve a spending limit','<p>Sample campaign limit: <strong>₦150,000</strong>, 15–31 October. Creative approval is recorded separately. A higher limit needs a fresh decision.</p>'+b('Approve this limit','approve-budget'));
    else if(a==='approve-budget'){state.budget=true;if(ui().close)ui().close();}
    else if(a==='launch'){const ready=state.service==='ads'?state.budget&&state.decision==='Approved':state.test;open('Launch permission',ready?'<p>The sample prerequisites are met. Give explicit permission to proceed; this demo cannot publish anything.</p>'+b('Grant sample permission','grant-launch'):'<p>Permission is blocked until '+(state.service==='ads'?'creative and spending approvals are both recorded.':'functional testing is recorded.')+'</p>');}
    else if(a==='grant-launch'){state.launch=true;if(ui().close)ui().close();}
    else if(a==='test')open('Acceptance checklist','<p>Sample test: follow the agreed steps, record the actual result and attach evidence. Failed checks stay open; new requirements are handled as scope changes.</p><div class="item">Sign-in and permissions · passed</div><div class="item">Core user journey · ready to test</div>'+b('Record sample checks passed','pass-test'));
    else if(a==='pass-test'){state.test=true;if(ui().close)ui().close();}
    else if(a==='release')state.release=state.release==='Submitted'?'Store approved':state.release==='Store approved'?'Released':'Submitted';
    else if(a==='schedule')open('Move the planned post','<p>Current: '+e(state.schedule)+' · Africa/Lagos. Changing the time does not approve the creative.</p><div class="actions">'+b('15 October · 10:00','move-post')+'</div>');
    else if(a==='move-post'){state.schedule='15 October · 10:00';if(ui().close)ui().close();}
    else if(a==='failure')open('Publishing failed','<p>The sample account connection expired. The post is not published. The responsible social lead would receive the exception.</p><p>Reconnect through the approved account-access flow, then retry only the failed publication. Keep the original attempt in history.</p>'+b('Simulate connection repaired','repair-post'));
    else if(a==='repair-post')open('Retry ready','<p>Connection repaired in this demo. The failed post remains separate from approved and published posts.</p>'+b('Simulate successful retry','retry-post'));
    else if(a==='retry-post'){state.failedPost='Published';open('Publication recorded','<p>Sample retry completed. A real record needs provider confirmation, publication time and a live-post link.</p>');}
    else if(a==='published-care'||a==='published-weekend')open('Publication evidence','<p>'+(a==='published-weekend'?'Weekend story · fictional Instagram post · published after the sample retry on 20 October at 10:05.':'Care guide · fictional Instagram post · published 18 October at 12:02.')+' Creative v1 and provider confirmation belong to this record.</p>');
    else if(a==='ai')open('AI evaluation v2','<p>Sample checks cover authorised data, correct answers, uncertain answers, refusal, human escalation and cost limits.</p>'+table(['Example','Expected result','Sample outcome'],[['Unknown product claim','Ask a person; do not invent','Passed'],['Private customer data','Refuse unauthorised disclosure','Passed'],['Unclear order request','Clarify before changing an order','Needs review']])+notice('Known limitation: the assistant cannot authorise refunds. A responsible person owns escalation.'));
    else if(a==='package')open('Final package','<p>Organised folders: final exports; editable source where agreed; guides; training; account ownership; open items; support contacts. Sample filenames and checksums would be shown beside each version.</p>');
    else if(a==='handover')state.handover=true;
    else if(a==='renewal'){state.renewal=true;open('Continuation requested','<p>Your sample request is recorded. The studio would prepare the term, scope and price for acceptance. No charge or renewal has occurred.</p>');}
    else return null;
    return true;
  }
  window.WDC_SERVICES={render,handle,summary(){return {reviews:records.social.post==='Awaiting approval'?1:0,requests:records.web && records.web.requestDone?0:1};}};
})();
</script><script>﻿(function(){
