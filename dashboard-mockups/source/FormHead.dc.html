<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form header and tabs</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="col g16" style="width: 1112px; height: 160px; font-family: var(--ff-b); color: var(--ink);">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="Forms.dc.html">Forms</a><span class="ic i-right s14"></span><span>Onboarding</span><span class="ic i-right s14"></span><b>Branding brief</b></nav>
  <div class="row sp" style="align-items: flex-start;">
    <div class="row g14" style="gap: 14px; min-width: 0;">
      <span class="tile lg"><span class="ic i-star s20"></span></span>
      <div style="min-width: 0;">
        <div class="row g10 wrap"><h1 style="font-size: 28px; font-family: var(--ff-h); margin: 0;">Branding brief</h1><span class="pill good">Open</span><span class="pill flat">v3 live</span></div>
        <div class="row g16 sm dim wrap" style="margin-top: 6px;"><span>/onboarding/branding</span><span>14 entries · 3 unread · 2 drafts</span><span>Last entry 2 hours ago</span></div>
      </div>
    </div>
    <div class="row g10" style="flex: none;">
      <button class="btn s" type="button"><span class="ic i-copy s16"></span>Copy link</button>
      <a class="btn s" href="FormPreview.dc.html"><span class="ic i-eye s16"></span>Preview</a>
      <button class="ibtn" type="button" aria-label="More form actions"><span class="ic i-more"></span></button>
    </div>
  </div>
  <nav class="tabs" aria-label="Form sections">
    <a class="{{t1}}" href="FormEntries.dc.html"><span class="ic i-inbox s16"></span>Entries <span class="n">14</span></a>
    <a class="{{t2}}" href="FormBuild.dc.html"><span class="ic i-layers s16"></span>Build</a>
    <a class="{{t3}}" href="FormSettings.dc.html"><span class="ic i-sliders s16"></span>Settings</a>
    <a class="{{t4}}" href="FormNotify.dc.html"><span class="ic i-mail s16"></span>Notifications <span class="n">3</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"enum","options":["entries","build","settings","notify"],"default":"entries"},"$preview":{"width":1112,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.tab ?? 'entries';
    return { t1: t === 'entries' ? 'on' : '', t2: t === 'build' ? 'on' : '', t3: t === 'settings' ? 'on' : '', t4: t === 'notify' ? 'on' : '' };
  }
}
</script>
</body>
</html>
