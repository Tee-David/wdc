<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin mobile · New invoice</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<form class="m root lt" style="width: 390px; height: 1400px; background: var(--panel);" aria-label="New invoice">
  <div class="row g10" style="height: 64px; padding: 0 16px; border-bottom: 1px solid var(--line);">
    <a class="ibtn" href="MMoney.dc.html" aria-label="Close"><span class="ic i-x"></span></a>
    <div class="grow"><div class="b" style="font-size: 16px;">New invoice</div><div class="xs dim">INV-2026-007 · draft saved</div></div>
    <button class="btn g sm" type="button"><span class="ic i-eye s16"></span>Preview</button>
  </div>
  <div class="col g16" style="padding: 16px 16px 150px;">
    <div class="seg" style="width: 100%;"><button class="on" type="button" style="flex: 1; justify-content: center;">Invoice</button><button type="button" style="flex: 1; justify-content: center;">Estimate</button></div>
    <div class="fld"><label>Bill to</label><div class="inp sel"><span class="row g8"><span class="av y sm">MF</span>Marfaa Foods</span><span class="ic i-chev s14 dim"></span></div></div>
    <div class="fld"><label>Against a project</label><div class="inp sel">Always-on social<span class="ic i-chev s14 dim"></span></div></div>
    <div class="grid c2" style="gap: 12px;">
      <div class="fld"><label>Issued</label><div class="inp sel">1 Oct<span class="ic i-cal s16 dim"></span></div></div>
      <div class="fld"><label>Due</label><div class="inp sel">15 Oct<span class="ic i-cal s16 dim"></span></div></div>
    </div>

    <div class="row sp"><label class="lbl">Lines</label><span class="xs dim">3 lines</span></div>
    <div class="card soft" style="padding: 14px;">
      <div class="row sp"><b class="sm">Posts, twelve a month</b><button class="ibtn sm bare" type="button" aria-label="Line options"><span class="ic i-more s16"></span></button></div>
      <div class="row sp xs dim" style="margin-top: 4px;"><span>1 × ₦300,000</span><b class="fig" style="color: var(--ink); font-size: 14px;">₦300,000</b></div>
    </div>
    <div class="card soft" style="padding: 14px;">
      <div class="row sp"><b class="sm">Reels, four a month</b><button class="ibtn sm bare" type="button" aria-label="Line options"><span class="ic i-more s16"></span></button></div>
      <div class="row sp xs dim" style="margin-top: 4px;"><span>4 × ₦25,000</span><b class="fig" style="color: var(--ink); font-size: 14px;">₦100,000</b></div>
    </div>
    <div class="card" style="padding: 14px; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(0,0,101,.1);">
      <div class="fld"><label>Description</label><div class="inp foc">Community replies</div></div>
      <div class="grid c2" style="gap: 10px; margin-top: 10px;">
        <div class="fld"><label>Qty</label><div class="inp">1</div></div>
        <div class="fld"><label>Unit (₦)</label><div class="inp">50,000</div></div>
      </div>
      <div class="row sp" style="margin-top: 12px;"><button class="btn g sm" type="button" style="color: var(--t-bad);"><span class="ic i-trash s14"></span>Remove</button><button class="btn s sm" type="button">Done</button></div>
    </div>
    <button class="btn s full" type="button" style="border-style: dashed;"><span class="ic i-plus s16"></span>Add a line</button>

    <div class="card soft" style="padding: 16px;">
      <div class="row sp sm"><span class="dim">Subtotal</span><span class="fig">₦450,000</span></div>
      <div class="row sp sm" style="margin-top: 6px;"><span class="dim">VAT 7.5%</span><span class="fig">₦33,750</span></div>
      <div class="hr" style="margin: 10px 0;"></div>
      <div class="row sp"><b>Total</b><b class="fig" style="font-size: 22px;">₦483,750</b></div>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 30px; background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 10px; box-shadow: 0 -8px 24px rgba(14,14,44,.06);">
    <button class="btn s" type="button" style="flex: 1;">Save draft</button>
    <button class="btn p" type="submit" style="flex: 1.4;"><span class="ic i-send s16"></span>Issue it</button>
  </div>
</form>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
