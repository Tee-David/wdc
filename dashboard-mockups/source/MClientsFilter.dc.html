<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin mobile · Filter clients</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="m root lt" style="width: 390px; height: 844px;">
  <dc-import name="MClients" hint-size="390px,1300px"></dc-import>
  <div class="scrim"></div>
  <form class="sheet" aria-label="Filter clients">
    <div class="grab"></div>
    <div class="sh"><h2>Filter clients</h2><button class="btn g sm" type="button">Clear all</button></div>
    <div class="sb">
      <div class="fld"><label>Status</label><div class="row g8 wrap"><span class="chip on"><span class="ic i-check s14"></span>Active</span><span class="chip">Overdue</span><span class="chip">Archived</span></div></div>
      <div class="fld"><label>Buys</label><div class="row g8 wrap"><span class="chip on"><span class="ic i-check s14"></span>Branding</span><span class="chip on"><span class="ic i-check s14"></span>Websites</span><span class="chip">Social media</span><span class="chip">SEO</span><span class="chip">Software</span><span class="chip">Mobile apps</span></div></div>
      <div class="fld"><label>Added</label><div class="row g8 wrap"><span class="chip on"><span class="ic i-check s14"></span>Any time</span><span class="chip">Last 30 days</span><span class="chip">This quarter</span><span class="chip">This year</span><a class="chip" href="MDateRange.dc.html"><span class="ic i-cal s14"></span>Custom</a></div></div>
      <div class="fld"><label>Sector</label><div class="inp sel">Any sector<span class="ic i-chev s14 dim"></span></div></div>
      <div class="fld"><label>Sort by</label>
        <div class="col g8">
          <div class="choice" style="padding: 12px;"><span class="radio on"></span><span class="sm b">Most owed first</span></div>
          <div class="choice" style="padding: 12px;"><span class="radio"></span><span class="sm b">Name, A to Z</span></div>
          <div class="choice" style="padding: 12px;"><span class="radio"></span><span class="sm b">Newest client first</span></div>
        </div>
      </div>
    </div>
    <div class="sf"><a class="btn s" href="MClients.dc.html" style="flex: 1;">Cancel</a><a class="btn p" href="MClients.dc.html" style="flex: 1.6;">Show 3 clients</a></div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
