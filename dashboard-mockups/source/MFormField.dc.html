<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin mobile · Field settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="m root lt" style="width: 390px; height: 844px;">
  <dc-import name="MFormBuild" hint-size="390px,1300px"></dc-import>
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Field settings" style="top: 56px;">
    <div class="grab"></div>
    <div class="sh"><div class="row g10" style="min-width: 0;"><span class="tile sm live"><span class="ic i-checksq s14"></span></span><h2 class="trunc">Checkboxes</h2></div><a class="ibtn" href="MFormBuild.dc.html" aria-label="Close"><span class="ic i-x"></span></a></div>
    <div style="padding: 0 20px 4px;"><div class="seg" style="width: 100%;"><button type="button" class="on" style="flex: 1; justify-content: center;">Field</button><button type="button" style="flex: 1; justify-content: center;">Logic</button><button type="button" style="flex: 1; justify-content: center;">Advanced</button></div></div>
    <div class="sb" style="flex: 1; min-height: 0; overflow: auto; padding-top: 14px;">
      <div class="fld"><label>Question</label><div class="inp" style="height: 44px;">What should we make?</div></div>
      <div class="fld"><label>Help text <span class="opt">(optional)</span></label><div class="inp ta" style="min-height: 64px;">Pick everything you need. We will scope it on the call.</div></div>
      <div class="row sp"><span class="lbl">Required</span><span class="sw on" role="switch" aria-checked="true" aria-label="Required"></span></div>
      <div class="fld">
        <div class="row sp"><label class="lbl">Options</label><span class="xs dim">6 · hold to reorder</span></div>
        <div class="opt-row"><span class="ic i-drag s16 dim"></span><div class="inp" style="height: 44px;">Logo</div><button class="ibtn" type="button" aria-label="Remove Logo"><span class="ic i-x s16"></span></button></div>
        <div class="opt-row"><span class="ic i-drag s16 dim"></span><div class="inp" style="height: 44px;">Colour palette</div><button class="ibtn" type="button" aria-label="Remove Colour palette"><span class="ic i-x s16"></span></button></div>
        <div class="opt-row"><span class="ic i-drag s16 dim"></span><div class="inp" style="height: 44px;">Packaging labels</div><button class="ibtn" type="button" aria-label="Remove Packaging labels"><span class="ic i-x s16"></span></button></div>
        <div class="opt-row"><span class="ic i-drag s16 dim"></span><div class="inp foc" style="height: 44px;">Social templates</div><button class="ibtn" type="button" aria-label="Remove Social templates"><span class="ic i-x s16"></span></button></div>
        <div class="opt-row"><span class="ic i-drag s16 dim"></span><div class="inp" style="height: 44px;">Guidelines</div><button class="ibtn" type="button" aria-label="Remove Guidelines"><span class="ic i-x s16"></span></button></div>
        <div class="row g8"><button class="btn s sm" type="button"><span class="ic i-plus s14"></span>Add option</button><button class="btn g sm" type="button">Paste a list</button></div>
      </div>
      <div class="row sp g12"><div class="grow" style="min-width: 0;"><div class="lbl">Offer “Not sure, advise me”</div><div class="xs dim">Picking a real option clears it</div></div><span class="sw" role="switch" aria-checked="false" aria-label="Offer Not sure"></span></div>
    </div>
    <div class="sf"><button class="btn s" type="button" aria-label="Delete field" style="color: var(--t-bad); width: 48px; padding: 0;"><span class="ic i-trash s16"></span></button><button class="btn s" type="button" aria-label="Duplicate field" style="width: 48px; padding: 0;"><span class="ic i-copy s16"></span></button><a class="btn p grow" href="MFormBuild.dc.html">Done</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
