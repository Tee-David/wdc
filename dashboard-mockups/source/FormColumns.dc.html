<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Entry columns</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="root" style="width: 1440px; height: 1000px;">
  <dc-import name="FormEntries" hint-size="1440px,1560px"></dc-import>
  <div class="menu" role="dialog" aria-label="Columns" style="right: 150px; top: 386px; width: 300px;">
    <div class="row sp" style="padding: 8px 10px 4px;"><b class="sm">Columns</b><button class="linkbtn" type="button" style="background: none; border: 0; font-family: var(--ff-b); cursor: pointer;"><span class="ic i-undo s14"></span>Reset</button></div>
    <div class="xs dim" style="padding: 0 10px 8px;">Drag to reorder. Saved for you on this form.</div>
    <div class="mi"><span class="ic i-drag s16 dim"></span><span class="cbx on"><span class="ic i-check s14"></span></span>Brief number<span class="hint">Always</span></div>
    <div class="mi"><span class="ic i-drag s16 dim"></span><span class="cbx on"><span class="ic i-check s14"></span></span>Who and company</div>
    <div class="mi hov"><span class="ic i-drag s16 dim"></span><span class="cbx on"><span class="ic i-check s14"></span></span>Budget</div>
    <div class="mi"><span class="ic i-drag s16 dim"></span><span class="cbx on"><span class="ic i-check s14"></span></span>Start</div>
    <div class="mi"><span class="ic i-drag s16 dim"></span><span class="cbx on"><span class="ic i-check s14"></span></span>Received</div>
    <div class="mi"><span class="ic i-drag s16 dim"></span><span class="cbx on"><span class="ic i-check s14"></span></span>Client</div>
    <div class="sep"></div>
    <div class="ml">Hidden</div>
    <div class="mi"><span class="ic i-drag s16 dim"></span><span class="cbx"></span>Email</div>
    <div class="mi"><span class="ic i-drag s16 dim"></span><span class="cbx"></span>Phone</div>
    <div class="mi"><span class="ic i-drag s16 dim"></span><span class="cbx"></span>Sector</div>
    <div class="mi"><span class="ic i-drag s16 dim"></span><span class="cbx"></span>Source page</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
