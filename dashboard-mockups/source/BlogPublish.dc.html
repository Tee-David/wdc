<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Publish or schedule a post</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="root" style="width: 1440px; height: 1000px;">
  <dc-import name="BlogEditor" hint-size="1440px,1500px"></dc-import>
  <div class="pop" role="dialog" aria-label="Publish" style="right: 32px; top: 152px; width: 380px;">
    <div style="padding: 18px 18px 6px;"><h3 style="font-size: 17px;">When should it go out?</h3></div>
    <div class="col g10" style="padding: 10px 18px;">
      <div class="choice"><span class="radio"></span><div class="grow"><div class="b sm">Publish now</div><div class="xs dim">It appears on /blog straight away.</div></div></div>
      <div class="choice on" style="flex-direction: column; align-items: stretch;">
        <div class="row g12"><span class="radio on"></span><div class="grow"><div class="b sm">Schedule it</div><div class="xs dim">Goes live by itself, Lagos time.</div></div></div>
        <div class="row g8" style="margin-top: 12px;"><div class="inp sel" style="height: 40px; font-size: 14px;"><span class="row g6"><span class="ic i-cal s14 dim"></span>Tue 29 Sep</span><span class="ic i-chev s14 dim"></span></div><div class="inp sel" style="height: 40px; font-size: 14px; width: 120px;">09:00<span class="ic i-chev s14 dim"></span></div></div>
      </div>
      <div class="choice"><span class="radio"></span><div class="grow"><div class="b sm">Keep as a draft</div><div class="xs dim">Only the team can see it.</div></div></div>
    </div>
    <div class="col g6" style="padding: 8px 18px 14px;">
      <div class="row g8 xs"><span class="ic i-check s14" style="color: var(--t-good);"></span>Headline, card sentence and cover are set</div>
      <div class="row g8 xs"><span class="ic i-alert s14" style="color: var(--warn-ink);"></span>Meta description is 12 characters over</div>
    </div>
    <div class="row sp" style="padding: 14px 18px; border-top: 1px solid var(--line); background: var(--panel-2);">
      <a class="btn g sm" href="BlogEditor.dc.html">Cancel</a>
      <button class="btn p sm"><span class="ic i-cal s14"></span>Schedule for 29 Sep</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
