<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Record a payment</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="root" style="width: 1440px; height: 1000px;">
  <dc-import name="Money" hint-size="1440px,2300px"></dc-import>
  <div class="scrim"></div>
  <form class="dlg" aria-label="Record a payment" style="left: 420px; top: 90px; width: 600px;">
    <div class="dh">
      <div class="row g16" style="align-items: flex-start;">
        <span class="tile lg good"><span class="ic i-wallet s20"></span></span>
        <div><h2>Record a payment</h2><p>For money that arrived outside Paystack. Paystack payments record themselves.</p></div>
      </div>
      <a class="ibtn" href="Money.dc.html" aria-label="Close"><span class="ic i-x"></span></a>
    </div>
    <div class="db">
      <div class="fld"><label>Against which invoice</label><div class="inp sel"><span class="row g8"><span class="av sm">TX</span>INV-2026-004 · Traxstaff · ₦1,200,000 owed</span><span class="ic i-chev s14 dim"></span></div></div>
      <div class="grid c2" style="gap: 14px;">
        <div class="fld"><label>Amount</label><div class="inp foc"><span class="pre">₦</span>600,000</div><div class="help">Half of what is owed. ₦600,000 will still be open.</div></div>
        <div class="fld"><label>When</label><div class="inp sel"><span class="row g8"><span class="ic i-cal s16 dim"></span>Today, 24 Sep</span><span class="ic i-chev s14 dim"></span></div></div>
      </div>
      <div class="fld"><label>How</label>
        <div class="grid c3" style="gap: 10px;">
          <div class="choice on" style="padding: 12px;"><span class="radio on"></span><span class="b sm">Transfer</span></div>
          <div class="choice" style="padding: 12px;"><span class="radio"></span><span class="b sm">Cash</span></div>
          <div class="choice" style="padding: 12px;"><span class="radio"></span><span class="b sm">Cheque</span></div>
        </div>
      </div>
      <div class="fld"><label>Reference <span class="opt">(optional)</span></label><div class="inp ph">TRF_0092</div></div>
      <label class="row g10 sm"><span class="cbx on"><span class="ic i-check s14"></span></span>Email Femi a receipt</label>
    </div>
    <div class="df"><a class="btn s" href="Money.dc.html">Cancel</a><button class="btn p" type="submit"><span class="ic i-check s16"></span>Record ₦600,000</button></div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
