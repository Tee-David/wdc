<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal mobile · Billing</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="m root lt" style="width: 390px; height: 1300px;">
  <dc-import name="MTop" client="{{yes}}" initials="TA" hint-size="390px,64px"></dc-import>
  <main class="m-page">
    <div class="m-ph"><h1>Billing</h1><p class="lede">Your invoices, what you have paid and what is left.</p></div>
    <div class="card" style="padding: 18px; background: #000065; border-color: #000065; color: #fff;">
      <div class="sm" style="color: #d4d6f5;">Balance owed</div>
      <div class="fig" style="font-size: 34px; font-weight: 600; margin-top: 4px; color: #fff;">₦330,000</div>
      <div class="xs" style="color: #d4d6f5; margin-top: 2px;">On INV-2026-001 · due Wed 30 Sep</div>
      <a class="btn full" href="PMInvoice.dc.html" style="margin-top: 16px; background: #fff; color: #000065; border-color: #fff;"><span class="ic i-lock s16"></span>Pay ₦330,000</a>
    </div>
    <div class="grid c2" style="gap: 12px;">
      <div class="card kpi" style="padding: 14px; gap: 6px;"><div class="note xs">Paid to date</div><div class="val" style="font-size: 20px;">₦300,000</div></div>
      <div class="card kpi" style="padding: 14px; gap: 6px;"><div class="note xs">Credit on account</div><div class="val" style="font-size: 20px;">Nil</div></div>
    </div>
    <div class="seg" style="width: 100%;"><button class="on" style="flex: 1; justify-content: center;">Invoices</button><button style="flex: 1; justify-content: center;">Payments</button></div>
    <div class="card flush">
      <a class="mcard-row" href="PMInvoice.dc.html"><span class="tile sm warn"><span class="ic i-receipt s14"></span></span><div class="grow"><div class="row sp"><b class="sm">INV-2026-001</b><b class="fig sm">₦630,000</b></div><div class="row sp" style="margin-top: 4px;"><span class="xs dim">₦330,000 left · due 30 Sep</span><span class="pill warn">Part paid</span></div></div></a>
    </div>
    <p class="xs dim row g6" style="justify-content: center;"><span class="ic i-lock s14"></span>Card payments are handled by Paystack.</p>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 15;"><dc-import name="MTabs" portal="{{yes}}" active="billing" hint-size="390px,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
