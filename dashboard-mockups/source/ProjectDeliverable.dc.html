<head>

<title>Admin · Add a deliverable</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="root" style="width: 1440px; height: 1000px;">
  <dc-import name="Project" hint-size="1440px,2050px"></dc-import>
  <div class="scrim"></div>
  <form class="dlg" aria-label="Add a deliverable" style="left: 380px; top: 90px; width: 680px;">
    <div class="dh">
      <div><h2>Add a deliverable</h2><p>The client can open it from their portal and approve it or ask for changes.</p></div>
      <a class="ibtn" href="Project.dc.html" aria-label="Close"><span class="ic i-x"></span></a>
    </div>
    <div class="db">
      <div class="seg" style="align-self: flex-start;"><button class="on">A new deliverable</button><button>A new version of one</button></div>
      <div class="grid c2" style="gap: 14px;">
        <div class="fld"><label>What it is</label><div class="inp">Brand guidelines</div></div>
        <div class="fld"><label>Waits for</label><div class="inp sel">Approval<span class="ic i-chev s14 dim"></span></div></div>
      </div>
      <div class="fld"><label>What this first version is</label><div class="inp ta ph" style="min-height: 80px;">Three routes, each with rationale.</div></div>
      <div class="fld"><label>Where it lives</label>
        <div class="drop on">
          <span class="tile lg"><span class="ic i-up s20"></span></span>
          <div class="b">Drop the file here, or <span style="color: var(--navy); text-decoration: underline;">choose one</span></div>
          <div class="xs dim">PDF, images or a zip up to 50 MB. Or paste a link below.</div>
        </div>
        <div class="inp"><span class="ic i-link s16 dim"></span><span class="ph">https://…</span></div>
      </div>
      <label class="row g10 sm"><span class="cbx on"><span class="ic i-check s14"></span></span>Tell Tobi it is ready, through the WhatsApp group</label>
    </div>
    <div class="df"><a class="btn s" href="Project.dc.html">Cancel</a><button class="btn p dis" type="submit" disabled>Add it</button></div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
