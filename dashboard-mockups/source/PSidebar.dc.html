<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal sidebar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="side-in" style="width: 264px; height: 900px; background: var(--panel); font-family: var(--ff-b); color: var(--ink);">
  <div class="brand">
    <img src="brand/logo-navy.svg" alt="WDC" width="94" height="30">
    <span class="pill flat">Client</span>
  </div>
  <div class="row g10" style="padding: 12px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); margin-bottom: 6px;">
    <span class="av sm {{coCls}}">{{coInit}}</span>
    <div class="grow"><div class="b sm trunc">{{company}}</div><div class="xs dim">{{coSub}}</div></div>
  </div>
  <div class="side-scroll">
  <div class="navlabel">Your account</div>
  <nav class="nav" aria-label="Portal sections">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
      <a href="{{it.href}}" class="{{it.cls}}"><span class="ic {{it.icon}}"></span><span>{{it.label}}</span><sc-if value="{{it.hasCt}}" hint-placeholder-val="{{false}}"><span class="ct">{{it.ct}}</span></sc-if></a>
    </sc-for>
  </nav>
  <div class="nav" style="margin-top: 8px;"><a href="POverview.dc.html"><span class="ic i-globe"></span><span>Back to website</span><span class="ic i-ext s14" style="margin-left: auto;"></span></a></div>
  </div>
  <div class="side-foot">
  <div class="tourcard">
    <div class="tile"><span class="ic i-chat s16"></span></div>
    <h4>Need a hand?</h4>
    <p>Ask about a project or an invoice. Babatope usually replies the same working day.</p>
    <a class="btn sm" href="PNewTicket.dc.html">Ask a question</a>
  </div>
  <div class="me">
    <span class="av o">{{meInit}}</span>
    <div class="grow"><div class="b sm trunc">{{person}}</div><div class="xs dim trunc">{{email}}</div></div>
    <button class="ibtn sm bare" aria-label="Sign out"><span class="ic i-out s16"></span></button>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","projects","billing","support","settings"],"default":"overview"},"linked":{"editor":"boolean","default":true},"$preview":{"width":264,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'overview';
    const mk = (key, label, icon, href, ct) => ({ label, icon, href, cls: a === key ? 'on' : '', hasCt: !!ct && linked, ct: ct || '' });
    const linked = this.props.linked ?? true;
    return {
      company: linked ? 'Moore Designs' : 'Not linked yet',
      coSub: linked ? '2 projects with WDC' : 'We will connect it soon',
      coInit: linked ? 'MD' : '?',
      coCls: linked ? 'o' : 's',
      person: linked ? 'Tobi Adeyemi' : 'Ngozi Eze',
      email: linked ? 'tobi@mooredesigns.ng' : 'ngozi@example.com',
      meInit: linked ? 'TA' : 'NE',
      items: [
        mk('overview', 'Overview', 'i-dash', 'POverview.dc.html'),
        mk('projects', 'Projects', 'i-folder', 'PProjects.dc.html', '1'),
        mk('billing', 'Billing', 'i-cash', 'PBilling.dc.html', '1'),
        mk('support', 'Support', 'i-buoy', 'PSupport.dc.html'),
        mk('settings', 'Settings', 'i-cog', 'PSettings.dc.html'),
      ],
    };
  }
}
</script>
</body>
</html>
