<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin mobile · Record a payment</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="m root lt" style="width: 390px; height: 844px;">
  <dc-import name="MInvoice" hint-size="390px,1500px"></dc-import>
  <div class="scrim"></div>
  <form class="sheet" aria-label="Record a payment">
    <div class="grab"></div>
    <div class="sh"><div><h2>Record a payment</h2><div class="xs dim">INV-2026-004 · Traxstaff · ₦1,200,000 owed</div></div><a class="ibtn" href="MInvoice.dc.html" aria-label="Close"><span class="ic i-x"></span></a></div>
    <div class="sb">
      <div class="fld"><label>Amount</label><div class="inp foc" style="height: 56px; font-size: 22px;"><span class="pre">₦</span><span class="fig">600,000</span></div>
        <div class="row g6"><span class="chip" style="height: 32px;">Half</span><span class="chip" style="height: 32px;">All of it</span></div>
      </div>
      <div class="fld"><label>How</label><div class="seg" style="width: 100%;"><button class="on" style="flex: 1; justify-content: center;">Transfer</button><button style="flex: 1; justify-content: center;">Cash</button><button style="flex: 1; justify-content: center;">Cheque</button></div></div>
      <div class="grid c2" style="gap: 12px;">
        <div class="fld"><label>When</label><div class="inp sel">Today<span class="ic i-cal s16 dim"></span></div></div>
        <div class="fld"><label>Reference</label><div class="inp ph">TRF_0092</div></div>
      </div>
      <label class="row g10 sm"><span class="cbx on"><span class="ic i-check s14"></span></span>Email Femi a receipt</label>
    </div>
    <div class="sf"><button class="btn p full" type="submit"><span class="ic i-check s16"></span>Record ₦600,000</button></div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
