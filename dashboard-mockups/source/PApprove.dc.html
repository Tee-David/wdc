<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal · Approve a deliverable</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="root" style="width: 1440px; height: 1000px;">
  <dc-import name="PProject" hint-size="1440px,1700px"></dc-import>
  <div class="scrim"></div>
  <form class="dlg" aria-label="Approve Identity routes" style="left: 460px; top: 160px; width: 520px;">
    <div class="db" style="padding-top: 28px; align-items: center; text-align: center;">
      <div class="halo" style="width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; background: var(--t-good); color: #fff; box-shadow: 0 0 0 10px var(--nav-on);"><span class="ic i-check s28"></span></div>
      <h2 style="font-size: 22px; margin-top: 10px;">Approve Identity routes v2?</h2>
      <p class="sm dim" style="line-height: 1.55; max-width: 400px;">This tells the team you are happy to go ahead. If you have a favourite route, say which one so they build the right thing.</p>
      <div class="grid c3" style="gap: 8px; width: 100%;">
        <div class="choice" style="flex-direction: column; gap: 6px; padding: 12px;"><span class="radio"></span><span class="b sm">Route A</span></div>
        <div class="choice on" style="flex-direction: column; gap: 6px; padding: 12px;"><span class="radio on"></span><span class="b sm">Route B</span></div>
        <div class="choice" style="flex-direction: column; gap: 6px; padding: 12px;"><span class="radio"></span><span class="b sm">Route C</span></div>
      </div>
      <div class="fld" style="width: 100%; text-align: left;"><label>A note for the team <span class="opt">(optional)</span></label><div class="inp ph">Anything they should keep in mind</div></div>
    </div>
    <div class="df"><a class="btn s" href="PProject.dc.html">Not yet</a><button class="btn p" type="submit"><span class="ic i-check s16"></span>Approve Route B</button></div>
  </form>
</div>
</x-dc>

  renderVals() { return {}; }

</html>
