    <div class="dh"><div class="row g14" style="gap: 14px; align-items: flex-start;"><span class="tile lg bad"><span class="ic i-ban s20"></span></span><div><h2 style="font-size: 19px;">Void INV-2026-004?</h2><p>It stays on record with “Void” across it. The pay link stops working and reminders stop. The number is never reused.</p></div></div></div>

      <div class="fld"><label>Why</label><div class="inp foc">Replaced by INV-2026-007 after scope change</div></div>
      <label class="row g10 sm"><span class="cbx on"><span class="ic i-check s14"></span></span>Tell Femi it has been cancelled</label>
    </div>
