<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin mobile · Add a client</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<form class="m root lt" style="width: 390px; height: 1300px; background: var(--panel);" aria-label="A new client">
  <div class="row g10" style="height: 64px; padding: 0 16px; border-bottom: 1px solid var(--line);">
    <a class="ibtn" href="MClients.dc.html" aria-label="Close"><span class="ic i-x"></span></a>
    <div class="grow b" style="font-size: 16px;">A new client</div>
    <span class="xs dim">Step 1 of 2</span>
  </div>
  <div class="bar n" style="border-radius: 0; height: 4px;"><i style="width: 50%; border-radius: 0;"></i></div>
  <div class="col g16" style="padding: 20px 16px 140px;">
    <div class="fld"><label>Company</label><div class="inp">Ngozi Interiors</div></div>
    <div class="fld"><label>Who you deal with</label><div class="inp foc">Ngozi Eze<span style="width: 1.5px; height: 20px; background: var(--ink); margin-left: -8px;"></span></div></div>
    <div class="fld"><label>Email</label><div class="inp err">ngozi@ngozi-interiors</div><div class="errt"><span class="ic i-alert s14"></span>That address is missing its ending, like .com</div></div>
    <div class="fld"><label>Phone <span class="opt">(optional)</span></label><div class="inp"><span class="pre">+234</span><span class="ph">802 123 4567</span></div></div>
    <div class="fld"><label>Sector</label><div class="inp sel">Interiors and furniture<span class="ic i-chev s14 dim"></span></div></div>
    <div class="fld"><label>What they buy</label>
      <div class="row g8 wrap"><span class="chip"><span class="ic i-plus s14"></span>Branding</span><span class="chip on"><span class="ic i-check s14"></span>Websites</span><span class="chip"><span class="ic i-plus s14"></span>Social</span><span class="chip on"><span class="ic i-check s14"></span>SEO</span><span class="chip"><span class="ic i-plus s14"></span>Software</span><span class="chip"><span class="ic i-help s14"></span>Not sure yet</span></div>
    </div>
    <div class="fld"><label>Tags <span class="opt">(optional)</span></label><div class="inp" style="gap: 6px;"><span class="tag">referral</span><span class="ph">Add a tag</span></div></div>
    <div class="choice"><span class="sw on"></span><div class="grow"><div class="b sm">Invite to the client portal</div><div class="xs dim">They get an email to set a password.</div></div></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 30px; background: var(--panel); border-top: 1px solid var(--line); display: flex; gap: 10px; box-shadow: 0 -8px 24px rgba(14,14,44,.06);">
    <a class="btn s" href="MClients.dc.html" style="flex: 1;">Cancel</a>
    <button class="btn p" type="submit" style="flex: 1.6;">Add them<span class="ic i-arrow s16"></span></button>
  </div>
</form>
</x-dc>
