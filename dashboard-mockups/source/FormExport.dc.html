<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Export entries</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="wdc.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="root" style="width: 1440px; height: 1000px;">
  <dc-import name="FormEntries" hint-size="1440px,1560px"></dc-import>
  <div class="pop" role="dialog" aria-label="Export entries" style="right: 52px; top: 386px; width: 340px; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
    <b>Export entries</b>
    <div class="fld"><span class="lbl">Which</span>
      <div class="col g8">
        <label class="choice" style="padding: 10px 12px;"><span class="radio"></span><span class="grow sm"><b>Selected</b> <span class="dim">· 2 entries</span></span></label>
        <label class="choice on" style="padding: 10px 12px;"><span class="radio on"></span><span class="grow sm"><b>Everything matching</b> <span class="dim">· 12 in Inbox</span></span></label>
      </div>
    </div>
    <div class="fld"><span class="lbl">Format</span><div class="seg" style="width: 100%;"><button type="button" class="on" style="flex: 1; justify-content: center;">CSV</button><button type="button" style="flex: 1; justify-content: center;">Excel (XLSX)</button></div></div>
    <label class="row g10 sm"><span class="cbx"></span>Include hidden columns</label>
    <p class="help">One column per question, by its label. Spreadsheet formulas are neutralised on the way out.</p>
    <button class="btn p full" type="button"><span class="ic i-down s16"></span>Download 12 entries</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
