<div class="pageHead rise">
              <div>
                <a href="A-Email.dc.html" class="lnk" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 600"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>Back to automations</a>
                <h1 class="h1">{{pageTitle}}</h1>
                <p class="lede">{{lede}} <strong style="color: var(--ad-ink)">{{state}}</strong></p>
              </div>
              <div class="headActs">
                <button class="btn2" style="min-height: 44px" onClick="{{testAs}}">Test as a contact</button>
                <button class="btn" onClick="{{save}}">{{saveLabel}}</button>
                <button class="ibtn" data-menu="chores" aria-label="More for this automation" aria-haspopup="menu" aria-expanded="{{choresX}}" onClick="{{openChores}}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path></svg></button>
              </div>
            </div>
            <section class="card rise d2" aria-label="Automation" style="overflow: hidden">
              <div role="tablist" aria-label="Automation views" class="tabs"><sc-for list="{{tabs}}" as="tb" hint-placeholder-count="2"><button role="tab" class="tab {{tb.cls}}" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}">{{tb.t}}</button></sc-for></div>
              <sc-if value="{{isBuilder}}" hint-placeholder-val="{{ true }}">
                <div class="afBar"><label class="sfield" style="max-width: 360px"><span class="sr">Automation name</span><input id="afName" value="{{name}}" onChange="{{onName}}" placeholder="Automation name"></label><span style="flex: 1"></span><span class="afZoom" role="group" aria-label="Canvas controls"><button class="ibtn" aria-label="Zoom out" onClick="{{zoomOut}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14"></path></svg></button><span class="num" style="min-width: 48px; text-align: center; font-size: 13px">{{zoomText}}</span><button class="ibtn" aria-label="Zoom in" onClick="{{zoomIn}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><button class="btn2" style="min-height: 44px" onClick="{{fit}}">Fit to screen</button></span></div>
                <div class="afCanvas" data-tour="canvas"><div class="afFlow" style="transform: scale({{zoom}}); transform-origin: top center">
                  <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
                    <sc-if value="{{r.isNode}}" hint-placeholder-val="{{ true }}"><button class="afNode {{r.cls}}" onClick="{{r.open}}" aria-label="{{r.aria}}"><span class="svcIc" style="background: {{r.tone}}; width: 36px; height: 36px; border-radius: 11px"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="{{r.d}}"></path></svg></span><span style="flex: 1; min-width: 0; text-align: left"><strong style="font-size: 14px">{{r.t}}</strong><br><span style="color: var(--ad-dim); font-size: 12px">{{r.s}}</span></span><sc-if value="{{r.hasN}}" hint-placeholder-val="{{ false }}"><span class="tag num" style="background: var(--ad-tone-flat); color: var(--ad-on-flat)">{{r.n}}</span></sc-if></button></sc-if>
                    <sc-if value="{{r.isPlus}}" hint-placeholder-val="{{ false }}"><span class="afLink"></span><button class="afPlus" aria-label="{{r.aria}}" onClick="{{r.add}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><span class="afLink"></span></sc-if>
                    <sc-if value="{{r.isBranch}}" hint-placeholder-val="{{ false }}"><div class="afLanes"><div class="afLane"><span class="afLaneT yes">Yes</span><sc-for list="{{r.yes}}" as="y" hint-placeholder-count="2"><sc-if value="{{y.isNode}}" hint-placeholder-val="{{ true }}"><button class="afNode {{y.cls}}" onClick="{{y.open}}" aria-label="{{y.aria}}"><span class="svcIc" style="background: {{y.tone}}; width: 36px; height: 36px; border-radius: 11px"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="{{y.d}}"></path></svg></span><span style="flex: 1; min-width: 0; text-align: left"><strong style="font-size: 14px">{{y.t}}</strong><br><span style="color: var(--ad-dim); font-size: 12px">{{y.s}}</span></span></button></sc-if><sc-if value="{{y.isPlus}}" hint-placeholder-val="{{ false }}"><span class="afLink"></span><button class="afPlus" aria-label="{{y.aria}}" onClick="{{y.add}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><span class="afLink"></span></sc-if></sc-for></div><div class="afLane"><span class="afLaneT no">No</span><sc-for list="{{r.no}}" as="y" hint-placeholder-count="2"><sc-if value="{{y.isNode}}" hint-placeholder-val="{{ true }}"><button class="afNode {{y.cls}}" onClick="{{y.open}}" aria-label="{{y.aria}}"><span class="svcIc" style="background: {{y.tone}}; width: 36px; height: 36px; border-radius: 11px"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="{{y.d}}"></path></svg></span><span style="flex: 1; min-width: 0; text-align: left"><strong style="font-size: 14px">{{y.t}}</strong><br><span style="color: var(--ad-dim); font-size: 12px">{{y.s}}</span></span></button></sc-if><sc-if value="{{y.isPlus}}" hint-placeholder-val="{{ false }}"><span class="afLink"></span><button class="afPlus" aria-label="{{y.aria}}" onClick="{{y.add}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><span class="afLink"></span></sc-if></sc-for></div></div></sc-if>
                  </sc-for>
                  <span class="afEnd">The person leaves the automation here.</span>
                </div></div>
              </sc-if>
              <sc-if value="{{isResults}}" hint-placeholder-val="{{ false }}"><div style="padding: 20px; display: flex; flex-direction: column; gap: 14px"><div class="bento"><sc-for list="{{results}}" as="k" hint-placeholder-count="4"><div class="card stat" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><span class="statHd"><span class="statIc" style="background: {{k.tile}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="{{k.ic}}"></path></svg></span><span class="statLbl">{{k.label}}</span></span><span class="num" style="font-size: 26px; font-weight: 700">{{k.value}}</span><span style="font-size: 12px; color: var(--ad-dim)">{{k.note}}</span></div></sc-for></div><p style="font-size: 13px; color: var(--ad-dim)">{{resultNote}}</p></div></sc-if>
            </section>
