<div class="scrim" aria-hidden="true"></div>
<section class="lock" id="dock" aria-labelledby="dk-h1">
  <div class="brand"><img src="data:image/svg+xml;base64,@@MARK@@" alt="" width="22" height="23">We Dig Creativity</div>
  <div class="head">
    <h1 id="dk-h1">Back shortly<span>.</span></h1>
    <p class="lede">We are making a few changes to the site.</p>
  </div>
  <div class="time">
    <b data-count>…</b>
    <span>until <strong data-back-lagos-short>…</strong> Lagos<span class="local" data-local-note></span></span>
  </div>
  <div id="dk-ask-wrap">
    <form class="cap" id="dk-form" novalidate>
      <label class="sr" for="dk-email">Email address</label>
      <input id="dk-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Your email" required aria-describedby="dk-note">
      <button class="btn btn-primary" type="submit">Notify me</button>
    </form>
    <p class="note-s" id="dk-note" aria-live="polite">One email when we are back. Nothing else.</p>
    <div class="thanks" id="dk-done" hidden tabindex="-1">
      <p><i><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><span>We will email <span id="dk-who"></span> once.</span></p>
      <div class="ask" role="group" aria-labelledby="dk-ask">
        <small id="dk-ask">So we are ready for you, what brings you here?</small>
        <div><button type="button" aria-pressed="false" data-why="project">A new project</button><button type="button" aria-pressed="false" data-why="client">I am a client</button><button type="button" aria-pressed="false" data-why="browsing">Just looking</button></div>
      </div>
    </div>
  </div>
  <p class="micro" id="dk-micro"><span id="dk-need">Need us now?</span> <button type="button" id="dk-copy" data-email="info@wedigcreativity.com.ng">info@wedigcreativity.com.ng</button><span class="dot" aria-hidden="true">·</span><a href="https://wedigcreativity.com.ng/portal" target="_blank" rel="noopener">Client portal</a></p>
</section>
