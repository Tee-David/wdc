<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Shared shell for every maintenance concept. The maintenance page is always
   the navy ground, so this is a deliberate single-theme page: every colour is
   set explicitly and nothing depends on the host's theme. */
:root{
  color-scheme:dark;
  --navy:#000065; --navy-deep:#00003f; --navy-lift:#12128a; --navy-line:#2a2aa0;
  --orange:#ff6500; --white:#ffffff; --black:#000000; --mist:#c7c9ec;
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --body:"Outfit",ui-sans-serif,system-ui,sans-serif;
  /* The site's button pair on a dark ground: primary is white on black ink,
     secondary is the same two colours the other way round, edged in white. */
  --btn-fill:#ffffff; --btn-ink:#000000;
  --scene-left:0px;
}
@media (min-width:1000px){:root{--scene-left:calc(26rem + 32px)}}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--white);font:400 1rem/1.55 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stage{position:fixed;inset:0;overflow:hidden}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:0 1.15rem;border-radius:999px;border:2px solid var(--btn-fill);font:600 .95rem/1 var(--body);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color .18s,color .18s,transform .18s}
.btn-primary{background:var(--btn-fill);color:var(--btn-ink)}
.btn-primary:hover{background:var(--btn-ink);color:var(--btn-fill)}
.btn-secondary{background:var(--btn-ink);color:var(--btn-fill)}
.btn-secondary:hover{background:var(--btn-fill);color:var(--btn-ink)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* ---------- prototype chrome ---------- */
.proto{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
.proto>*{pointer-events:auto}
.tag{display:inline-flex;align-items:center;gap:.55rem;background:var(--black);color:var(--white);border-radius:999px;padding:.4rem .85rem .4rem .45rem;font:500 .78rem/1 var(--body);letter-spacing:.02em}
.tag b{font:700 .72rem/1 var(--display);background:var(--orange);color:var(--black);border-radius:999px;padding:.32rem .5rem;letter-spacing:.04em}
.clock{display:flex;align-items:center;gap:.6rem;background:var(--black);border-radius:999px;padding:.3rem .8rem;font:500 .78rem/1 var(--body)}
.clock input{width:clamp(90px,22vw,180px);accent-color:var(--orange);height:28px}
.clock output{font-variant-numeric:tabular-nums;min-width:4.6em;color:var(--mist)}

/* ---------- the lockup: a few words set beside the scene, not a panel on top of it ---------- */
.scrim{position:fixed;z-index:29;inset:0 auto 0 0;width:calc(var(--scene-left) + 160px);pointer-events:none;background:linear-gradient(90deg,rgba(0,0,60,.94) 0%,rgba(0,0,60,.82) 58%,rgba(0,0,60,0) 100%)}
.lock{position:fixed;z-index:30;left:clamp(24px,4.2vw,64px);top:50%;transform:translateY(-50%);width:min(23rem,calc(100vw - 48px));display:grid;gap:1.6rem}
.brand{display:flex;align-items:center;gap:.6rem;font:500 .85rem/1 var(--body);color:var(--mist);letter-spacing:.01em}
.brand img{width:22px;height:23px}
.lock h1{margin:0;font:700 clamp(2.8rem,4.8vw,4.4rem)/.9 var(--display);letter-spacing:-.045em;text-wrap:balance}
.lock h1 span{color:var(--orange)}
.lede{margin:1.1rem 0 0;font:400 1.05rem/1.5 var(--body);color:var(--mist);max-width:21rem}
.time{display:flex;align-items:center;gap:.9rem;padding-left:.9rem;border-left:3px solid var(--orange)}
.time b{font:600 1.75rem/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.time span{font:400 .85rem/1.35 var(--body);color:var(--mist);min-width:0}
.time span strong{font-weight:500;color:var(--white)}
.cap{display:flex;align-items:center;gap:.25rem;background:var(--white);border-radius:999px;padding:.3rem;box-shadow:0 0 0 0 rgba(255,101,0,0);transition:box-shadow .2s;
  /* a light surface inside the dark page, so the pair returns to its paper colours */
  --btn-fill:#000000;--btn-ink:#ffffff}
.cap:focus-within{box-shadow:0 0 0 3px var(--orange)}
.cap.bad{box-shadow:0 0 0 3px var(--orange)}
.cap input{flex:1;min-width:0;min-height:44px;border:0;background:transparent;padding:0 .4rem 0 1rem;color:var(--black);font:400 1rem/1 var(--body)}
.cap input::placeholder{color:#62627a}
.cap input:focus{outline:none}
.cap .btn{min-height:44px;flex:none}
.note-s{margin:.55rem 0 0 1rem;font:400 .8rem/1.3 var(--body);color:var(--mist)}
.note-s.bad{color:#ffb27a}
.thanks{display:grid;gap:.9rem}
.thanks p{margin:0;display:flex;align-items:center;gap:.7rem;font:500 1rem/1.35 var(--body)}
.thanks p i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--orange);display:grid;place-items:center}
.thanks p i svg{display:block}
.ask{display:grid;gap:.5rem}
.ask small{font-size:.8rem;color:var(--mist)}
.ask div{display:flex;flex-wrap:wrap;gap:.4rem}
.ask button{min-height:36px;padding:0 .85rem;border-radius:999px;border:1.5px solid #4a4ab8;background:var(--navy-deep);color:var(--white);font:500 .84rem/1 var(--body);cursor:pointer;transition:background-color .15s,color .15s,border-color .15s}
.ask button:hover{border-color:var(--white)}
.ask button[aria-pressed=true]{background:var(--white);color:var(--black);border-color:var(--white)}
.micro{margin:0;font:400 .85rem/1.5 var(--body);color:var(--mist)}
.micro a,.micro button{font:inherit;color:var(--white);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:3px}
.micro a:hover,.micro button:hover{text-decoration-color:var(--orange)}
.micro .dot{margin:0 .45rem;color:#4a4ab8}

/* phones: the lockup becomes one compact strip along the bottom */
@media (max-width:999px){
  .scrim{inset:auto 0 0 0;width:auto;height:250px;background:linear-gradient(0deg,rgba(0,0,60,.97) 0%,rgba(0,0,60,.9) 62%,rgba(0,0,60,0) 100%)}
  .lock{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:16px;right:16px;width:auto;transform:none;gap:.8rem;grid-template-columns:1fr auto;align-items:end}
  .lock>*{grid-column:1 / -1}
  .brand,.lede{display:none}
  .head{grid-column:1}
  .lock h1{font-size:2rem;letter-spacing:-.035em}
  .time{grid-column:2;border:0;padding:0;flex-direction:column;align-items:flex-end;gap:.25rem;text-align:right}
  .time b{font-size:1.25rem;color:var(--orange)}
  .time span{font-size:.72rem}
  .time .local{display:none}
  .note-s{display:none}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
