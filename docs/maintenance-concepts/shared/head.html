<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Shared shell for every maintenance concept. The maintenance page is always
   the navy ground, so this is a deliberate single-theme page: every colour is
   set explicitly and nothing depends on the host's theme. */
:root{
  color-scheme:dark;
  --navy:#000065; --navy-deep:#00003f; --navy-lift:#12128a; --navy-line:#2a2aa0;
  --orange:#ff6500; --white:#ffffff; --black:#000000; --mist:#c7c9ec;
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --body:"Outfit",ui-sans-serif,system-ui,sans-serif;
  /* The site's button pair on a dark ground: primary is white on black ink,
     secondary is the same two colours the other way round, edged in white. */
  --btn-fill:#ffffff; --btn-ink:#000000;
  --scene-left:0px;
}
@media (min-width:1000px){:root{--scene-left:calc(26rem + 32px)}}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--white);font:400 1rem/1.55 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stage{position:fixed;inset:0;overflow:hidden}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:0 1.15rem;border-radius:999px;border:2px solid var(--btn-fill);font:600 .95rem/1 var(--body);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color .18s,color .18s,transform .18s}
.btn-primary{background:var(--btn-fill);color:var(--btn-ink)}
.btn-primary:hover{background:var(--btn-ink);color:var(--btn-fill)}
.btn-secondary{background:var(--btn-ink);color:var(--btn-fill)}
.btn-secondary:hover{background:var(--btn-fill);color:var(--btn-ink)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* ---------- prototype chrome ---------- */
.proto{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
.proto>*{pointer-events:auto}
.tag{display:inline-flex;align-items:center;gap:.55rem;background:var(--black);color:var(--white);border-radius:999px;padding:.4rem .85rem .4rem .45rem;font:500 .78rem/1 var(--body);letter-spacing:.02em}
.tag b{font:700 .72rem/1 var(--display);background:var(--orange);color:var(--black);border-radius:999px;padding:.32rem .5rem;letter-spacing:.04em}
.clock{display:flex;align-items:center;gap:.6rem;background:var(--black);border-radius:999px;padding:.3rem .8rem;font:500 .78rem/1 var(--body)}
.clock input{width:clamp(90px,22vw,180px);accent-color:var(--orange);height:28px}
.clock output{font-variant-numeric:tabular-nums;min-width:4.6em;color:var(--mist)}

/* ---------- the dock: message, time, notify-me, what still works ---------- */
.dock{position:fixed;z-index:30;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(26rem,calc(100vw - 32px));max-height:calc(100dvh - 90px);overflow:auto;background:var(--navy-deep);border:1px solid var(--navy-line);border-radius:20px;padding:1.1rem 1.15rem 1rem;box-shadow:0 24px 60px -20px rgba(0,0,20,.8);display:grid;gap:.8rem;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.dock-top{display:flex;align-items:center;gap:.7rem;min-width:0}
.dock-top img{width:30px;height:31px;flex:none}
.eyebrow{font:600 .72rem/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--orange);min-width:0}
.dock-toggle{margin-left:auto;flex:none;width:44px;height:44px;border-radius:999px;border:0;background:var(--navy-lift);color:var(--white);cursor:pointer;display:grid;place-items:center}
.dock-toggle svg{transition:transform .25s}
.dock h1{font:700 clamp(1.7rem,4.2vw,2.2rem)/1.05 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.dock .msg{margin:0;color:var(--mist);font-size:.97rem}
.when{display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;align-items:baseline;background:var(--navy-lift);border-radius:14px;padding:.7rem .85rem}
.when .count{grid-row:span 2;font:700 1.5rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--white)}
.when small{font-size:.82rem;color:var(--mist);min-width:0}
.when small strong{color:var(--white);font-weight:500}
.notify{display:grid;gap:.55rem}
.notify label{font:600 .9rem/1.3 var(--body)}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
.row input[type=email]{flex:1 1 12rem;min-width:0;min-height:44px;border-radius:999px;border:2px solid var(--navy-line);background:var(--navy);padding:0 1rem;color:var(--white)}
.row input[type=email]::placeholder{color:#9a9ccf}
.row input[type=email]:focus{border-color:var(--white);outline:none}
.row input[aria-invalid=true]{border-color:var(--orange)}
.why{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.4rem}
.why legend{font-size:.8rem;color:var(--mist);margin-bottom:.35rem;padding:0}
.why label{position:relative}
.why input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.why span{display:inline-flex;align-items:center;min-height:36px;padding:0 .8rem;border-radius:999px;background:var(--navy-lift);color:var(--white);font:500 .82rem/1 var(--body);transition:background-color .15s,color .15s}
.why input:checked+span{background:var(--white);color:var(--black)}
.why input:focus-visible+span{outline:3px solid var(--orange);outline-offset:2px}
.fine{margin:0;font-size:.78rem;color:var(--mist)}
.err{margin:0;font-size:.82rem;color:var(--orange);min-height:0}
.done{display:grid;gap:.35rem;background:var(--navy-lift);border-radius:14px;padding:.85rem}
.done strong{font:700 1.05rem/1.2 var(--display)}
.done p{margin:0;font-size:.88rem;color:var(--mist)}
.still{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;border-top:1px solid var(--navy-line);padding-top:.75rem}
.still p{margin:0 0 .15rem;width:100%;font-size:.8rem;color:var(--mist)}
.still .btn{min-height:40px;font-size:.84rem;padding:0 .9rem}
.proto-note{font-size:.72rem;color:#8f92c9;margin:0}

/* collapsed: only the head row, the countdown and the notify action */
.dock.min{gap:.55rem}
.dock.min h1{font-size:1.45rem}
.dock.min .dock-body{display:none}
.dock.min .dock-toggle svg{transform:rotate(180deg)}
.dock .mini{display:none}
.dock.min .mini{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.mini .count-mini{font:700 1rem/1 var(--display);color:var(--orange);font-variant-numeric:tabular-nums}
.mini .btn{margin-left:auto;min-height:40px}
.dock-body{display:grid;gap:.8rem}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
