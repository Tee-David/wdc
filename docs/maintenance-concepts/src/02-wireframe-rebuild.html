<title>Wireframe Rebuild</title>
<!--@head-->
<style>
.stage{background-color:var(--navy);background-image:linear-gradient(rgba(120,125,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(120,125,255,.12) 1px,transparent 1px),linear-gradient(rgba(120,125,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,125,255,.06) 1px,transparent 1px);background-size:96px 96px,96px 96px,24px 24px,24px 24px}
.frame{position:absolute;left:calc(var(--scene-left) + 32px);right:32px;top:84px;bottom:92px}
@media (max-width:999px){.frame{left:16px;right:16px;top:72px;bottom:150px}}
svg.wire{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.box{transform-box:view-box;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.65,0,.2,1),fill .5s,opacity .5s,stroke .5s;fill:transparent;stroke:#ffffff;stroke-width:1.5;stroke-dasharray:6 5;opacity:0}
.drafting .box{opacity:1}
.filled .box{stroke-dasharray:none;stroke:transparent}
.filled .box.k-lede{fill:#ffffff}
.htext{position:absolute;left:0;top:0;margin:0;display:flex;align-items:center;font:700 var(--fs,40px)/1 var(--display);letter-spacing:-.03em;color:var(--white);opacity:0;transition:opacity .5s,transform 1.1s cubic-bezier(.65,0,.2,1);pointer-events:none;text-wrap:balance}
.htext span{color:var(--orange)}
.filled .htext{opacity:1}
.filled .box.k-img{fill:#ff6500}
.filled .box.k-btn1{fill:#ffffff}
.filled .box.k-btn2{fill:#000000;stroke:#ffffff}
.filled .box.k-nav,.filled .box.k-card{fill:#12128a}
.filled .box.k-logo{fill:#ff6500}
.box.gone{opacity:0!important}
.lab{position:absolute;left:0;top:0;transform:translate(var(--x),var(--y));transition:transform 1.1s cubic-bezier(.65,0,.2,1),opacity .4s;font:600 .7rem/1 var(--body);letter-spacing:.04em;color:var(--black);background:var(--orange);padding:.3rem .45rem;border-radius:4px;white-space:nowrap;opacity:0;font-variant-numeric:tabular-nums;pointer-events:none}
.measuring .lab{opacity:1}
.cursor{position:absolute;left:0;top:0;z-index:5;transition:transform .7s cubic-bezier(.5,0,.2,1);pointer-events:none}
.cursor span{position:absolute;left:18px;top:18px;background:var(--white);color:var(--black);font:600 .72rem/1 var(--body);padding:.3rem .5rem;border-radius:999px;white-space:nowrap}
.caption{position:absolute;right:32px;bottom:28px;left:calc(var(--scene-left) + 32px);display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.caption p{margin:0;font:600 clamp(1.1rem,2.4vw,1.6rem)/1.1 var(--display);letter-spacing:-.01em}
.caption p span{color:var(--orange)}
.caption small{font-size:.85rem;color:var(--mist);font-variant-numeric:tabular-nums}
@media (max-width:999px){.caption{left:16px;right:16px;bottom:96px}}
</style>
<main class="stage" data-n="02" data-name="Wireframe rebuild">
  <div class="frame" id="frame">
    <svg class="wire" id="wire" aria-hidden="true"></svg>
    <p class="htext" id="htext" aria-hidden="true">We are rebuilding<span>.</span></p>
  </div>
  <div class="cursor" id="cursor" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M2 2l7 18 2.6-7.4L19 10z" fill="#ff6500" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Designer</span></div>
  <div class="caption">
    <p>Brilliant simplicity <span>of thought.</span></p>
    <small id="status" aria-live="polite">Layout 1 of 3</small>
  </div>
</main>
<!--@dock-->
<!--@js-->
<script>
(function(){
  var frame = document.getElementById('frame'), svg = document.getElementById('wire'), cursor = document.getElementById('cursor'), status = document.getElementById('status');
  var NS = 'http://www.w3.org/2000/svg';
  var keys = ['nav','logo','h1','lede','lede2','btn1','btn2','img','card1','card2','card3','card4'];
  var kind = {nav:'nav',logo:'logo',h1:'h1',lede:'lede',lede2:'lede',btn1:'btn1',btn2:'btn2',img:'img',card1:'card',card2:'card',card3:'card',card4:'card'};
  var names = {h1:'h1 · Space Grotesk',img:'hero image',btn1:'primary',card1:'card'};
  /* x, y, w, h in percent of the frame. Missing means the box is not used. */
  var layouts = [
    {name:'Split hero', nav:[0,0,100,7], logo:[1.5,1.5,5,4], h1:[0,16,52,20], lede:[0,40,44,3], lede2:[0,45,34,3], btn1:[0,54,16,7], btn2:[18,54,16,7], img:[58,14,42,52], card1:[0,74,32,26], card2:[34,74,32,26], card3:[68,74,32,26]},
    {name:'Centred', nav:[0,0,100,7], logo:[47.5,1.5,5,4], h1:[18,14,64,16], lede:[26,33,48,3], lede2:[32,38,36,3], btn1:[33,45,16,7], btn2:[51,45,16,7], img:[0,57,100,20], card1:[0,81,23.5,19], card2:[25.5,81,23.5,19], card3:[51,81,23.5,19], card4:[76.5,81,23.5,19]},
    {name:'Editorial', nav:[0,0,100,7], logo:[1.5,1.5,5,4], img:[0,12,46,88], h1:[50,14,50,28], lede:[50,47,46,3], lede2:[50,52,38,3], btn1:[50,60,18,7], btn2:[70,60,18,7], card1:[50,74,24,26], card2:[76,74,24,26]}
  ];
  var els = {}, labs = {};
  keys.forEach(function(k){
    var r = document.createElementNS(NS,'rect');
    r.setAttribute('width',1); r.setAttribute('height',1); r.setAttribute('vector-effect','non-scaling-stroke');
    r.setAttribute('class','box k-'+kind[k]); svg.appendChild(r); els[k] = r;
    if (names[k]){ var l = document.createElement('span'); l.className = 'lab'; frame.appendChild(l); labs[k] = l; }
  });
  var cur = 0, W = 0, H = 0;
  function rectPx(k, L){ var v = layouts[L][k]; if (!v) return null; return [v[0]/100*W, v[1]/100*H, Math.max(1,v[2]/100*W), Math.max(1,v[3]/100*H)]; }
  function place(L){
    keys.forEach(function(k){
      var r = rectPx(k, L), el = els[k];
      el.classList.toggle('gone', !r);
      if (!r) return;
      var rad = kind[k]==='btn1'||kind[k]==='btn2' ? Math.min(r[2],r[3])/2 : 6;
      el.style.transform = 'translate('+r[0]+'px,'+r[1]+'px) scale('+r[2]+','+r[3]+')';
      el.setAttribute('rx', rad/r[2]); el.setAttribute('ry', rad/r[3]);
      if (labs[k]){ labs[k].style.setProperty('--x', r[0]+'px'); labs[k].style.setProperty('--y', (r[1]-24)+'px'); labs[k].textContent = names[k]+' · '+Math.round(r[2])+' × '+Math.round(r[3]); }
    });
    var h = rectPx('h1', L), ht = document.getElementById('htext');
    ht.style.transform = 'translate('+h[0]+'px,'+h[1]+'px)'; ht.style.width = h[2]+'px'; ht.style.height = h[3]+'px';
    ht.style.setProperty('--fs', Math.min(h[3]/2.2, h[2]/5.2)+'px');
    status.textContent = 'Layout '+(L+1)+' of 3 · '+layouts[L].name;
  }
  function size(){ var b = frame.getBoundingClientRect(); W = b.width; H = b.height; svg.setAttribute('viewBox','0 0 '+W+' '+H); place(cur); }
  addEventListener('resize', size); size();

  function pointAt(k){
    var r = rectPx(k, cur); if (!r) return;
    var b = frame.getBoundingClientRect();
    cursor.style.transform = 'translate('+(b.left+r[0]+r[2]*.7)+'px,'+(b.top+r[1]+r[3]*.6)+'px)';
  }
  var wait = function(ms){ return new Promise(function(res){ setTimeout(res, ms); }); };
  var stageEl = frame;

  if (WDC.reduced){
    stageEl.classList.add('drafting','filled'); cursor.hidden = true; return;
  }
  /* The cycle: draft the boxes, measure them, fill them, then try the next idea. */
  async function run(){
    stageEl.classList.add('drafting');
    for (;;){
      stageEl.classList.remove('filled');
      await wait(300);
      stageEl.classList.add('measuring');
      for (var i = 0; i < 4; i++){ pointAt(['h1','img','btn1','card1'][i]); await wait(650); }
      stageEl.classList.remove('measuring');
      stageEl.classList.add('filled');
      pointAt('btn1');
      await wait(2600);
      stageEl.classList.remove('filled');
      await wait(500);
      cur = (cur + 1) % layouts.length;
      place(cur);
      pointAt('h1');
      await wait(1300);
    }
  }
  /* Hold the loop while the tab is hidden. */
  var realWait = wait;
  wait = function(ms){ return realWait(ms).then(function(){ if (!document.hidden) return; return new Promise(function(res){ document.addEventListener('visibilitychange', function f(){ if (!document.hidden){ document.removeEventListener('visibilitychange', f); res(); } }); }); }); };
  pointAt('h1'); run();
})();
</script>
