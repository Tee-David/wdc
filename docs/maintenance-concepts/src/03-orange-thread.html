<title>The Orange Thread</title>
<!--@head-->
<style>
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.word{position:absolute;left:calc(var(--scene-left) + 32px);right:32px;bottom:9vh;text-align:center;margin:0;font:600 clamp(1.4rem,3.4vw,2.6rem)/1 var(--display);letter-spacing:-.02em;color:var(--white);transition:opacity .4s}
.word small{display:block;margin-top:.7rem;font:500 .85rem/1.4 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
@media (max-width:999px){.word{left:16px;right:16px;bottom:auto;top:12vh}}
</style>
<main class="stage" data-n="03" data-name="The orange thread" data-dock="">
  <canvas id="c" aria-hidden="true"></canvas>
  <p class="word" id="word" aria-hidden="true">Thinking<small>One line, many ideas</small></p>
</main>
<!--@dock-->
<!--@js-->
<script>
(function(){
  var cv = document.getElementById('c'), ctx = cv.getContext('2d'), word = document.getElementById('word');
  var N = 520, dpr = Math.min(2, devicePixelRatio || 1), W, H, cx, cy, R;

  /* ---- shapes, each a list of strokes in -1..1 space, joined into one path ---- */
  function arc(x, y, r, a0, a1, n){ var p = []; for (var i = 0; i <= n; i++){ var a = a0 + (a1-a0)*i/n; p.push([x+Math.cos(a)*r, y+Math.sin(a)*r]); } return p; }
  function fn(f, n){ var p = []; for (var i = 0; i <= n; i++) p.push(f(i/n)); return p; }
  var backDate = new Date(WDC.backBy);
  var lagos = new Date(backDate.toLocaleString('en-US',{timeZone:'Africa/Lagos'}));
  var hh = lagos.getHours()%12 + lagos.getMinutes()/60, mm = lagos.getMinutes();
  var shapes = [
    {w:'Thinking', s:'One line, many ideas', p: fn(function(t){ return [-.55 + 1.1*t, 0]; }, 40)},
    {w:'Tinkering', s:'Trying things out', p: fn(function(t){ var x = -1 + 2*t; return [x, Math.sin(t*Math.PI*6)*.22*Math.sin(t*Math.PI)]; }, 200)},
    {w:'Fine tuning', s:'Every part in its place', p: fn(function(t){ var a = t*Math.PI*2 - Math.PI/2, r = .62 + .12*Math.tanh(5*Math.sin(a*10)); return [Math.cos(a)*r, Math.sin(a)*r]; }, 400)},
    {w:'An idea', s:'The good kind', p: [].concat([[-.2,.78],[-.2,.5]], arc(0,-.05,.5, Math.PI*.64, Math.PI*2.36, 90), [[.2,.5],[.2,.78],[-.2,.78],[-.14,.9],[.14,.9]])},
    {w:'Sketching', s:'Drawing it out first', p: [[-.85,-.14],[.5,-.14],[.85,0],[.5,.14],[-.85,.14],[-.85,-.14],[-.62,-.14],[-.62,.14],[-.62,-.14],[.5,-.14],[.5,.14]]},
    {w:'Coffee', s:'Obviously', p: [].concat(fn(function(t){ return [-.32 + Math.sin(t*Math.PI*3)*.06, -.95 + t*.55]; }, 40), [[-.5,-.35],[-.44,.5]], arc(0,.5,.44,Math.PI,0,30).map(function(q){ return [q[0], .5 + (q[1]-.5)*.35]; }), [[.44,.5],[.5,-.35]], arc(.62,.02,.2,-Math.PI*.55,Math.PI*.55,30), [[.5,-.35],[-.5,-.35]])},
    {w:'Back by '+String(lagos.getHours()).padStart(2,'0')+':'+String(mm).padStart(2,'0'), s:'Lagos time, on the clock', p: (function(){
      var ha = hh/12*Math.PI*2 - Math.PI/2, ma = mm/60*Math.PI*2 - Math.PI/2;
      return [].concat(arc(0,0,.66,-Math.PI/2,Math.PI*1.5,160), [[0,-.66],[0,0],[Math.cos(ha)*.34, Math.sin(ha)*.34],[0,0],[Math.cos(ma)*.52, Math.sin(ma)*.52]]);
    })()}
  ];
  function resample(pts){
    var L = [0]; for (var i = 1; i < pts.length; i++) L.push(L[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
    var total = L[L.length-1] || 1, out = [], j = 1;
    for (var k = 0; k < N; k++){
      var d = total*k/(N-1);
      while (j < L.length-1 && L[j] < d) j++;
      var seg = (L[j]-L[j-1]) || 1, t = (d-L[j-1])/seg;
      out.push([pts[j-1][0] + (pts[j][0]-pts[j-1][0])*t, pts[j-1][1] + (pts[j][1]-pts[j-1][1])*t]);
    }
    return out;
  }
  shapes.forEach(function(s){ s.r = resample(s.p); });

  function size(){
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr;
    var left = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--scene-left')) || 0;
    if (innerWidth >= 1000) left = 26*16 + 32;
    cx = left + (W-left)/2; cy = innerWidth >= 1000 ? H*.44 : H*.46;
    R = Math.min((W-left)*.34, H*.3);
  }
  addEventListener('resize', size); size();

  var pointer = {x:-9999, y:-9999, k:0};
  addEventListener('pointermove', function(e){ pointer.x = e.clientX; pointer.y = e.clientY; });
  document.addEventListener('pointerleave', function(){ pointer.x = pointer.y = -9999; });

  var idx = 0, t = 0, HOLD = 2.2, MORPH = 1.5, shown = -1;
  var cur = shapes[0].r.map(function(p){ return p.slice(); });
  function ease(x){ return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; }

  function draw(pts, now){
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#ff6500'; ctx.lineWidth = 4.5;
    ctx.shadowColor = 'rgba(255,101,0,.55)'; ctx.shadowBlur = 18;
    ctx.beginPath();
    for (var i = 0; i < N; i++){
      var x = cx + pts[i][0]*R, y = cy + pts[i][1]*R;
      /* the line leans toward the pointer, a little */
      var dx = pointer.x - x, dy = pointer.y - y, d = Math.hypot(dx, dy);
      if (d < 180 && d > 0){ var f = (1 - d/180); f = f*f*26; x += dx/d*f; y += dy/d*f; }
      if (now){ y += Math.sin(now/700 + i*.035)*1.4; }
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    /* the pen tip */
    var e = pts[N-1]; ctx.shadowBlur = 24; ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(cx + e[0]*R, cy + e[1]*R, 5, 0, Math.PI*2); ctx.fill();
  }
  function setWord(i){
    if (i === shown) return; shown = i;
    word.style.opacity = 0;
    setTimeout(function(){ word.firstChild.textContent = shapes[i].w; word.querySelector('small').textContent = shapes[i].s; word.style.opacity = 1; }, 250);
  }

  if (WDC.reduced){
    var last = shapes.length - 1; setWord(last);
    function still(){ size(); draw(shapes[last].r, 0); }
    addEventListener('resize', still); still(); return;
  }
  WDC.loop(function(dt, now){
    t += dt;
    var from = shapes[idx].r, to = shapes[(idx+1) % shapes.length].r;
    if (t < HOLD){ cur = from; setWord(idx); }
    else {
      var k = ease(Math.min(1, (t-HOLD)/MORPH));
      cur = from.map(function(p, i){ return [p[0] + (to[i][0]-p[0])*k, p[1] + (to[i][1]-p[1])*k]; });
      if (k > .5) setWord((idx+1) % shapes.length);
      if (t >= HOLD + MORPH){ t = 0; idx = (idx+1) % shapes.length; }
    }
    draw(cur, now);
  });
})();
</script>
