<title>The Tiny Crew</title>
<!--@head-->
<style>
.stage{background:linear-gradient(180deg,var(--navy) 0%,#00007a 100%)}
.ground{position:absolute;left:0;right:0;bottom:0;background:#00003f;border-top:3px solid var(--orange)}
#scaf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.crate{position:absolute;width:96px;height:54px;background:#7a3a00;border:3px solid #ff6500;border-radius:6px;display:grid;place-items:center;font:700 .62rem/1 var(--body);letter-spacing:.14em;color:#ffffff;text-transform:uppercase;z-index:3}
.lt{position:absolute;left:0;top:0;display:grid;place-items:center;font:700 var(--fs) / 1 var(--display);letter-spacing:-.02em;color:var(--white);will-change:transform;pointer-events:none;z-index:2}
.lt.o{color:var(--orange)}
.lt.crated{z-index:1}
.wk{position:absolute;left:0;top:0;width:34px;height:52px;margin-left:-17px;touch-action:none;cursor:grab;z-index:4;will-change:transform}
.wk:active{cursor:grabbing}
.fig{position:absolute;inset:0}
.fig i{position:absolute;display:block}
.hat{left:6px;top:0;width:22px;height:11px;border-radius:11px 11px 2px 2px;background:var(--orange)}
.hat::after{content:"";position:absolute;left:-4px;right:-4px;bottom:-2px;height:3px;border-radius:2px;background:var(--orange)}
.head{left:8px;top:9px;width:18px;height:16px;border-radius:50%;background:var(--white)}
.head::before,.head::after{content:"";position:absolute;top:6px;width:3px;height:3px;border-radius:50%;background:var(--black)}
.head::before{left:5px}.head::after{right:5px}
.bod{left:6px;top:25px;width:22px;height:17px;border-radius:7px;background:var(--black);border:2px solid var(--white)}
.bod::after{content:"";position:absolute;left:4px;right:4px;top:5px;height:2px;background:var(--white);border-radius:1px}
.leg{top:40px;width:4px;height:12px;border-radius:2px;background:var(--white);transform-origin:top center}
.leg.l{left:11px}.leg.r{left:19px}
.arm{top:14px;width:4px;height:14px;border-radius:2px;background:var(--white);opacity:0}
.arm.a1{left:3px;transform:rotate(-15deg)}.arm.a2{left:27px;transform:rotate(15deg)}
.wk.carry .arm{opacity:1}
.wk.walk .leg.l{animation:step .36s ease-in-out infinite alternate}
.wk.walk .leg.r{animation:step .36s ease-in-out infinite alternate-reverse}
.wk.held .leg.l{animation:kick .16s ease-in-out infinite alternate}
.wk.held .leg.r{animation:kick .16s ease-in-out infinite alternate-reverse}
.wk.climb .leg.l{animation:climb .3s infinite alternate}.wk.climb .leg.r{animation:climb .3s infinite alternate-reverse}
@keyframes step{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
@keyframes kick{from{transform:rotate(55deg)}to{transform:rotate(-55deg)}}
@keyframes climb{from{transform:translateY(-4px)}to{transform:translateY(1px)}}
.wk.left .fig{transform:scaleX(-1)}
.bub{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%) scale(.6);opacity:0;background:var(--white);color:var(--black);font:600 .74rem/1 var(--body);padding:.35rem .55rem;border-radius:999px;white-space:nowrap;transition:opacity .2s,transform .2s;pointer-events:none}
.bub.on{opacity:1;transform:translateX(-50%) scale(1)}
.hint{position:absolute;right:24px;top:72px;margin:0;font-size:.9rem;color:var(--mist);max-width:18rem;text-align:right}
@media (max-width:999px){.hint{left:16px;right:16px;text-align:left}}
</style>
<main class="stage" id="stage" data-n="07" data-name="The tiny crew">
  <div class="ground" id="ground" aria-hidden="true"></div>
  <svg id="scaf" aria-hidden="true"></svg>
  <div class="crate" id="crate" aria-hidden="true">Letters</div>
  <div id="world" aria-hidden="true"></div>
  <p class="hint">The crew is putting the sign back up. Pick one up. Drop the one with the K near the gap.</p>
  <p class="sr" id="sr" aria-live="polite"></p>
</main>
<!--@dock-->
<!--@js-->
<script>
(function(){
  var world = document.getElementById('world'), scaf = document.getElementById('scaf'), crate = document.getElementById('crate'), groundEl = document.getElementById('ground'), sr = document.getElementById('sr');
  var TEXT = 'BACK SHORTLY', G = {}, letters = [], workers = [], kDropped = false, done = false, doneAt = 0;
  var WALK = 95, CLIMB = 80, GRAV = 1700;

  function layout(){
    var W = innerWidth, H = innerHeight, left = W >= 1000 ? 26*16 + 48 : 16;
    var ground = W >= 1000 ? H - 70 : H - 150;
    var slot = Math.max(22, Math.min(64, (W - left - 150)/12));
    var sx1 = W - 28, sx0 = sx1 - slot*12 - 16;
    G = {W:W, H:H, left:left, ground:ground, plat:ground - Math.max(150, slot*3.4), slot:slot, sx0:sx0, sx1:sx1, ladder:sx0 - 14, pile:Math.max(left + 50, Math.min(sx0 - 110, left + 90))};
    groundEl.style.top = ground+'px';
    crate.style.left = (G.pile - 48)+'px'; crate.style.top = (ground - 54)+'px';
    var s = '', py = G.plat;
    s += '<rect x="'+sx0+'" y="'+py+'" width="'+(sx1-sx0)+'" height="8" rx="2" fill="#c7c9ec"/>';
    for (var x = sx0 + 6; x <= sx1; x += slot*2){
      s += '<line x1="'+x+'" y1="'+(py+8)+'" x2="'+x+'" y2="'+ground+'" stroke="#3a3ab6" stroke-width="4"/>';
    }
    for (x = sx0 + 6; x + slot*2 <= sx1; x += slot*2){
      s += '<line x1="'+x+'" y1="'+(py+8)+'" x2="'+(x+slot*2)+'" y2="'+ground+'" stroke="#2a2aa0" stroke-width="2"/><line x1="'+(x+slot*2)+'" y1="'+(py+8)+'" x2="'+x+'" y2="'+ground+'" stroke="#2a2aa0" stroke-width="2"/>';
    }
    var lx = G.ladder;
    s += '<line x1="'+(lx-9)+'" y1="'+(py-30)+'" x2="'+(lx-9)+'" y2="'+ground+'" stroke="#ffffff" stroke-width="3"/><line x1="'+(lx+9)+'" y1="'+(py-30)+'" x2="'+(lx+9)+'" y2="'+ground+'" stroke="#ffffff" stroke-width="3"/>';
    for (var y = ground - 16; y > py - 30; y -= 18) s += '<line x1="'+(lx-9)+'" y1="'+y+'" x2="'+(lx+9)+'" y2="'+y+'" stroke="#ffffff" stroke-width="3"/>';
    scaf.innerHTML = s;
    letters.forEach(function(l){ l.el.style.setProperty('--fs', (slot*1.05)+'px'); l.el.style.width = slot+'px'; l.el.style.height = (slot*1.15)+'px'; if (l.state === 'placed'){ l.x = slotX(l.pos); l.y = G.plat; } if (l.state === 'crate') crateSpot(l); });
    workers.forEach(function(w){ w.y = w.level === 'p' ? G.plat : G.ground; });
  }
  function slotX(pos){ return G.sx0 + 8 + pos*G.slot + G.slot/2; }
  function crateSpot(l){ l.x = G.pile - 30 + (l.i%4)*20; l.y = G.ground - 30 - Math.floor(l.i/4)*5; l.rot = ((l.i*37)%20 - 10); }

  /* letters */
  var pos = 0;
  TEXT.split('').forEach(function(ch, k){
    if (ch === ' '){ pos++; return; }
    var el = document.createElement('span'); el.className = 'lt'+(k < 4 ? ' o' : ''); el.textContent = ch; world.appendChild(el);
    letters.push({i:letters.length, ch:ch, pos:pos++, el:el, state:'crate', x:0, y:0, vx:0, vy:0, rot:0, by:null});
  });

  /* workers */
  for (var n = 0; n < 5; n++){
    var el = document.createElement('div'); el.className = 'wk';
    el.innerHTML = '<div class="fig"><i class="hat"></i><i class="arm a1"></i><i class="arm a2"></i><i class="head"></i><i class="bod"></i><i class="leg l"></i><i class="leg r"></i></div><span class="bub"></span>';
    world.appendChild(el);
    workers.push({el:el, x:0, y:0, vy:0, level:'g', task:'fetch', carry:null, dir:1, wait:n*.9, bubT:0, id:n});
  }
  layout(); addEventListener('resize', layout);
  workers.forEach(function(w, i){ w.x = G.pile + 70 + i*38; w.y = G.ground; });
  letters.forEach(crateSpot);

  function say(w, t, s){ var b = w.el.querySelector('.bub'); b.textContent = t; b.classList.add('on'); w.bubT = s || 1.4; }
  /* walk toward (x, level) using the ladder. true when there. */
  function go(w, x, level, dt){
    var ly = function(l){ return l === 'p' ? G.plat : G.ground; };
    if (w.level !== level || w.y !== ly(w.level)){
      if (Math.abs(w.x - G.ladder) > 2){ w.mode = 'walk'; return stepX(w, G.ladder, dt), false; }
      w.x = G.ladder; w.mode = 'climb';
      var ty = ly(level), d = ty - w.y, s = CLIMB*dt;
      if (Math.abs(d) <= s){ w.y = ty; w.level = level; } else w.y += Math.sign(d)*s;
      return false;
    }
    if (Math.abs(w.x - x) <= 2){ w.x = x; w.mode = 'stand'; return true; }
    w.mode = 'walk'; stepX(w, x, dt); return false;
  }
  function stepX(w, x, dt){ var d = x - w.x, s = WALK*dt; w.dir = d < 0 ? -1 : 1; w.x += Math.abs(d) <= s ? d : Math.sign(d)*s; }
  function nextLetter(){ return letters.find(function(l){ return l.state === 'crate' && !l.by; }); }

  function update(dt, now){
    workers.forEach(function(w){
      if (w.bubT > 0){ w.bubT -= dt; if (w.bubT <= 0) w.el.querySelector('.bub').classList.remove('on'); }
      if (w.wait > 0){ w.wait -= dt; w.mode = 'stand'; return; }
      if (w.task === 'held') return;
      if (w.task === 'fall'){
        w.vy += GRAV*dt; var ny = w.y + w.vy*dt;
        var onPlat = w.x > G.sx0 && w.x < G.sx1 && w.y <= G.plat && ny >= G.plat;
        if (onPlat || ny >= G.ground){
          w.y = onPlat ? G.plat : G.ground; w.level = onPlat ? 'p' : 'g'; w.vy = 0;
          w.task = w.carry ? 'deliver' : (w.after || 'fetch');
          var near = w.carry && w.carry.ch === 'K' && onPlat && Math.abs(w.x - slotX(w.carry.pos)) < G.slot*3;
          say(w, near ? 'Oh. There.' : ['Hmph.','Rude.','Fine.','I was busy.'][w.id%4]);
        } else w.y = ny;
        w.mode = 'fall'; return;
      }
      if (w.task === 'party'){ w.mode = 'stand'; w.y = w.level === 'p' ? G.plat : G.ground; w.hop = Math.abs(Math.sin(now/180 + w.id))*14; return; }
      w.hop = 0;
      if (w.task === 'fetch'){
        var l = w.target && w.target.state === 'crate' ? w.target : (w.target = nextLetter());
        if (!l){ w.task = 'idle'; return; }
        l.by = w;
        if (go(w, G.pile + 20, 'g', dt)){ l.state = 'carried'; w.carry = l; w.target = null; w.task = 'deliver'; w.wait = .35; }
      } else if (w.task === 'deliver'){
        var c = w.carry;
        if (c.ch === 'K' && !kDropped && w.level === 'p' && w.x > G.ladder + G.slot*1.2){
          kDropped = true; c.state = 'falling'; c.vx = 60*w.dir; c.vy = -120; w.carry = null; w.task = 'retrieve'; w.target = c;
          say(w, 'Oops.'); var other = workers.find(function(o){ return o !== w && o.task !== 'held'; }); if (other) setTimeout(function(){ say(other, '*sigh*'); }, 700);
          return;
        }
        if (go(w, slotX(c.pos), 'p', dt)){ c.state = 'placed'; c.x = slotX(c.pos); c.y = G.plat; c.rot = 0; c.by = null; w.carry = null; w.task = 'fetch'; w.wait = .3;
          if (c.ch === 'K') say(w, kDropped ? 'Got it this time.' : 'K.');
        }
      } else if (w.task === 'retrieve'){
        var t = w.target;
        if (t.state === 'falling'){ w.mode = 'stand'; return; }
        if (t.state !== 'ground'){ w.task = 'fetch'; return; }
        if (go(w, t.x, 'g', dt)){ t.state = 'carried'; w.carry = t; w.task = 'deliver'; w.wait = .4; say(w, 'Again.'); }
      } else if (w.task === 'idle'){
        if (!done) go(w, G.pile + 70 + w.id*30, 'g', dt);
      }
    });
    letters.forEach(function(l){
      if (l.state === 'carried'){ var w = l.by || workers.find(function(o){ return o.carry === l; }); if (w && w.carry === l){ l.x = w.x; l.y = w.y - 50 - (w.hop||0); l.rot = 0; } }
      if (l.state === 'falling'){
        l.vy += GRAV*dt; l.x += l.vx*dt; l.y += l.vy*dt; l.rot += 280*dt*Math.sign(l.vx||1);
        if (l.y >= G.ground){ l.y = G.ground; l.state = 'ground'; l.rot = 90*Math.sign(l.vx||1); }
      }
      if (l.state === 'carried' && !workers.some(function(o){ return o.carry === l; })){ l.state = 'ground'; l.y = G.ground; }
    });
    var placed = letters.every(function(l){ return l.state === 'placed'; });
    if (placed && !done){ done = true; doneAt = now; sr.textContent = 'The crew has put the sign back up: Back shortly.'; workers.forEach(function(w){ if (w.task !== 'held'){ w.task = 'party'; } }); say(workers[0], 'Done!', 3); }
    if (done && now - doneAt > 7000){
      done = false; kDropped = false;
      letters.forEach(function(l){ l.state = 'crate'; l.by = null; crateSpot(l); });
      workers.forEach(function(w){ if (w.task !== 'held'){ w.task = 'fetch'; w.carry = null; w.target = null; } });
    }
  }
  function paint(){
    workers.forEach(function(w){
      w.el.style.transform = 'translate('+w.x+'px,'+(w.y - 52 - (w.hop||0))+'px)';
      w.el.classList.toggle('walk', w.mode === 'walk'); w.el.classList.toggle('climb', w.mode === 'climb');
      w.el.classList.toggle('left', w.dir < 0); w.el.classList.toggle('carry', !!w.carry);
    });
    letters.forEach(function(l){
      var s = l.state === 'crate' ? .55 : l.state === 'carried' ? .75 : 1, h = G.slot*1.15;
      l.el.classList.toggle('crated', l.state === 'crate');
      l.el.style.transform = 'translate('+(l.x - G.slot/2)+'px,'+(l.y - h)+'px) rotate('+l.rot+'deg) scale('+s+')';
      l.el.style.transformOrigin = '50% 100%';
    });
  }

  if (WDC.reduced){
    letters.forEach(function(l){ l.state = 'placed'; l.x = slotX(l.pos); l.y = G.plat; });
    workers.forEach(function(w, i){ w.x = G.pile + 70 + i*40; w.y = G.ground; });
    paint(); addEventListener('resize', function(){ layout(); paint(); }); return;
  }
  WDC.loop(function(dt, now){ if (dt) update(dt, now); paint(); });

  /* pick them up */
  var held = null, off = null, lastY = 0, lastT = 0, moved = 0, start = null;
  world.addEventListener('pointerdown', function(e){
    var el = e.target.closest('.wk'); if (!el) return;
    held = workers.find(function(w){ return w.el === el; }); el.setPointerCapture(e.pointerId);
    held.after = held.task === 'retrieve' ? 'retrieve' : held.task === 'party' || held.task === 'idle' ? 'fetch' : held.task === 'fetch' ? 'fetch' : held.task;
    held.task = 'held'; el.classList.add('held'); held.mode = 'held';
    off = {x:e.clientX - held.x, y:e.clientY - held.y}; start = {x:e.clientX, y:e.clientY}; moved = 0; lastY = e.clientY; lastT = performance.now();
    say(held, ['Hey!','Put me down.','Whoa.','I have a job.'][Math.floor(Math.random()*4)]);
    e.preventDefault();
  });
  world.addEventListener('pointermove', function(e){
    if (!held) return;
    held.x = Math.max(12, Math.min(innerWidth - 12, e.clientX - off.x)); held.y = Math.max(60, Math.min(G.ground, e.clientY - off.y));
    var now = performance.now(); held.vy = (e.clientY - lastY)/Math.max(.008, (now - lastT)/1000); lastY = e.clientY; lastT = now;
    moved = Math.max(moved, Math.hypot(e.clientX - start.x, e.clientY - start.y));
  });
  function drop(){
    if (!held) return; held.el.classList.remove('held');
    held.task = 'fall'; held.vy = Math.max(-600, Math.min(900, held.vy||0)); held.level = 'air';
    if (moved < 6){ held.vy = -380; }
    held = null;
  }
  world.addEventListener('pointerup', drop); world.addEventListener('pointercancel', drop);
})();
</script>
