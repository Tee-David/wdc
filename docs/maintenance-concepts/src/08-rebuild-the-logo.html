<title>Rebuild the Logo</title>
<!--@head-->
<style>
.stage{background:radial-gradient(70% 60% at 62% 45%,#0e0e86 0%,var(--navy) 60%,#00004a 100%)}
.target{position:absolute;pointer-events:none}
.target img{width:100%;height:100%;opacity:.1;display:block}
.target::after{content:"";position:absolute;inset:-18px;border:1px dashed #3a3ab6;border-radius:24px}
.pc{position:absolute;left:0;top:0;background-repeat:no-repeat;cursor:grab;touch-action:none;will-change:transform;border-radius:3px}
.pc:hover{filter:drop-shadow(0 0 6px rgba(255,101,0,.9))}
.pc.held{cursor:grabbing;z-index:10;filter:drop-shadow(0 10px 16px rgba(0,0,0,.5)) drop-shadow(0 0 8px rgba(255,101,0,.8))}
.pc.set{cursor:default;filter:none;transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.pc.flash{animation:flash .6s}
@keyframes flash{0%{filter:brightness(2.4) drop-shadow(0 0 14px #ff6500)}100%{filter:none}}
.peer{position:absolute;left:0;top:0;pointer-events:none;z-index:12;transition:transform .12s linear}
.peer i{display:block;width:16px;height:16px;border-radius:50%;border:3px solid var(--orange);background:var(--navy)}
.peer span{position:absolute;left:18px;top:12px;font:600 .7rem/1 var(--body);background:var(--orange);color:var(--black);padding:.25rem .45rem;border-radius:999px;white-space:nowrap}
.hud{position:absolute;right:24px;top:70px;display:grid;justify-items:end;gap:.55rem;text-align:right}
.live{display:inline-flex;align-items:center;gap:.5rem;background:var(--black);border-radius:999px;padding:.45rem .8rem;font:500 .85rem/1 var(--body)}
.live i{width:9px;height:9px;border-radius:50%;background:#7c7c7c}
.live.on i{background:#2bd46b;box-shadow:0 0 0 4px rgba(43,212,107,.25)}
.count{font:700 clamp(1.4rem,3vw,2rem)/1 var(--display);font-variant-numeric:tabular-nums}
.count span{color:var(--orange)}
.hud small{color:var(--mist);font-size:.85rem;max-width:17rem}
.win{position:absolute;left:calc(var(--scene-left) + 24px);right:24px;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
.win.on{opacity:1}
.win b{display:block;font:700 clamp(2.4rem,6vw,5rem)/.95 var(--display);letter-spacing:-.04em;text-shadow:0 6px 30px rgba(0,0,40,.8)}
.win span{display:block;margin-top:.6rem;font:500 1rem/1.3 var(--body);color:var(--mist)}
.helper{position:absolute;right:24px;bottom:24px}
@media (max-width:999px){.hud{left:16px;right:16px;justify-items:start;text-align:left;top:64px}.helper{bottom:110px;right:16px}}
</style>
<main class="stage" id="stage" data-n="08" data-name="Rebuild the logo together">
  <div class="target" id="target"><img alt="" src="data:image/svg+xml;base64,@@MARK@@"></div>
  <div id="pieces" aria-hidden="true"></div>
  <div id="peers" aria-hidden="true"></div>
  <div class="hud">
    <span class="live" id="live"><i></i><span id="liveT">Only you, for now</span></span>
    <span class="count" id="count"><span>0</span> of 0 pieces</span>
    <small id="sub">Drag the pieces into the outline. Everyone who has this page open is building the same logo.</small>
  </div>
  <button class="btn btn-secondary helper" type="button" id="helper">Place a piece for me</button>
  <div class="win" id="win" aria-hidden="true"><b id="winT">You did that together.</b><span>The pieces scatter again in a moment.</span></div>
  <p class="sr" id="sr" aria-live="polite"></p>
</main>
<!--@dock-->
<!--@js-->
<script>
(function(){
  var target = document.getElementById('target'), piecesEl = document.getElementById('pieces'), peersEl = document.getElementById('peers');
  var countEl = document.getElementById('count'), sr = document.getElementById('sr'), win = document.getElementById('win');
  var COLS = 5, ROWS = 5, S = 300, AR = 944/904, pieces = [], mine = new Set(), others = new Set(), room = null, T = {};
  var img = new Image();
  img.onload = function(){
    /* cut the mark into a grid, and drop the cells with almost nothing in them */
    var c = document.createElement('canvas'), R = 600; c.width = R; c.height = Math.round(R*AR);
    var x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
    var url = c.toDataURL();
    for (var r = 0; r < ROWS; r++) for (var q = 0; q < COLS; q++){
      var w = c.width/COLS, h = c.height/ROWS, d = x.getImageData(q*w, r*h, w, h).data, on = 0;
      for (var i = 3; i < d.length; i += 16) if (d[i] > 40) on++;
      if (on/(d.length/16) < .06) continue;
      var el = document.createElement('div'); el.className = 'pc'; el.style.backgroundImage = 'url('+url+')';
      piecesEl.appendChild(el);
      pieces.push({el:el, q:q, r:r, id:pieces.length, x:0, y:0, rot:0, set:false, ph:Math.random()*6.28});
    }
    size(); scatter(); countEl.innerHTML = '<span>0</span> of '+pieces.length+' pieces';
    if (!WDC.reduced) WDC.loop(float); else paint();
  };
  img.src = target.querySelector('img').src;

  function size(){
    var left = innerWidth >= 1000 ? 26*16 + 32 : 0, W = innerWidth - left, H = innerHeight;
    S = Math.min(W*.5, H*.5, 380); var Hh = S*AR;
    T = {x:left + W/2 - S/2, y:H*.5 - Hh/2 + (innerWidth < 1000 ? -20 : 10), w:S, h:Hh, left:left};
    target.style.cssText = 'left:'+T.x+'px;top:'+T.y+'px;width:'+S+'px;height:'+Hh+'px';
    var pw = S/COLS, ph = Hh/ROWS;
    pieces.forEach(function(p){
      p.el.style.width = (pw+.8)+'px'; p.el.style.height = (ph+.8)+'px';
      p.el.style.backgroundSize = S+'px '+Hh+'px'; p.el.style.backgroundPosition = (-p.q*pw)+'px '+(-p.r*ph)+'px';
      p.hx = T.x + p.q*pw; p.hy = T.y + p.r*ph;
      if (p.set){ p.x = p.hx; p.y = p.hy; }
    });
  }
  addEventListener('resize', function(){ size(); paint(); });
  function scatter(){
    var W = innerWidth, H = innerHeight;
    pieces.forEach(function(p){
      p.set = false; p.el.classList.remove('set');
      /* somewhere around the outline, not on it */
      var a = Math.random()*6.28, d = S*(.75 + Math.random()*.45);
      p.x = Math.max(T.left + 10, Math.min(W - 80, T.x + S/2 + Math.cos(a)*d*1.15 - S/COLS/2));
      p.y = Math.max(110, Math.min(H - 170, T.y + T.h/2 + Math.sin(a)*d*.8));
      p.rot = (Math.random()-.5)*70;
    });
    paint();
  }
  function paint(){
    pieces.forEach(function(p){ p.el.style.transform = 'translate('+p.x+'px,'+p.y+'px) rotate('+(p.set ? 0 : p.rot)+'deg)'; });
  }
  function float(dt, now){
    pieces.forEach(function(p){
      if (p.set || p === held) return;
      p.x += Math.sin(now/1300 + p.ph)*.12; p.y += Math.cos(now/1500 + p.ph)*.12; p.rot += Math.sin(now/2000 + p.ph)*.03;
    });
    paint(); peersPaint();
  }
  function setPiece(p, fromPeer){
    if (p.set) return; p.set = true; p.x = p.hx; p.y = p.hy; p.rot = 0;
    p.el.classList.add('set','flash'); setTimeout(function(){ p.el.classList.remove('flash'); }, 600);
    if (!fromPeer){ mine.add(p.id); share(); }
    tally(); paint();
  }
  var lastN = -1, won = false;
  function tally(){
    var n = pieces.filter(function(p){ return p.set; }).length;
    countEl.innerHTML = '<span>'+n+'</span> of '+pieces.length+' pieces';
    if (n !== lastN && n % 5 === 0) sr.textContent = n+' of '+pieces.length+' pieces are in place.';
    lastN = n;
    if (n === pieces.length && !won){
      won = true;
      var together = (room && room.peers().length > 1);
      document.getElementById('winT').textContent = together ? 'You did that together.' : 'You did that.';
      win.classList.add('on'); sr.textContent = 'The logo is complete. ' + document.getElementById('winT').textContent;
      target.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:700});
      setTimeout(function(){ won = false; win.classList.remove('on'); mine.clear(); others.clear(); share(); scatter(); tally(); }, 6500);
    }
  }

  /* drag */
  var held = null, off = null;
  piecesEl.addEventListener('pointerdown', function(e){
    var el = e.target.closest('.pc'); if (!el) return;
    var p = pieces.find(function(q){ return q.el === el; }); if (!p || p.set) return;
    held = p; el.setPointerCapture(e.pointerId); el.classList.add('held'); p.rot = 0;
    off = {x:e.clientX - p.x, y:e.clientY - p.y}; paint(); e.preventDefault();
  });
  piecesEl.addEventListener('pointermove', function(e){
    if (held){ held.x = e.clientX - off.x; held.y = e.clientY - off.y; paint(); }
  });
  addEventListener('pointermove', function(e){ if (room) room.presence({cx:(e.clientX - T.x)/T.w, cy:(e.clientY - T.y)/T.h}).catch(function(){}); }, {passive:true});
  function drop(){
    if (!held) return; var p = held; held = null; p.el.classList.remove('held');
    if (Math.hypot(p.x - p.hx, p.y - p.hy) < Math.max(26, S/COLS*.45)) setPiece(p);
    else { p.rot = (Math.random()-.5)*20; paint(); }
  }
  piecesEl.addEventListener('pointerup', drop); piecesEl.addEventListener('pointercancel', drop);
  document.getElementById('helper').addEventListener('click', function(){
    var p = pieces.find(function(q){ return !q.set; }); if (p) setPiece(p);
  });

  /* ---- live: everyone with the page open shares one board through room presence ---- */
  function share(){ if (room) room.presence({placed:Array.from(mine)}).catch(function(){}); }
  var peerEls = new Map();
  function peersPaint(){
    if (!room) return;
    room.peers().forEach(function(pr){
      if (pr.sameTab) return; var el = peerEls.get(pr.peer), c = pr.presence || {};
      if (typeof c.cx !== 'number' || typeof c.cy !== 'number') return;
      if (!el){ el = document.createElement('div'); el.className = 'peer'; el.innerHTML = '<i></i><span>Someone</span>'; peersEl.appendChild(el); peerEls.set(pr.peer, el); }
      el.style.transform = 'translate('+(T.x + c.cx*T.w - 8)+'px,'+(T.y + c.cy*T.h - 8)+'px)';
    });
  }
  function onRoom(ch){
    var liveN = ch.peers.length;
    document.getElementById('live').classList.toggle('on', liveN > 1);
    document.getElementById('liveT').textContent = liveN > 1 ? liveN+' people building right now' : 'Only you, for now';
    ch.left.forEach(function(pr){ var el = peerEls.get(pr.peer); if (el){ el.remove(); peerEls.delete(pr.peer); } });
    others = new Set();
    ch.peers.forEach(function(pr){ if (pr.sameTab) return; var pl = pr.presence && pr.presence.placed; if (Array.isArray(pl)) pl.forEach(function(i){ if (Number.isInteger(i)) others.add(i); }); });
    others.forEach(function(i){ var p = pieces[i]; if (p && !p.set) setPiece(p, true); });
    peersPaint();
  }
  if (window.claude && claude.use) claude.use('room').then(function(r){
    if (!r) return; room = r;
    document.getElementById('sub').textContent = 'Everyone with this page open is building the same logo. Their cursors are the orange rings.';
    room.onPeers(onRoom, function(){ room = null; });
    share();
  }).catch(function(){});
})();
</script>
