<title>The Studio Sign</title>
<!--@head-->
<style>
.stage{background:radial-gradient(120% 80% at 60% 20%,#0d0d7c 0%,var(--navy) 55%,#00004c 100%)}
.hang,.shade{position:absolute;top:0;left:var(--px,60%);width:0;height:0;transform:rotate(var(--th,0rad));will-change:transform}
.shade{transform:translate(22px,30px) rotate(var(--th,0rad));opacity:.55}
.shade i{position:absolute;left:calc(var(--sw) / -2);top:var(--L);width:var(--sw);height:var(--sh);border-radius:18px;background:#00001e;filter:blur(20px);transform:scaleX(var(--cosph,1))}
.string{position:absolute;left:-1px;top:0;width:2px;height:calc(var(--L) - var(--tri));background:#c7c9ec}
.tri{position:absolute;left:calc(var(--sw) / -2);top:calc(var(--L) - var(--tri));overflow:visible}
.hook{position:absolute;left:-7px;top:calc(var(--L) - var(--tri) - 7px);width:14px;height:14px;border-radius:50%;border:3px solid #c7c9ec;background:var(--navy)}
.wrap{position:absolute;left:calc(var(--sw) / -2);top:var(--L);width:var(--sw);height:var(--sh);perspective:1400px}
.card{position:absolute;inset:0;border:0;padding:0;margin:0;background:none;cursor:grab;transform-style:preserve-3d;transform:rotateY(var(--ph,0deg));touch-action:none;border-radius:18px}
.card:active{cursor:grabbing}
.card:focus-visible{outline:none}
.card:focus-visible .face{outline:3px solid var(--orange);outline-offset:4px}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;align-content:center;justify-items:center;text-align:center;gap:.6rem;padding:1.4rem;overflow:hidden}
.front{background:#ffffff;color:var(--navy)}
.front .ey{font:600 .72rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:#c95000}
.front .big{font:700 clamp(2.2rem,5.4vw,3.6rem)/.92 var(--display);letter-spacing:-.035em;margin:0}
.front .rule{width:52px;height:5px;background:var(--orange);border-radius:3px}
.front .sub{font:500 .95rem/1.3 var(--body);color:#2b2b6e;margin:0}
.front::before,.back::before{content:"";position:absolute;top:12px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#c7c9ec;box-shadow:inset 0 2px 2px rgba(0,0,0,.3)}
.back{background:#0a0a0a;color:var(--white);transform:rotateY(180deg)}
.back .ey{font:600 .72rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--orange)}
.back .sub{font:500 .9rem/1.3 var(--body);color:#c9c9c9;margin:0}
.flaps{display:flex;align-items:center;gap:.3rem}
.flaps .colon{font:700 2rem/1 var(--display);color:#555;padding:0 .1rem}
.fl{position:relative;width:clamp(2rem,4.4vw,2.8rem);height:clamp(3rem,6.4vw,4rem);font:700 clamp(2rem,4.6vw,3rem)/1 var(--display);color:var(--orange);perspective:300px}
.fl>span{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#1c1c1c;display:block}
.fl>span b{position:absolute;left:0;right:0;height:200%;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.fl .t{top:0;border-radius:6px 6px 0 0}.fl .t b{top:0}
.fl .bt{bottom:0;border-radius:0 0 6px 6px}.fl .bt b{bottom:0}
.fl .ft{top:0;border-radius:6px 6px 0 0;transform-origin:50% 100%;z-index:2}.fl .ft b{top:0}
.fl .fb{bottom:0;border-radius:0 0 6px 6px;transform-origin:50% 0;z-index:2;transform:rotateX(90deg)}.fl .fb b{bottom:0}
.fl::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#0a0a0a;z-index:3}
.fl.go .ft{animation:ft .28s ease-in forwards}
.fl.go .fb{animation:fb .28s .26s ease-out forwards}
@keyframes ft{to{transform:rotateX(-90deg)}}
@keyframes fb{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.hint{position:absolute;left:var(--px,60%);top:calc(var(--L) + var(--sh) + 5.5rem);transform:translateX(-50%);margin:0;font:500 .9rem/1 var(--body);color:var(--mist);display:flex;gap:.5rem;align-items:center;transition:opacity .5s;white-space:nowrap}
.hint kbd{font:600 .75rem/1 var(--body);background:var(--white);color:var(--black);border-radius:6px;padding:.3rem .45rem}
.hint.gone{opacity:0}
@media (max-width:999px){.hint{top:auto;bottom:130px}}
</style>
<main class="stage" id="stage" data-n="04" data-name="The studio sign">
  <div class="shade" id="shade" aria-hidden="true"><i></i></div>
  <div class="hang" id="hang">
    <div class="string" aria-hidden="true"></div>
    <svg class="tri" id="tri" aria-hidden="true"></svg>
    <div class="hook" aria-hidden="true"></div>
    <div class="wrap">
      <button class="card" id="card" type="button" aria-label="Studio sign. Back shortly. Press to flip it and see the countdown.">
        <span class="face front" aria-hidden="true">
          <span class="ey">We Dig Creativity · Studio</span>
          <span class="big">Back<br>shortly</span>
          <span class="rule"></span>
          <span class="sub">Out for a rethink. Flick me.</span>
        </span>
        <span class="face back" aria-hidden="true">
          <span class="ey">Back in</span>
          <span class="flaps" id="flaps"></span>
          <span class="sub" id="backsub">…</span>
        </span>
      </button>
    </div>
  </div>
  <p class="hint" id="hint">Drag it, flick it, or tap to flip <kbd>Enter</kbd></p>
  <p class="sr" id="sr" aria-live="polite"></p>
</main>
<!--@dock-->
<!--@js-->
<script>
(function(){
  var stage = document.getElementById('stage'), hang = document.getElementById('hang'), shade = document.getElementById('shade'), card = document.getElementById('card'), hint = document.getElementById('hint');
  var geo = {};
  function size(){
    var left = innerWidth >= 1000 ? 26*16 + 32 : 0;
    var px = left + (innerWidth - left)/2;
    var sw = Math.min(400, (innerWidth - left)*.78), sh = sw*.66, L = Math.max(150, innerHeight*.26), tri = 70;
    geo = {px:px, sw:sw, sh:sh, L:L};
    [stage].forEach(function(e){
      e.style.setProperty('--px', px+'px'); e.style.setProperty('--sw', sw+'px'); e.style.setProperty('--sh', sh+'px');
      e.style.setProperty('--L', L+'px'); e.style.setProperty('--tri', tri+'px');
    });
    var t = document.getElementById('tri'); t.setAttribute('width', sw); t.setAttribute('height', tri);
    t.innerHTML = '<path d="M'+(sw/2)+' 0 L'+(sw/2-sw*.28)+' '+(tri+12)+' M'+(sw/2)+' 0 L'+(sw/2+sw*.28)+' '+(tri+12)+'" stroke="#c7c9ec" stroke-width="2" fill="none"/>';
  }
  addEventListener('resize', size); size();

  /* ---- split-flap countdown ---- */
  var flaps = document.getElementById('flaps'), cells = [];
  for (var i = 0; i < 6; i++){
    if (i === 2 || i === 4){ var c = document.createElement('span'); c.className = 'colon'; c.textContent = ':'; flaps.appendChild(c); }
    var f = document.createElement('span'); f.className = 'fl';
    f.innerHTML = '<span class="t"><b>0</b></span><span class="bt"><b>0</b></span><span class="ft"><b>0</b></span><span class="fb"><b>0</b></span>';
    flaps.appendChild(f); cells.push({el:f, v:'0'});
  }
  function setCell(c, v){
    if (c.v === v) return;
    var q = function(s){ return c.el.querySelector(s+' b'); };
    q('.ft').textContent = c.v; q('.bt').textContent = c.v; q('.t').textContent = v; q('.fb').textContent = v;
    c.el.classList.remove('go'); void c.el.offsetWidth; c.el.classList.add('go');
    clearTimeout(c.tm); c.tm = setTimeout(function(){ q('.bt').textContent = v; }, 560);
    c.v = v;
  }
  document.getElementById('backsub').textContent = WDC.fmt(WDC.backBy, 'Africa/Lagos') + ' · Lagos time';
  function tick(){
    var s = Math.max(0, Math.round((WDC.backBy - Date.now())/1000));
    var str = String(Math.min(99, Math.floor(s/3600))).padStart(2,'0') + String(Math.floor(s%3600/60)).padStart(2,'0') + String(s%60).padStart(2,'0');
    for (var i = 0; i < 6; i++) setCell(cells[i], str[i]);
  }
  tick(); setInterval(function(){ if (!document.hidden) tick(); }, 1000);

  /* ---- physics: a pendulum (th) plus a twist on the string (ph) that rests face out or face back ---- */
  var th = .22, thv = 0, ph = 0, phv = 0, drag = null, t0 = 0;
  var G = 9.5, DAMP = .32, TW = 14, TDAMP = 1.3;
  function render(){
    hang.style.setProperty('--th', th+'rad'); shade.style.setProperty('--th', th+'rad');
    card.style.setProperty('--ph', ph+'deg');
    shade.style.setProperty('--cosph', Math.max(.05, Math.abs(Math.cos(ph*Math.PI/180))));
  }
  function facing(){ var k = Math.round(ph/180); return Math.abs(k)%2 ? 'back' : 'front'; }
  var lastFace = 'front';
  function announce(){
    var f = facing(); if (f === lastFace || Math.abs(phv) > 30) return; lastFace = f;
    document.getElementById('sr').textContent = f === 'back' ? 'The sign shows the countdown: back in ' + WDC.fmtLeft(WDC.backBy - Date.now()) + '.' : 'The sign reads: back shortly.';
  }
  function flip(dir){ phv += (dir||1)*520; gone(); }
  function gone(){ hint.classList.add('gone'); }

  if (WDC.reduced){ th = 0; render(); }
  else WDC.loop(function(dt, now){
    if (!dt) return;
    if (!drag){
      thv += (-G*Math.sin(th) - DAMP*thv + Math.sin(now/1900)*.05)*dt;
      th += thv*dt;
    }
    var r = ph*Math.PI/180;
    phv += (-TW*Math.sin(2*r)*57.3 - TDAMP*phv)*dt;
    ph += phv*dt;
    render(); announce();
  });

  card.addEventListener('pointerdown', function(e){
    card.setPointerCapture(e.pointerId);
    drag = {x:e.clientX, y:e.clientY, lx:e.clientX, lt:performance.now(), moved:0, off:th + Math.atan2(e.clientX - geo.px, e.clientY)};
    t0 = performance.now(); thv = 0; gone();
  });
  card.addEventListener('pointermove', function(e){
    if (!drag) return;
    var now = performance.now(), a = -Math.atan2(e.clientX - geo.px, e.clientY) + drag.off;
    a = Math.max(-1.3, Math.min(1.3, a));
    var dtm = Math.max(1, now - drag.lt)/1000;
    thv = thv*.5 + ((a - th)/dtm)*.5; th = a;
    drag.vx = (e.clientX - drag.lx)/dtm; drag.lx = e.clientX; drag.lt = now;
    drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
    if (WDC.reduced) render();
  });
  function up(){
    if (!drag) return;
    var quick = performance.now() - t0 < 320 && drag.moved < 8;
    if (quick) flip(1);
    else if (Math.abs(drag.vx||0) > 900) phv += (drag.vx > 0 ? 1 : -1) * Math.min(1400, Math.abs(drag.vx)*.5);
    thv = Math.max(-6, Math.min(6, thv));
    drag = null;
    if (WDC.reduced){ th = 0; ph = quick ? (Math.round(ph/180)+1)*180 : ph; render(); announce(); }
  }
  card.addEventListener('pointerup', up); card.addEventListener('pointercancel', up);
  card.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft'){ thv -= 1.4; gone(); e.preventDefault(); }
    if (e.key === 'ArrowRight'){ thv += 1.4; gone(); e.preventDefault(); }
  });
  card.addEventListener('click', function(e){
    if (e.detail === 0){ /* keyboard */ if (WDC.reduced){ ph = (Math.round(ph/180)+1)*180; render(); announce(); } else flip(1); }
  });
  render();
})();
</script>
