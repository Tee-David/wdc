<section aria-label="{{deckTitle}}" data-tour="deck">
                  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap">
                    <h2 style="font-size: 17px; font-weight: 700">{{deckTitle}}</h2>
                    <span class="strip" role="img" aria-label="{{stripLabel}}"><sc-for list="{{strip}}" as="sg" hint-placeholder-count="6"><span class="{{sg.cls}}"></span></sc-for></span>
                    <span class="num" style="color: var(--dim); font-size: 13px">{{stripText}}</span>
                    <span class="hideS" style="margin-left: auto; color: var(--dim); font-size: 12px">{{deckKeys}}</span>
                  </div>
                  <sc-if value="{{hasTop}}" hint-placeholder-val="{{ true }}">
                    <div class="deck {{top.deckCls}}">
                      <sc-if value="{{hasG1}}" hint-placeholder-val="{{ true }}"><span class="ghost" aria-hidden="true"></span></sc-if>
                      <sc-if value="{{hasG2}}" hint-placeholder-val="{{ true }}"><span class="ghost g2" aria-hidden="true"></span></sc-if>
                      <article class="topCard onDark {{top.kidCls}}" tabindex="0" onKeyDown="{{deckKey}}" aria-label="{{top.aria}}" style="animation-name: {{top.anim}}; animation-duration: {{top.dur}}; animation-timing-function: {{top.ease}}; animation-fill-mode: {{top.fill}}">
                        <div class="tags">
                          <span class="tag" style="background: #fff; color: #000065">{{top.kind}}</span>
                          <span class="tag" style="background: {{top.utone}}; color: #fff">{{top.urgency}}</span>
                          <span class="projLbl num" style="margin-left: auto; font-size: 13px; color: var(--heroDim)">{{top.label}}</span>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 8px">
                          <h3 class="cardH">{{top.title}}</h3>
                          <p style="color: var(--heroDim); font-size: 15px">{{top.body}}</p>
                        </div>
                        <sc-if value="{{top.hasSteps}}" hint-placeholder-val="{{ false }}">
                          <div style="display: flex; flex-direction: column; gap: 8px">
                            <span style="display: flex; justify-content: space-between; font-size: 13px; color: var(--heroDim)"><span>Steps</span><span class="num">{{top.stepText}}</span></span>
                            <span style="height: 8px; border-radius: 99px; background: rgb(255 255 255/.14); overflow: hidden"><span style="display: block; height: 100%; width: {{top.stepPct}}%; background: #ff6500; border-radius: 99px; transition: width .45s var(--ease)"></span></span>
                            <div style="display: flex; flex-wrap: wrap; gap: 6px">
                              <sc-for list="{{top.stepList}}" as="st" hint-placeholder-count="4">
                                <button class="stepChip {{st.cls}}" role="checkbox" aria-checked="{{st.pressed}}" onClick="{{st.toggle}}"><span class="stepBox"><sc-if value="{{st.on}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="10" height="10" aria-hidden="true" style="stroke-width: 3.4"><path pathLength="1" d="M20 6 9 17l-5-5"></path></svg></sc-if></span>{{st.t}}</button>
                              </sc-for>
                            </div>
                          </div>
                        </sc-if>
                        <sc-if value="{{top.isLogo}}" hint-placeholder-val="{{ false }}">
                          <div style="display: flex; flex-direction: column; gap: 8px">
                            <div class="routes" id="routes" role="radiogroup" aria-label="Choose a route" onScroll="{{routeScroll}}">
                              <sc-for list="{{routes}}" as="r" hint-placeholder-count="2">
                                <button class="route {{r.cls}}" role="radio" aria-checked="{{r.checked}}" onClick="{{r.pick}}">
                                  <span class="routePrev" style="background: {{r.bg}}"><span class="disp" style="font-size: clamp(20px, 5cqi, 30px); font-weight: 700; color: {{r.fg}}; letter-spacing: -.04em">{{r.mark}}</span><sc-if value="{{r.isSel}}" hint-placeholder-val="{{ false }}"><span class="tag pickTag"><svg class="ic" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" style="stroke-width: 3"><path d="M20 6 9 17l-5-5"></path></svg>Your pick</span></sc-if></span>
                                  <strong style="font-size: 14px; padding: 0 4px">{{r.name}}</strong>
                                  <span class="rNote" style="font-size: 12px; color: var(--heroDim); padding: 0 4px 4px">{{r.note}}</span>
                                </button>
                              </sc-for>
                            </div>
                            <span class="railDots" aria-hidden="true"><sc-for list="{{routeDots}}" as="rd" hint-placeholder-count="2"><span class="{{rd}}"></span></sc-for></span>
                            <button class="lnk" style="color: #fff; align-self: flex-start; min-height: 44px" onClick="{{openRouteFile}}">See both routes full size<svg class="ic arr" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></button>
                          </div>
                        </sc-if>
                        <sc-if value="{{top.hasMeta}}" hint-placeholder-val="{{ true }}">
                          <dl class="meta"><sc-for list="{{top.meta}}" as="m" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; min-width: 0"><dt>{{m.k}}</dt><dd class="num">{{m.v}}</dd></div></sc-for></dl>
                        </sc-if>
                        <sc-if value="{{top.hasWhy}}" hint-placeholder-val="{{ true }}">
                          <p class="why"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="margin-top: 2px; color: #ffb27a"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"></path></svg><span>{{top.why}}</span></p>
                        </sc-if>
                        <div class="deckActs">
                          <button class="hb grow" onClick="{{top.primary}}">{{top.primaryLabel}}<svg class="ic arr" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></button>
                          <button class="hb2 grow" onClick="{{top.secondary}}">{{top.secondaryLabel}}</button>
                          <span class="sp"></span>
                          <div class="deckTools">
                            <button class="hb2 tipU" data-menu="snooze" data-tip="{{snoozeLabel}}" onClick="{{openSnooze}}" aria-haspopup="menu" aria-label="{{snoozeLabel}}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2"></path></svg><span class="tLbl">{{snoozeShort}}</span></button>
                            <sc-if value="{{canPass}}" hint-placeholder-val="{{ true }}"><button class="hb2 tipU" data-menu="delegate" data-tip="Hand over" onClick="{{openDelegate}}" aria-haspopup="dialog" aria-label="Hand over"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6"></path></svg><span class="tLbl">Hand over</span></button></sc-if>
                            <button class="hb2 tipU ib" data-tip="Open details" onClick="{{top.details}}" aria-label="Open details" style="padding: 0 14px"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></button>
                          </div>
                        </div>
                        <sc-if value="{{top.stamp}}" hint-placeholder-val="{{ false }}"><span class="stamp" style="--st: {{top.stampTone}}; --cx: {{top.cx}}; --cy: {{top.cy}}" aria-hidden="true"><span class="stampRing"></span><span class="stampIn"><svg class="stampIc" viewBox="0 0 52 52" width="64" height="64"><circle class="stC" cx="26" cy="26" r="23" pathLength="1"></circle><path class="stP" d="{{top.stampD}}" pathLength="1"></path></svg><span class="stampL">{{top.stampLabel}}</span></span></span></sc-if>
                      </article>
                    </div>
                  </sc-if>
                  <sc-if value="{{deckEmpty}}" hint-placeholder-val="{{ false }}">
                    <div class="card empty" role="status">
                      <span class="emptyIc"><svg class="ic" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" style="stroke-width: 2.6"><path pathLength="1" d="M20 6 9 17l-5-5"></path></svg></span>
                      <h3>{{emptyTitle}}</h3>
                      <p style="color: var(--dim)">{{emptyBody}} <strong style="color: var(--ink)">{{emptyNext}}</strong></p>
                      <div class="emptyActs"><button class="btn" onClick="{{emptyPrimary}}">{{emptyPrimaryLabel}}</button><button class="btn2" onClick="{{restoreDeck}}">{{emptySecondaryLabel}}</button></div>
                    </div>
                  </sc-if>
                </section>
