<div class="pageHead rise">
              <div>
                <h1 class="h1">Money</h1>
                <p class="lede">{{ledeA}} <strong style="color: var(--ad-ink)">{{ledeB}}</strong></p>
              </div>
              <div class="headActs">
                <button class="btn" onClick="{{newInvoice}}" data-tour="new"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New invoice</button>
                <button class="ibtn" data-menu="chores" aria-label="More for money" aria-haspopup="menu" aria-expanded="{{choresX}}" onClick="{{openChores}}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path></svg></button>
              </div>
            </div>
            %%SKEL%%
            <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
            <div class="layout">
              <div class="col">
                %%DECK%%

                <section class="card cq rise d2" aria-label="Money records" data-tour="table" style="overflow: hidden">
                  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; flex-wrap: wrap">
                    <h2 style="font-size: 17px; font-weight: 700">{{tabTitle}}</h2>
                    <span class="tag num" style="background: var(--ad-tone-flat); color: var(--ad-on-flat)">{{total}}</span>
                    <span style="flex: 1"></span>
                    <label class="sfield">
                      <svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="color: var(--ad-dim)"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>
                      <span class="sr">Search</span>
                      <input value="{{q}}" onChange="{{onQ}}" placeholder="{{qPh}}">
                      <sc-if value="{{hasQ}}" hint-placeholder-val="{{ false }}"><button class="clr" aria-label="Clear search" onClick="{{clearQ}}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></sc-if>
                    </label>
                    <button class="btn2" style="min-height: 44px" onClick="{{tabAct}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="{{tabActD}}"></path></svg>{{tabActLabel}}</button>
                  </div>
                  <div role="tablist" aria-label="Money records" class="tabs">
                    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
                      <button role="tab" class="tab {{tb.cls}}" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}">{{tb.label}}<span class="tag num" style="background: {{tb.chip}}; color: {{tb.ink}}; height: 20px; padding: 0 7px">{{tb.n}}</span></button>
                    </sc-for>
                  </div>
                  <div class="chips svcChips" role="group" aria-label="Filter" style="padding: 12px 20px"><sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button class="chip {{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.t}}<span class="num" style="opacity: .75">{{c.n}}</span></button></sc-for></div>
                  <div class="tblWrap" tabindex="0" aria-label="Table, scrolls sideways">
                    <table class="tbl">
                      <thead><tr><sc-for list="{{cols}}" as="h" hint-placeholder-count="5"><th scope="col" class="{{h.cls}}">{{h.t}}</th></sc-for><th scope="col"><span class="sr">Actions</span></th></tr></thead>
                      <tbody>
                        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
                          <tr class="rowIn" tabindex="0" aria-label="{{r.aria}}" onClick="{{r.open}}" onKeyDown="{{r.key}}" style="animation-name: {{r.anim}}; animation-delay: {{r.delay}}">
                            <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="5">
                              <td class="{{c.cls}}">
                                <sc-if value="{{c.isTag}}" hint-placeholder-val="{{ false }}"><span class="tag" style="background: {{c.tone}}; color: {{c.ink}}">{{c.t}}</span></sc-if>
                                <sc-if value="{{c.isTwo}}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-direction: column; min-height: 40px; justify-content: center"><strong class="{{c.tcls}}" style="font-weight: 600">{{c.t}}</strong><span style="color: var(--ad-dim); font-size: 12px">{{c.s}}</span></span></sc-if>
                                <sc-if value="{{c.isOne}}" hint-placeholder-val="{{ false }}"><span class="{{c.tcls}}" style="color: {{c.col}}; font-weight: {{c.fw}}">{{c.t}}</span></sc-if>
                              </td>
                            </sc-for>
                            <td style="text-align: right"><button class="ibtn ghostB" data-menu="row" aria-expanded="{{r.menuX}}" aria-label="{{r.menuAria}}" aria-haspopup="menu" onClick="{{r.menu}}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path></svg></button></td>
                          </tr>
                        </sc-for>
                      </tbody>
                    </table>
                    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
                      <div class="emptyRow rowIn" style="animation-name: rinA"><strong>{{emptyTitleT}}</strong><span style="color: var(--ad-dim)">{{emptyBodyT}}</span><sc-if value="{{hasFilter}}" hint-placeholder-val="{{ false }}"><button class="btn2" onClick="{{clearFilters}}">Clear filters</button></sc-if><sc-if value="{{noFilterEmpty}}" hint-placeholder-val="{{ false }}"><button class="btn" onClick="{{tabAct}}">{{tabActLabel}}</button></sc-if></div>
                    </sc-if>
                  </div>
                  %%PAGER:MP:Record%%
                </section>
              </div>

              <aside class="railCards" aria-label="Money pulse" data-tour="rail">
                <div class="bentoWrap" style="display: flex; flex-direction: column; gap: 10px">
                  <div style="display: flex; align-items: center"><h2 style="font-size: 16px; font-weight: 700; flex: 1">Money pulse</h2></div>
                  <div class="bento">
                    <sc-for list="{{stats}}" as="k" hint-placeholder-count="4">
                      <button class="card lift rise stat {{k.delay}}" onClick="{{k.open}}" aria-label="{{k.aria}}" style="--k: {{k.dot}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-align: left; min-height: 104px">
                        <span class="statHd"><span class="statIc" style="background: {{k.tile}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="{{k.ic}}"></path></svg></span><span class="statLbl">{{k.label}}</span></span>
                        <span class="num" style="font-size: clamp(22px, 2.4vw, 26px); font-weight: 700; line-height: 1.1">{{k.value}}</span>
                        <span style="font-size: 12px; font-weight: 600; color: {{k.noteCol}}">{{k.note}}</span>
                      </button>
                    </sc-for>
                  </div>
                </div>

                <section class="card rise d3" aria-label="How people pay" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
                  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px"><h2 style="font-size: 16px; font-weight: 700; flex: 1">How people pay</h2><span style="font-size: 12px; color: var(--ad-dim)">October</span></div>
                  <sc-for list="{{ways}}" as="w" hint-placeholder-count="4">
                    <button class="rowh svcRow {{w.cls}}" onClick="{{w.pick}}" aria-label="{{w.aria}}">
                      <span class="svcIc" style="background: {{w.tone}}"><svg class="ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="{{w.d}}"></path></svg></span>
                      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px"><span style="display: flex; gap: 8px; font-size: 13px"><strong style="flex: 1; font-weight: 600">{{w.t}}</strong><span class="num" style="color: var(--ad-dim)">{{w.v}}</span></span><span class="miniBar" aria-hidden="true"><span style="width: {{w.pct}}%"></span></span></span>
                    </button>
                  </sc-for>
                </section>

                <section class="card rise d4" aria-label="Bank accounts" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
                  <div style="display: flex; align-items: center; gap: 8px"><h2 style="font-size: 16px; font-weight: 700; flex: 1">Bank accounts</h2></div>
                  <sc-for list="{{banks}}" as="bk" hint-placeholder-count="2">
                    <button class="rowh" onClick="{{bk.open}}" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; width: 100%; text-align: left; min-height: 44px">
                      <span class="svcIc" style="background: var(--ad-tone-brand)"><svg class="ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="{{bk.d}}"></path></svg></span>
                      <span style="flex: 1; min-width: 0; font-size: 13px"><strong>{{bk.t}}</strong><br><span style="color: var(--ad-dim)">{{bk.s}}</span></span>
                      <span class="tag" style="background: {{bk.tone}}; color: {{bk.ink}}">{{bk.tag}}</span>
                    </button>
                  </sc-for>
                </section>

                <section class="card rise d5" aria-label="Coming up" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
                  <div style="display: flex; align-items: center"><h2 style="font-size: 16px; font-weight: 700; flex: 1">Coming up</h2></div>
                  <sc-for list="{{upcoming}}" as="u" hint-placeholder-count="5">
                    <button class="rowh" onClick="{{u.open}}" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; width: 100%; text-align: left; min-height: 44px">
                      <span class="tag num" style="background: {{u.tone}}; color: #fff; min-width: 66px; justify-content: center">{{u.when}}</span>
                      <span style="flex: 1; min-width: 0; font-size: 13px"><strong>{{u.t}}</strong><br><span style="color: var(--ad-dim)">{{u.s}}</span></span>
                      <span class="num" style="font-weight: 600; font-size: 13px">{{u.amount}}</span>
                    </button>
                  </sc-for>
                </section>
              </aside>
            </div>
            </sc-if>
