<div class="pageHead rise">
              <div>
                <h1 class="h1">Support</h1>
                <p class="lede">{{ledeA}} <strong style="color: var(--ad-ink)">{{ledeB}}</strong></p>
              </div>
              <div class="headActs">
                <button class="btn" onClick="{{newTicket}}" data-tour="new"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{newLabel}}</button>
                <button class="ibtn" data-menu="chores" aria-label="More for support" aria-haspopup="menu" aria-expanded="{{choresX}}" onClick="{{openChores}}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path></svg></button>
              </div>
            </div>
            %%SKEL%%
            <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
            <div class="layout">
              <div class="col">
                <sc-if value="{{hasDeck}}" hint-placeholder-val="{{ false }}">
                %%DECK%%
                </sc-if>

                <sc-if value="{{hasHero}}" hint-placeholder-val="{{ false }}">
                <section class="helpHero onDark rise" aria-label="Find an answer" data-tour="hero">
                  <div style="display: flex; flex-direction: column; gap: 6px">
                    <h2 class="cardH" style="font-size: clamp(22px, 3.2cqi, 30px)">{{hero.title}}</h2>
                    <p style="color: var(--ad-hero-dim); font-size: 15px">{{hero.body}}</p>
                  </div>
                  <label class="heroSearch">
                    <svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>
                    <span class="sr">Search the help articles</span>
                    <input value="{{sq}}" onChange="{{onSq}}" placeholder="{{hero.ph}}">
                    <sc-if value="{{hasSq}}" hint-placeholder-val="{{ false }}"><button class="clr" aria-label="Clear search" onClick="{{clearSq}}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></sc-if>
                  </label>
                  <div class="heroChips" role="group" aria-label="Popular questions"><sc-for list="{{hero.popular}}" as="pp" hint-placeholder-count="4"><button class="heroChip" onClick="{{pp.open}}">{{pp.t}}</button></sc-for></div>
                </section>
                </sc-if>

                <section class="card cq rise d2" aria-label="Tickets and articles" data-tour="table" style="overflow: hidden">
                  <div style="display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; flex-wrap: wrap">
                    <h2 style="font-size: 17px; font-weight: 700">{{tabTitle}}</h2>
                    <span class="tag num" style="background: var(--ad-tone-flat); color: var(--ad-on-flat)">{{total}}</span>
                    <span style="flex: 1"></span>
                    <label class="sfield">
                      <svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="color: var(--ad-dim)"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>
                      <span class="sr">Search</span>
                      <input value="{{sq}}" onChange="{{onSq}}" placeholder="{{qPh}}">
                      <sc-if value="{{hasSq}}" hint-placeholder-val="{{ false }}"><button class="clr" aria-label="Clear search" onClick="{{clearSq}}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></sc-if>
                    </label>
                  </div>
                  <div role="tablist" aria-label="Support" class="tabs">
                    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="2">
                      <button role="tab" class="tab {{tb.cls}}" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}">{{tb.label}}<span class="tag num" style="background: {{tb.chip}}; color: {{tb.ink}}; height: 20px; padding: 0 7px">{{tb.n}}</span></button>
                    </sc-for>
                  </div>
                  <div class="chips svcChips" role="group" aria-label="Filter" style="padding: 12px 20px"><sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button class="chip {{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.t}}<span class="num" style="opacity: .75">{{c.n}}</span></button></sc-for></div>

                  <sc-if value="{{isTickets}}" hint-placeholder-val="{{ true }}">
                  <div class="tblWrap" tabindex="0" aria-label="Tickets table, scrolls sideways">
                    <table class="tbl">
                      <thead><tr><sc-for list="{{cols}}" as="h" hint-placeholder-count="4"><th scope="col" class="{{h.cls}}">{{h.t}}</th></sc-for><th scope="col"><span class="sr">Actions</span></th></tr></thead>
                      <tbody>
                        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
                          <tr class="rowIn" tabindex="0" aria-label="{{r.aria}}" onClick="{{r.open}}" onKeyDown="{{r.key}}" style="animation-name: {{r.anim}}; animation-delay: {{r.delay}}">
                            <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4">
                              <td class="{{c.cls}}">
                                <sc-if value="{{c.isTag}}" hint-placeholder-val="{{ false }}"><span class="tag" style="background: {{c.tone}}; color: {{c.ink}}">{{c.t}}</span></sc-if>
                                <sc-if value="{{c.isTwo}}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-direction: column; min-height: 40px; justify-content: center; min-width: 180px"><strong class="{{c.tcls}}" style="font-weight: 600">{{c.t}}</strong><span style="color: var(--ad-dim); font-size: 12px">{{c.s}}</span></span></sc-if>
                                <sc-if value="{{c.isOne}}" hint-placeholder-val="{{ false }}"><span style="color: {{c.col}}">{{c.t}}</span></sc-if>
                              </td>
                            </sc-for>
                            <td style="text-align: right"><button class="ibtn ghostB" data-menu="row" aria-expanded="{{r.menuX}}" aria-label="{{r.menuAria}}" aria-haspopup="menu" onClick="{{r.menu}}"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path></svg></button></td>
                          </tr>
                        </sc-for>
                      </tbody>
                    </table>
                  </div>
                  </sc-if>

                  <sc-if value="{{isKb}}" hint-placeholder-val="{{ false }}">
                  <ul class="kbGrid">
                    <sc-for list="{{arts}}" as="a" hint-placeholder-count="4">
                      <li class="rowIn" style="animation-name: {{a.anim}}; animation-delay: {{a.delay}}"><button class="kbCard" onClick="{{a.open}}" aria-label="{{a.aria}}">
                        <span class="svcIc" style="background: {{a.tone}}"><svg class="ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="{{a.d}}"></path></svg></span>
                        <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0; text-align: left"><strong style="font-weight: 600">{{a.t}}</strong><span style="color: var(--ad-dim); font-size: 13px">{{a.s}}</span><span style="display: flex; gap: 8px; align-items: center; margin-top: 2px"><span class="tag" style="background: var(--ad-tone-flat); color: var(--ad-on-flat)">{{a.cat}}</span><span class="num" style="font-size: 12px; color: var(--ad-dim)">{{a.mins}}</span><sc-if value="{{a.draft}}" hint-placeholder-val="{{ false }}"><span class="tag" style="background: var(--ad-tone-warn); color: #fff">Draft</span></sc-if></span></span>
                      </button></li>
                    </sc-for>
                  </ul>
                  </sc-if>

                  <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
                    <div class="emptyRow rowIn" style="animation-name: rinA"><strong>{{emptyTitleT}}</strong><span style="color: var(--ad-dim)">{{emptyBodyT}}</span><sc-if value="{{hasFilter}}" hint-placeholder-val="{{ false }}"><button class="btn2" onClick="{{clearFilters}}">Clear filters</button></sc-if><button class="btn" onClick="{{emptyAct}}">{{emptyActLabel}}</button></div>
                  </sc-if>
                  %%PAGER:SP:Item%%
                </section>
              </div>

              <aside class="railCards" aria-label="Help and status" data-tour="rail">
                <sc-if value="{{hasStats}}" hint-placeholder-val="{{ false }}">
                <div class="bentoWrap" style="display: flex; flex-direction: column; gap: 10px">
                  <div style="display: flex; align-items: center"><h2 style="font-size: 16px; font-weight: 700; flex: 1">{{statsTitle}}</h2></div>
                  <div class="bento">
                    <sc-for list="{{stats}}" as="k" hint-placeholder-count="4">
                      <button class="card lift rise stat {{k.delay}}" onClick="{{k.open}}" aria-label="{{k.aria}}" style="--k: {{k.dot}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-align: left; min-height: 104px">
                        <span class="statHd"><span class="statIc" style="background: {{k.tile}}"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="{{k.ic}}"></path></svg></span><span class="statLbl">{{k.label}}</span></span>
                        <span class="num" style="font-size: clamp(22px, 2.4vw, 26px); font-weight: 700; line-height: 1.1">{{k.value}}</span>
                        <span style="font-size: 12px; font-weight: 600; color: {{k.noteCol}}">{{k.note}}</span>
                      </button>
                    </sc-for>
                  </div>
                </div>
                </sc-if>
                <sc-for list="{{railCards}}" as="rc" hint-placeholder-count="2">
                  <section class="card rise {{rc.delay}}" aria-label="{{rc.title}}" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
                    <div style="display: flex; align-items: center; gap: 8px"><h2 style="font-size: 16px; font-weight: 700; flex: 1">{{rc.title}}</h2><sc-if value="{{rc.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: var(--ad-dim)">{{rc.sub}}</span></sc-if></div>
                    <sc-if value="{{rc.hasNote}}" hint-placeholder-val="{{ false }}"><p style="font-size: 13px; color: var(--ad-dim)">{{rc.note}}</p></sc-if>
                    <sc-for list="{{rc.rows}}" as="r" hint-placeholder-count="3">
                      <button class="rowh" onClick="{{r.open}}" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; width: 100%; text-align: left; min-height: 44px">
                        <span class="svcIc" style="background: {{r.tone}}"><svg class="ic" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="{{r.d}}"></path></svg></span>
                        <span style="flex: 1; min-width: 0; font-size: 13px"><strong>{{r.t}}</strong><br><span style="color: var(--ad-dim)">{{r.s}}</span></span>
                        <sc-if value="{{r.hasTag}}" hint-placeholder-val="{{ false }}"><span class="tag" style="background: {{r.tagTone}}; color: {{r.tagInk}}">{{r.tag}}</span></sc-if>
                      </button>
                    </sc-for>
                    <sc-if value="{{rc.hasAct}}" hint-placeholder-val="{{ false }}"><button class="btn2" style="align-self: stretch" onClick="{{rc.act}}">{{rc.actLabel}}</button></sc-if>
                  </section>
                </sc-for>
              </aside>
            </div>
            </sc-if>
