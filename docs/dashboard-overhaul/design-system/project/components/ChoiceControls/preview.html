<!doctype html>
<html>
<head><meta charset="utf-8"><title>ChoiceControls</title></head>
<body style="margin:0">
<div class="wdc pv">
<div class="stack" style="max-width:460px"><div class="chips"><button class="chip">Today 16:00</button><button class="chip on" aria-checked="true">Tomorrow 09:00</button><button class="chip">Tue 14 Oct</button></div>
<button class="chk on" role="checkbox" aria-checked="true"><span class="box"><svg class="ic" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" style='stroke-width:3'><path pathLength="1" d="M20 6 9 17l-5-5"></path></svg></span><span style="flex:1;text-align:left">Add VAT at 7.5%</span></button>
<div class="item on" role="radio" aria-checked="true"><span class="radio"></span><span class="t"><strong>They promised to pay</strong><span>We look for ₦850,000 on Tuesday and tell you either way</span></span></div>
<div class="row"><button class="switch" role="switch" aria-checked="true" aria-label="Email me when a client pays"></button><span>Email me when a client pays</span></div></div>
</div>
<script>/* static */</script>
</body>
</html>
